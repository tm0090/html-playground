<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --danger: #f43f5e;
            --edit: #10b981;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 80px 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            max-width: 850px;
            margin-bottom: 48px;
        }

        .title-section h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            margin: 0 0 8px 0;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-dim);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .btn:hover {
            border-color: var(--accent);
            color: var(--text);
            background: #243147;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg);
            border: none;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #7dd3fc;
            color: var(--bg);
        }

        #link-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 850px;
        }

        .link-card {
            background: var(--card);
            padding: 32px 16px 24px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            cursor: grab;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255,255,255,0.05);
            text-decoration: none;
        }

        .link-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255,255,255,0.15);
            background: #243147;
        }

        .favicon {
            width: 40px;
            height: 40px;
            margin-bottom: 16px;
            border-radius: 10px;
            background: #0f172a;
            padding: 4px;
        }

        .label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-dim);
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-card:hover .label { color: var(--text); }

        .controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 6px;
            opacity: 0;
        }

        .link-card:hover .controls { opacity: 1; }

        .icon-btn {
            width: 26px;
            height: 26px;
            background: var(--bg);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .delete-btn:hover { color: var(--danger); border-color: var(--danger); }
        .edit-btn:hover { color: var(--edit); border-color: var(--edit); }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-section">
            <h1>Workspace</h1>
            <div class="actions">
                <button class="btn" onclick="exportLinks()">Export</button>
                <button class="btn" onclick="document.getElementById('importFile').click()">Import</button>
                <input type="file" id="importFile" accept=".json" onchange="importLinks(event)">
            </div>
        </div>
        <button class="btn btn-primary" onclick="addLink()">+ Add Link</button>
    </div>

    <div id="link-container"></div>

    <script>
        let links = JSON.parse(localStorage.getItem('myLinks')) || [
            { name: 'GST Physics', url: 'https://khanacademy.org' },
            { name: 'Chemistry Prep', url: 'https://chemguide.co.uk' }
        ];

        const container = document.getElementById('link-container');

        function render() {
            container.innerHTML = '';
            links.forEach((link, index) => {
                let domain;
                try { domain = new URL(link.url).hostname; } catch(e) { domain = 'link'; }
                
                const card = document.createElement('div');
                card.className = 'link-card';
                card.innerHTML = `
                    <div class="controls">
                        <div class="icon-btn edit-btn" onclick="editLink(event, ${index})">✎</div>
                        <div class="icon-btn delete-btn" onclick="deleteLink(event, ${index})">×</div>
                    </div>
                    <img class="favicon" src="https://www.google.com/s2/favicons?domain=${domain}&sz=128">
                    <span class="label">${link.name}</span>
                `;
                card.onclick = () => window.open(link.url, '_blank');
                container.appendChild(card);
            });
            localStorage.setItem('myLinks', JSON.stringify(links));
        }

        function addLink() {
            const url = prompt("URL (include https://):");
            if (url) {
                const name = prompt("Name:");
                if (name) {
                    links.push({ name, url });
                    render();
                }
            }
        }

        function editLink(event, index) {
            event.stopPropagation();
            const newName = prompt("Edit Name:", links[index].name);
            if (newName) {
                links[index].name = newName;
                render();
            }
        }

        function deleteLink(event, index) {
            event.stopPropagation();
            if(confirm("Remove this link?")) {
                links.splice(index, 1);
                render();
            }
        }

        function exportLinks() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(links));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "links_backup.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importLinks(event) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        links = imported;
                        render();
                    }
                } catch (err) {
                    alert("Invalid file format.");
                }
            };
            reader.readAsText(event.target.files[0]);
        }

        Sortable.create(container, {
            animation: 300,
            onEnd: function() {
                const newOrder = [];
                container.querySelectorAll('.label').forEach(el => {
                    const link = links.find(l => l.name === el.innerText);
                    if(link) newOrder.push(link);
                });
                links = newOrder;
                localStorage.setItem('myLinks', JSON.stringify(links));
            }
        });

        render();
    </script>
</body>
</html>
