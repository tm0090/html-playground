<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Video Finish Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #111827 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
        }

        /* Hide the "white thing" (default number arrows) */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .input-group label {
            display: block;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #334155;
            color: white;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1.5rem;
            cursor: auto;
        }

        input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 5px rgba(56, 189, 248, 0.15);
            background: rgba(15, 23, 42, 1);
            transform: translateY(-2px);
        }

        .result-box {
            background: rgba(56, 189, 248, 0.08);
            border-left: 6px solid #38bdf8;
            transition: all 0.3s ease;
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .calculate-btn {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            transition: all 0.3s ease;
        }
        
        .calculate-btn.live-active {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        /* Pulse animation for the tracking dot */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(56, 189, 248, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }
        .tracking-dot {
            animation: pulse-ring 2s infinite;
        }
    </style>
</head>
<body class="p-6">

    <div class="glass-card w-full max-w-2xl rounded-[2.5rem] p-10 md:p-14">
        <header class="mb-12 text-center">
            <h1 class="text-5xl font-black tracking-tight text-white mb-4">Finish Timer</h1>
            <p class="text-slate-400 text-xl font-light">Calculate exactly when you'll finish watching.</p>
        </header>

        <div class="space-y-10">
            <!-- Time Inputs -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <div class="input-group">
                    <label>Current Progress</label>
                    <div class="flex gap-4">
                        <input type="number" id="currH" placeholder="H" class="w-full py-5 rounded-2xl text-center font-semibold" min="0" value="0">
                        <input type="number" id="currM" placeholder="M" class="w-full py-5 rounded-2xl text-center font-semibold" min="0" max="59" value="0">
                        <input type="number" id="currS" placeholder="S" class="w-full py-5 rounded-2xl text-center font-semibold" min="0" max="59" value="0">
                    </div>
                </div>

                <div class="input-group">
                    <label>Total Duration</label>
                    <div class="flex gap-4">
                        <input type="number" id="totalH" placeholder="H" class="w-full py-5 rounded-2xl text-center font-semibold" min="0" value="0">
                        <input type="number" id="totalM" placeholder="M" class="w-full py-5 rounded-2xl text-center font-semibold" min="0" max="59" value="0">
                        <input type="number" id="totalS" placeholder="S" class="w-full py-5 rounded-2xl text-center font-semibold" min="0" max="59" value="0">
                    </div>
                </div>
            </div>

            <!-- Speed and Calculate -->
            <div class="flex flex-col md:flex-row gap-10 items-end">
                <div class="input-group flex-1 w-full">
                    <label>Playback Speed</label>
                    <div class="relative">
                        <input type="number" id="speed" step="0.05" value="1.00" class="w-full py-5 pl-8 pr-16 rounded-2xl font-bold" min="0.1">
                        <span class="absolute right-8 top-1/2 -translate-y-1/2 text-sky-400 font-black text-2xl">x</span>
                    </div>
                </div>
                <button id="calcBtn" onclick="activateLiveSystem()" class="calculate-btn w-full md:w-auto hover:brightness-110 text-white font-extrabold py-6 px-12 rounded-2xl transition-all transform active:scale-95 shadow-2xl shadow-sky-500/30 text-xl uppercase tracking-widest">
                    Calculate
                </button>
            </div>

            <!-- Results Section -->
            <div id="results" class="hidden space-y-6 animate-fade-in pt-6">
                <div class="result-box p-8 rounded-[2rem]">
                    <div class="flex justify-between items-center mb-3">
                        <p class="text-xs text-sky-400 font-black uppercase tracking-[0.2em]">Time Remaining</p>
                        <div class="flex items-center gap-2 text-xs text-sky-400 font-bold uppercase tracking-wider bg-sky-400/10 px-3 py-1 rounded-full hidden" id="liveBadge">
                            <span class="w-2 h-2 rounded-full bg-sky-400 tracking-dot"></span> Tracking
                        </div>
                    </div>
                    <h2 id="remainingDisplay" class="text-4xl font-bold text-white">0h 0m 0s</h2>
                    <p class="text-base text-slate-400 mt-2 font-medium">Watching at <span id="speedLabel" class="text-sky-300 font-bold">1.0</span>x speed</p>
                </div>

                <div class="bg-slate-900/40 p-8 rounded-[2rem] border border-slate-700/40 shadow-inner">
                    <p class="text-xs text-emerald-400 font-black uppercase tracking-[0.2em] mb-3">Target Arrival Time</p>
                    <h2 id="finishClockDisplay" class="text-5xl font-black text-white">--:-- --</h2>
                    <p id="finishDateLabel" class="text-base text-slate-400 mt-2 italic font-medium">Today</p>
                </div>
            </div>
        </div>

        <footer class="mt-16 text-center text-xs text-slate-500 uppercase tracking-[0.3em] font-bold opacity-40">
             MADE WITH ♥️ BY TAMIM
        </footer>
    </div>

    <script>
        let isSystemLive = false;
        let clockInterval;
        let exactCurrentSeconds = 0;
        let targetFinishTimestamp = 0;
        let lastTickTime = 0;

        // 1. Setup Input Event Listeners for Instant "Dynamic" Updates
        document.querySelectorAll('input[type="number"]').forEach(input => {
            input.addEventListener('input', () => {
                if (isSystemLive) performCalculations(false);
            });

            input.addEventListener('wheel', (e) => {
                e.preventDefault();
                
                const step = parseFloat(input.step) || 1;
                const direction = e.deltaY > 0 ? -1 : 1;
                let newValue = parseFloat(input.value || 0) + (direction * step);

                const min = input.hasAttribute('min') ? parseFloat(input.min) : -Infinity;
                const max = input.hasAttribute('max') ? parseFloat(input.max) : Infinity;
                
                if (newValue < min) newValue = min;
                if (newValue > max) newValue = max;

                if (step < 1) {
                    input.value = newValue.toFixed(2);
                } else {
                    input.value = Math.round(newValue);
                }

                if (isSystemLive) performCalculations(false);
            });
        });

        function activateLiveSystem() {
            isSystemLive = true;
            
            const btn = document.getElementById('calcBtn');
            btn.innerText = "Tracking...";
            btn.classList.add('live-active');
            
            document.getElementById('liveBadge').classList.remove('hidden');
            document.getElementById('results').classList.remove('hidden');

            performCalculations(false);

            if (clockInterval) clearInterval(clockInterval);
            clockInterval = setInterval(() => {
                if (isSystemLive) performCalculations(true); 
            }, 1000);
        }

        function performCalculations(isTickUpdate = false) {
            const totH = parseInt(document.getElementById('totalH').value) || 0;
            const totM = parseInt(document.getElementById('totalM').value) || 0;
            const totS = parseInt(document.getElementById('totalS').value) || 0;
            const durationTotalSeconds = (totH * 3600) + (totM * 60) + totS;

            const speed = parseFloat(document.getElementById('speed').value) || 1;

            if (!isTickUpdate) {
                const curH = parseInt(document.getElementById('currH').value) || 0;
                const curM = parseInt(document.getElementById('currM').value) || 0;
                const curS = parseInt(document.getElementById('currS').value) || 0;
                exactCurrentSeconds = (curH * 3600) + (curM * 60) + curS;
                
                lastTickTime = Date.now();
                
                const secondsLeft = Math.max(0, durationTotalSeconds - exactCurrentSeconds);
                const actualSecondsToWait = secondsLeft / speed;
                targetFinishTimestamp = Date.now() + (actualSecondsToWait * 1000);
            } else {
                const now = Date.now();
                const elapsedRealSeconds = (now - lastTickTime) / 1000;
                lastTickTime = now;
                
                exactCurrentSeconds += (elapsedRealSeconds * speed);
                
                if (exactCurrentSeconds >= durationTotalSeconds) {
                    exactCurrentSeconds = durationTotalSeconds;
                    clearInterval(clockInterval);
                    isSystemLive = false;
                    
                    const btn = document.getElementById('calcBtn');
                    btn.innerText = "Finished!";
                    btn.classList.remove('live-active');
                    document.getElementById('liveBadge').classList.add('hidden');
                }

                document.getElementById('currH').value = Math.floor(exactCurrentSeconds / 3600);
                document.getElementById('currM').value = Math.floor((exactCurrentSeconds % 3600) / 60);
                document.getElementById('currS').value = Math.floor(exactCurrentSeconds % 60);
            }

            if (durationTotalSeconds <= exactCurrentSeconds && !isTickUpdate) {
                if (durationTotalSeconds > 0) showError("Progress exceeds total duration!");
                return;
            }

            const secondsLeft = Math.max(0, durationTotalSeconds - exactCurrentSeconds);
            const actualSecondsToWait = secondsLeft / speed;

            const remH = Math.floor(actualSecondsToWait / 3600);
            const remM = Math.floor((actualSecondsToWait % 3600) / 60);
            const remS = Math.floor(actualSecondsToWait % 60);

            document.getElementById('remainingDisplay').innerText = `${remH}h ${remM}m ${remS}s`;
            document.getElementById('speedLabel').innerText = speed.toFixed(2);

            const finishDate = new Date(targetFinishTimestamp);
            const options = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            document.getElementById('finishClockDisplay').innerText = finishDate.toLocaleTimeString([], options);
            
            const isTomorrow = finishDate.getDate() !== new Date().getDate();
            document.getElementById('finishDateLabel').innerText = isTomorrow ? "Finishing tomorrow" : "Finishing today";
            document.getElementById('finishDateLabel').className = `text-base mt-2 italic font-medium ${isTomorrow ? 'text-amber-400' : 'text-slate-400'}`;
        }

        function showError(msg) {
            document.getElementById('remainingDisplay').innerText = "Invalid Range";
            document.getElementById('finishClockDisplay').innerText = "Check times";
            document.getElementById('finishDateLabel').innerText = msg;
            document.getElementById('finishDateLabel').className = "text-base mt-2 italic font-medium text-amber-400";
        }
    </script>
</body>
</html>
