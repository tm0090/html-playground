<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Remaining Tracker</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons for aesthetic components -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Set up Tailwind configuration for custom colors and fonts -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#818cf8', // Indigo 400 (Lighter for dark mode)
                        'secondary': '#a5b4fc', // Indigo 300
                        'accent': '#c084fc', // Purple 400 for gradients
                        'dark-bg': '#050505', // Almost Black
                        'card-bg': 'rgba(255, 255, 255, 0.03)', // Glass effect base
                        'text-light': '#f3f4f6', // Gray 100
                    },
                    fontFamily: {
                        display: ['var(--site-title-font)', 'Inter', 'sans-serif'],
                        sans: ['var(--heading-font)', 'Inter', 'sans-serif'], 
                        mono: ['var(--countdown-font)', 'ui-monospace', 'SFMono-Regular', 'monospace'],
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        glow: {
                            '0%': { boxShadow: '0 0 5px rgba(99, 102, 241, 0.2)' },
                            '100%': { boxShadow: '0 0 20px rgba(99, 102, 241, 0.6), 0 0 10px rgba(99, 102, 241, 0.4)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200..900&display=swap');
        
        :root {
            --site-title-font: 'Inter';
            --heading-font: 'Inter';
            --countdown-font: 'Inter'; 
        }

        /* Ambient Background Effect */
        body {
            background-color: #050505;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(76, 29, 149, 0.08), transparent 25%), 
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.08), transparent 25%);
            background-attachment: fixed;
        }

        /* Custom Scrollbar */
        body::-webkit-scrollbar {
            width: 6px;
        }
        body::-webkit-scrollbar-thumb {
            background-color: #374151;
            border-radius: 4px;
        }
        body::-webkit-scrollbar-track {
            background-color: transparent;
        }

        /* Card Glassmorphism - Border handled via Tailwind now */
        .glass-card {
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            /* border set in JS dynamically */
        }
        
        /* Modern Inputs */
        .glass-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f3f4f6;
        }
        .glass-input:focus {
            border-color: #818cf8;
            outline: none;
            box-shadow: 0 0 0 2px rgba(129, 140, 248, 0.2);
        }

        /* Typography */
        .countdown-number {
            font-size: clamp(1.5rem, 3.5vw, 2.5rem);
            line-height: 1;
            letter-spacing: -0.05em;
        }

        /* FAB */
        #add-button-fab {
            position: fixed;
            bottom: 32px;
            right: 32px;
            z-index: 50;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        /* Toggles */
        input[type="checkbox"].toggle-switch {
            appearance: none;
            -webkit-appearance: none;
            width: 40px;
            height: 22px;
            background-color: #374151;
            border-radius: 11px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        input[type="checkbox"].toggle-switch:checked {
            background-color: #6366f1;
        }
        input[type="checkbox"].toggle-switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 16px;
            height: 16px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        input[type="checkbox"].toggle-switch:checked::after {
            transform: translateX(18px);
        }
    </style>
    <div id="font-imports"></div>
</head>
<body class="font-sans text-text-light min-h-screen p-4 sm:p-6 selection:bg-indigo-500 selection:text-white">

    <!-- Decorative ambient light spots -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[800px] h-[300px] bg-indigo-600/10 rounded-full blur-[100px] pointer-events-none"></div>

    <!-- Header -->
    <header class="mb-8 text-center relative max-w-7xl mx-auto pt-4 md:pt-8 flex flex-col items-center z-10">
        <!-- Settings Button -->
        <button id="settings-button" onclick="showSettingsModal()" class="absolute top-4 right-0 p-2 text-gray-400 hover:text-white hover:bg-white/5 transition duration-200 rounded-full">
            <i data-lucide="settings-2" class="w-5 h-5"></i>
        </button>
        
        <!-- Enhanced Heading (Smaller & Moved Up) -->
        <div class="inline-block relative mb-2">
            <h1 class="text-4xl md:text-5xl font-display font-black text-transparent bg-clip-text bg-gradient-to-br from-indigo-200 via-white to-purple-200 tracking-tighter drop-shadow-xl">
                Deadline Dashboard
            </h1>
        </div>
        
        <p class="text-secondary/60 text-sm md:text-base max-w-lg mx-auto font-light tracking-wide">
            Prioritize. Execute. Finish.
        </p>
    </header>

    <!-- Countdown List Container -->
    <main id="countdown-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 max-w-7xl mx-auto pb-24 px-2">
        <!-- Dynamic Content -->
        <div id="loading-spinner" class="col-span-full flex flex-col justify-center items-center py-20">
            <div class="w-10 h-10 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin mb-4"></div>
            <span class="text-sm text-secondary/60 font-medium tracking-wider uppercase">Loading Trackers</span>
        </div>
    </main>
    
    <!-- Floating Action Button -->
    <button id="add-button-fab" onclick="showModal()" 
            class="group p-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full transition-all duration-300 ease-out transform hover:scale-110 active:scale-95 shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/50">
        <i data-lucide="plus" class="w-6 h-6 transition-transform duration-300 group-hover:rotate-90"></i>
    </button>

    <!-- Modal for Adding/Editing -->
    <div id="countdown-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm transition-opacity duration-300" onclick="hideModal()"></div>
        
        <!-- Content -->
        <div class="glass-card p-8 rounded-2xl w-full max-w-md transform transition-all duration-300 scale-95 opacity-0 relative z-10 border border-white/10 bg-[#0a0a0a]" id="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white tracking-tight" id="modal-title">New Timer</h2>
                <button onclick="hideModal()" class="text-gray-500 hover:text-white transition"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <form id="countdown-form">
                <input type="hidden" id="doc-id">
                
                <div class="mb-5">
                    <label for="headline" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Event Title</label>
                    <input type="text" id="headline" required placeholder="e.g. Product Launch"
                        class="glass-input w-full p-3 rounded-xl focus:ring-2 focus:ring-indigo-500/50 transition-all placeholder-gray-600 text-sm">
                </div>

                <div class="mb-8">
                    <label for="target-date" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Target Date</label>
                    <input type="datetime-local" id="target-date" required
                        class="glass-input w-full p-3 rounded-xl focus:ring-2 focus:ring-indigo-500/50 transition-all text-gray-300 text-sm">
                </div>

                <div class="flex justify-end gap-3">
                    <button type="button" onclick="hideModal()"
                        class="px-4 py-2.5 text-xs text-gray-400 hover:text-white transition duration-200 font-medium uppercase tracking-wide">
                        Cancel
                    </button>
                    <button type="submit" id="save-button"
                        class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg shadow-lg shadow-indigo-900/20 transition-all duration-200 font-semibold text-sm transform hover:-translate-y-0.5">
                        Create
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Settings Modal -->
    <div id="settings-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm transition-opacity duration-300" onclick="hideSettingsModal()"></div>
        
        <div class="glass-card p-8 rounded-2xl w-full max-w-lg transform transition-all duration-300 scale-95 opacity-0 relative z-10 bg-[#0a0a0a] border border-white/10" id="settings-modal-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white tracking-tight">Settings</h2>
                <button onclick="hideSettingsModal()" class="text-gray-500 hover:text-white transition"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <form id="settings-form">
                <div class="space-y-6">
                    <div>
                        <h3 class="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-4">Typography</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-[10px] uppercase font-bold text-gray-500 mb-2">Site Title Font</label>
                                <input type="text" id="site-title-font" placeholder="Google Font Name (e.g. Oswald)"
                                    class="glass-input w-full p-2.5 rounded-lg text-sm">
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-[10px] uppercase font-bold text-gray-500 mb-2">Card Headings Font</label>
                                    <input type="text" id="heading-font" placeholder="Google Font Name"
                                        class="glass-input w-full p-2.5 rounded-lg text-sm">
                                </div>
                                <div>
                                    <label class="block text-[10px] uppercase font-bold text-gray-500 mb-2">Numbers Font</label>
                                    <input type="text" id="countdown-font" placeholder="Google Font Name"
                                        class="glass-input w-full p-2.5 rounded-lg text-sm">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div>
                        <h3 class="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-4">Visible Units</h3>
                        <div class="space-y-2">
                            <div class="flex items-center justify-between p-3 bg-white/5 rounded-lg border border-white/5 hover:border-white/10 transition">
                                <span class="text-gray-300 text-sm flex items-center gap-2">Hours</span>
                                <input type="checkbox" id="toggle-hours" class="toggle-switch">
                            </div>
                            <div class="flex items-center justify-between p-3 bg-white/5 rounded-lg border border-white/5 hover:border-white/10 transition">
                                <span class="text-gray-300 text-sm flex items-center gap-2">Minutes</span>
                                <input type="checkbox" id="toggle-minutes" class="toggle-switch">
                            </div>
                            <div class="flex items-center justify-between p-3 bg-white/5 rounded-lg border border-white/5 hover:border-white/10 transition">
                                <span class="text-gray-300 text-sm flex items-center gap-2">Seconds</span>
                                <input type="checkbox" id="toggle-seconds" class="toggle-switch">
                            </div>
                        </div>
                    </div>

                    <!-- New Import/Export Section -->
                    <div>
                        <h3 class="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-4">Data Backup</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <button type="button" onclick="exportData()" 
                                class="flex items-center justify-center gap-2 p-3 rounded-lg border border-white/10 bg-white/5 hover:bg-white/10 hover:border-indigo-500/50 transition-all group">
                                <i data-lucide="upload" class="w-4 h-4 text-gray-400 group-hover:text-indigo-400 transition-colors"></i>
                                <span class="text-sm text-gray-300 font-medium">Export</span>
                            </button>
                            <button type="button" onclick="document.getElementById('import-file').click()" 
                                class="flex items-center justify-center gap-2 p-3 rounded-lg border border-white/10 bg-white/5 hover:bg-white/10 hover:border-indigo-500/50 transition-all group">
                                <i data-lucide="download" class="w-4 h-4 text-gray-400 group-hover:text-indigo-400 transition-colors"></i>
                                <span class="text-sm text-gray-300 font-medium">Import</span>
                            </button>
                            <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(this)">
                        </div>
                        <p id="import-status" class="text-[10px] text-center mt-2 h-4 text-emerald-400 font-medium opacity-0 transition-opacity"></p>
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-8 pt-6 border-t border-white/10">
                    <button type="button" onclick="saveSettings()"
                        class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg shadow-lg shadow-indigo-900/20 transition duration-200 font-medium text-sm">
                        Apply Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-20 text-center pb-8">
        <p class="text-[10px] text-gray-600 font-bold uppercase tracking-widest opacity-50 mb-1">Data is saved in the browser's local storage</p>
        <p class="text-xs text-indigo-400/80 font-medium">Made with ♥️ by Tamim</p>
    </footer>

    <!-- JavaScript Logic -->
    <script type="module">
        const COUNTDOWN_STORAGE_KEY = 'COUNTDOWN_TRACKER_DATA';
        const SETTINGS_STORAGE_KEY = 'COUNTDOWN_TRACKER_SETTINGS';
        
        const defaultSettings = {
            siteTitleFont: 'Inter',
            headingFont: 'Inter',
            countdownFont: 'Inter',
            showHours: true,
            showMinutes: true,
            showSeconds: true,
        };

        let activeCountdowns = []; 
        let currentSettings = { ...defaultSettings };
        let countdownInterval;

        const countdownListEl = document.getElementById('countdown-list');
        const loadingSpinnerEl = document.getElementById('loading-spinner');
        const countdownModalEl = document.getElementById('countdown-modal');
        const countdownModalContentEl = document.getElementById('modal-content');
        const countdownForm = document.getElementById('countdown-form');
        const headlineInput = document.getElementById('headline');
        const targetDateInput = document.getElementById('target-date');
        const docIdInput = document.getElementById('doc-id');
        
        const settingsModalEl = document.getElementById('settings-modal');
        const settingsModalContentEl = document.getElementById('settings-modal-content');
        const siteTitleFontInput = document.getElementById('site-title-font');
        const headingFontInput = document.getElementById('heading-font');
        const countdownFontInput = document.getElementById('countdown-font');
        const toggleHoursInput = document.getElementById('toggle-hours');
        const toggleMinutesInput = document.getElementById('toggle-minutes');
        const toggleSecondsInput = document.getElementById('toggle-seconds');
        const fontImportsContainer = document.getElementById('font-imports');

        const cleanFontName = (name) => name.trim().replace(/\s+/g, '+');

        const loadFontAndApplyCss = (fontName, cssVar) => {
            const cleanName = cleanFontName(fontName);
            const root = document.documentElement.style;
            root.setProperty(cssVar, `'${fontName}'`);

            if (cleanName && cleanName !== 'Inter') {
                const existingLink = fontImportsContainer.querySelector(`[data-font="${cleanName}"]`);
                if (existingLink) return;

                const link = document.createElement('link');
                link.href = `https://fonts.googleapis.com/css2?family=${cleanName}:wght@400;700;900&display=swap`;
                link.rel = 'stylesheet';
                link.setAttribute('data-font', cleanName);
                fontImportsContainer.appendChild(link);
            }
        };

        const confirmAction = (message) => window.confirm(message);

        const loadSettings = () => {
            const storedSettings = localStorage.getItem(SETTINGS_STORAGE_KEY);
            try {
                currentSettings = storedSettings ? { ...defaultSettings, ...JSON.parse(storedSettings) } : defaultSettings;
            } catch (e) {
                console.error("Error loading settings:", e);
                currentSettings = defaultSettings;
            }
        };

        window.saveSettings = () => {
            currentSettings.siteTitleFont = siteTitleFontInput.value.trim() || defaultSettings.siteTitleFont;
            currentSettings.headingFont = headingFontInput.value.trim() || defaultSettings.headingFont;
            currentSettings.countdownFont = countdownFontInput.value.trim() || defaultSettings.countdownFont;
            currentSettings.showHours = toggleHoursInput.checked;
            currentSettings.showMinutes = toggleMinutesInput.checked;
            currentSettings.showSeconds = toggleSecondsInput.checked;

            try {
                localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(currentSettings));
                applySettings();
                renderCountdowns();
                hideSettingsModal();
            } catch (e) {
                console.error("Error saving settings:", e);
            }
        };

        const applySettings = () => {
            loadFontAndApplyCss(currentSettings.siteTitleFont, '--site-title-font');
            loadFontAndApplyCss(currentSettings.headingFont, '--heading-font');
            loadFontAndApplyCss(currentSettings.countdownFont, '--countdown-font');
            toggleHoursInput.checked = currentSettings.showHours;
            toggleMinutesInput.checked = currentSettings.showMinutes;
            toggleSecondsInput.checked = currentSettings.showSeconds;
        };

        const loadCountdowns = () => {
            const storedData = localStorage.getItem(COUNTDOWN_STORAGE_KEY);
            try {
                activeCountdowns = storedData ? JSON.parse(storedData) : [];
            } catch (e) {
                console.error("Error parsing countdown data:", e);
                activeCountdowns = [];
            }
        };

        const saveCountdowns = () => {
            try {
                localStorage.setItem(COUNTDOWN_STORAGE_KEY, JSON.stringify(activeCountdowns));
            } catch (e) {
                console.error("Error saving countdown data:", e);
            }
        };
        
        const generateId = () => crypto.randomUUID();

        const saveCountdown = (docId, headline, targetDate) => {
            const trimmedHeadline = headline.trim();
            const now = new Date().toISOString();
            
            if (docId) {
                const index = activeCountdowns.findIndex(c => c.id === docId);
                if (index !== -1) {
                    activeCountdowns[index] = {
                        ...activeCountdowns[index],
                        headline: trimmedHeadline,
                        targetDate: targetDate,
                        updatedAt: now
                    };
                }
            } else {
                const newCountdown = {
                    id: generateId(),
                    headline: trimmedHeadline,
                    targetDate: targetDate,
                    createdAt: now
                };
                activeCountdowns.push(newCountdown);
            }

            saveCountdowns();
            renderCountdowns();
            hideModal();
        };
        
        const deleteCountdown = (docId) => {
            if (!docId) return;
            if (confirmAction("Remove this deadline tracker?")) {
                const el = document.getElementById(`countdown-${docId}`);
                if(el) {
                    el.style.transform = 'scale(0.9) translateY(10px)';
                    el.style.opacity = '0';
                    setTimeout(() => {
                        activeCountdowns = activeCountdowns.filter(c => c.id !== docId);
                        saveCountdowns();
                        renderCountdowns();
                    }, 200);
                } else {
                     activeCountdowns = activeCountdowns.filter(c => c.id !== docId);
                     saveCountdowns();
                     renderCountdowns();
                }
            }
        };
        window.deleteCountdown = deleteCountdown;

        const calculateRemainingTime = (targetDateStr) => {
            const now = new Date().getTime();
            const target = new Date(targetDateStr).getTime();
            const distance = target - now;

            if (distance < 0) {
                return { isPast: true, days: 0, hours: 0, minutes: 0, seconds: 0, totalDays: 0 };
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            return { isPast: false, days, hours, minutes, seconds, totalDays: distance / (1000 * 60 * 60 * 24) };
        };

        // Determine styling based on urgency
        const getStatusStyles = (totalDays, isPast) => {
            if (isPast) {
                 return {
                    border: 'border-red-500/50',
                    shadow: 'shadow-[0_0_15px_rgba(239,68,68,0.15)]',
                    text: 'text-red-400',
                    pill: 'bg-red-500/20 text-red-300 border-red-500/20',
                    label: 'EXPIRED'
                 };
            }
            if (totalDays < 4) {
                 return {
                    border: 'border-red-500/60',
                    shadow: 'shadow-[0_0_20px_rgba(248,113,113,0.15)]',
                    text: 'text-red-400',
                    pill: 'bg-red-500/10 text-red-300 border-red-500/20',
                    label: 'URGENT'
                 };
            } else if (totalDays < 15) {
                 return {
                    border: 'border-yellow-400/50',
                    shadow: 'shadow-[0_0_20px_rgba(250,204,21,0.1)]',
                    text: 'text-yellow-400',
                    pill: 'bg-yellow-400/10 text-yellow-300 border-yellow-400/20',
                    label: 'SOON'
                 };
            } else {
                 return {
                    border: 'border-emerald-500/40',
                    shadow: 'shadow-[0_0_15px_rgba(16,185,129,0.1)]',
                    text: 'text-emerald-400',
                    pill: 'bg-emerald-500/10 text-emerald-300 border-emerald-500/20',
                    label: 'ON TRACK'
                 };
            }
        };

        const renderCountdowns = () => {
            countdownListEl.innerHTML = ''; 

            if (activeCountdowns.length === 0) {
                countdownListEl.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center p-12 glass-card rounded-3xl border border-white/5 opacity-80 hover:opacity-100 transition duration-500">
                        <div class="p-4 bg-white/5 rounded-full mb-6 ring-1 ring-white/10 shadow-xl">
                            <i data-lucide="sparkles" class="w-8 h-8 text-indigo-400"></i>
                        </div>
                        <p class="text-xl font-bold text-white mb-2">Workspace Empty</p>
                        <p class="text-gray-500 text-center max-w-sm text-sm">Create a timer to start organizing your deadlines.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            const units = [
                { key: 'days', label: 'DAYS', show: true },
                { key: 'hours', label: 'HRS', show: currentSettings.showHours },
                { key: 'minutes', label: 'MIN', show: currentSettings.showMinutes },
                { key: 'seconds', label: 'SEC', show: currentSettings.showSeconds }
            ];

            // Sort: Past events at bottom, then by closest date
            const sortedCountdowns = [...activeCountdowns].sort((a, b) => {
                 const timeA = new Date(a.targetDate).getTime();
                 const timeB = new Date(b.targetDate).getTime();
                 return timeA - timeB; 
            });

            sortedCountdowns.forEach((item, index) => {
                const { id, headline, targetDate } = item;
                
                // Pre-calculate status for initial rendering style
                const time = calculateRemainingTime(targetDate);
                const styles = getStatusStyles(time.totalDays, time.isPast);
                
                const countdownDiv = document.createElement('div');
                countdownDiv.id = `countdown-${id}`;
                // Staggered animation
                countdownDiv.style.animationDelay = `${index * 50}ms`;
                
                // Dynamic styling on the wrapper: SUBTLE HOVER ADDED HERE
                countdownDiv.className = `glass-card p-6 rounded-2xl animate-fade-in-up relative group transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl hover:shadow-indigo-500/10 border ${styles.border} ${styles.shadow}`;
                
                const displayDate = new Date(targetDate).toLocaleString('en-US', {
                    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });

                const safeHeadline = headline.replace(/'/g, "&apos;");

                const gridItems = units
                    .filter(unit => unit.show)
                    .map(unit => `
                        <div class="p-2.5 bg-black/30 rounded-xl border border-white/5 backdrop-blur-md">
                            <div class="countdown-number font-mono ${styles.text} font-black tracking-tighter tabular-nums leading-none" data-unit="${unit.key}">--</div>
                            <div class="text-[9px] font-bold text-gray-500 tracking-widest mt-1.5 opacity-80">${unit.label}</div>
                        </div>
                    `)
                    .join('');

                const activeUnitCount = units.filter(unit => unit.show).length;
                let gridColsClass = activeUnitCount === 4 ? 'grid-cols-4' : 
                                    activeUnitCount === 3 ? 'grid-cols-3' : 
                                    activeUnitCount === 2 ? 'grid-cols-2' : 'grid-cols-1';

                countdownDiv.innerHTML = `
                    <div class="flex justify-between items-start mb-5">
                        <div class="pr-2 w-full overflow-hidden">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border ${styles.pill} tracking-wider">${styles.label}</span>
                            </div>
                            <h3 class="text-xl font-bold text-white/95 truncate leading-tight tracking-tight">${headline}</h3>
                            <p class="text-xs font-medium text-gray-400 mt-1 flex items-center gap-1.5">
                                <i data-lucide="calendar-clock" class="w-3 h-3"></i> ${displayDate}
                            </p>
                        </div>
                        
                        <div class="flex flex-col space-y-1 opacity-0 group-hover:opacity-100 transition-all duration-200">
                            <button class="text-gray-400 hover:text-white p-1.5 rounded-lg hover:bg-white/10 transition" onclick="editCountdown('${id}', '${safeHeadline}', '${targetDate}')">
                                <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                            </button>
                            <button class="text-gray-400 hover:text-red-400 p-1.5 rounded-lg hover:bg-red-500/10 transition" onclick="deleteCountdown('${id}')">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="grid ${gridColsClass} gap-2 text-center relative z-10" id="timer-display-${id}">
                        ${gridItems}
                    </div>
                `;

                countdownListEl.appendChild(countdownDiv);
            });

            lucide.createIcons();
            updateAllCountdowns();
        };

        const updateAllCountdowns = () => {
            activeCountdowns.forEach(item => {
                const { id, targetDate } = item;
                const timerDisplayEl = document.getElementById(`timer-display-${id}`);
                const wrapperEl = document.getElementById(`countdown-${id}`);
                
                if (!timerDisplayEl || !wrapperEl) return;

                const time = calculateRemainingTime(targetDate);
                const numberElements = timerDisplayEl.querySelectorAll('.countdown-number');
                const styles = getStatusStyles(time.totalDays, time.isPast);

                if (time.isPast && !timerDisplayEl.classList.contains('deadline-passed')) {
                    timerDisplayEl.innerHTML = `
                        <div class="col-span-full py-3 bg-red-500/10 rounded-xl border border-red-500/20 animate-pulse">
                            <p class="text-center text-base font-bold text-red-400 tracking-wide uppercase">Time's Up</p>
                        </div>`;
                    timerDisplayEl.classList.add('deadline-passed');
                    // Update wrapper border to expired state
                    wrapperEl.className = `glass-card p-6 rounded-2xl relative group transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl border ${styles.border} ${styles.shadow}`;
                
                } else if (!time.isPast) {
                    const unitElements = timerDisplayEl.querySelectorAll('[data-unit]');
                    
                    unitElements.forEach(el => {
                        const unit = el.getAttribute('data-unit');
                        el.textContent = String(time[unit]).padStart(2, '0');
                        
                        // Ensure text color matches urgency
                        el.className = `countdown-number font-mono font-black tracking-tighter tabular-nums leading-none ${styles.text}`;
                    });

                    // Handle only days visible case
                    if (time.days > 0 && !currentSettings.showHours && !currentSettings.showMinutes && !currentSettings.showSeconds) {
                         const daysEl = timerDisplayEl.querySelector('[data-unit="days"]');
                         if (daysEl) daysEl.textContent = Math.ceil(time.totalDays);
                    }
                }
            });
        };

        if (countdownInterval) clearInterval(countdownInterval);
        countdownInterval = setInterval(updateAllCountdowns, 1000);

        window.showModal = (id = null, headline = '', targetDate = '') => {
            docIdInput.value = id || '';
            headlineInput.value = headline;
            targetDateInput.value = targetDate;
            
            document.getElementById('modal-title').textContent = id ? 'Edit Timer' : 'New Timer';
            document.getElementById('save-button').textContent = id ? 'Update' : 'Start Timer';

            countdownModalEl.classList.remove('hidden');
            setTimeout(() => {
                countdownModalContentEl.classList.remove('opacity-0', 'scale-95');
                countdownModalContentEl.classList.add('opacity-100', 'scale-100');
            }, 10);
        };

        window.hideModal = () => {
            countdownModalContentEl.classList.remove('opacity-100', 'scale-100');
            countdownModalContentEl.classList.add('opacity-0', 'scale-95');
            setTimeout(() => {
                countdownModalEl.classList.add('hidden');
                countdownForm.reset();
            }, 300);
        };
        
        window.editCountdown = (id, headline, targetDate) => {
            showModal(id, headline.replace(/&apos;/g, "'"), targetDate);
        };

        window.showSettingsModal = () => {
            siteTitleFontInput.value = currentSettings.siteTitleFont === defaultSettings.siteTitleFont ? '' : currentSettings.siteTitleFont;
            headingFontInput.value = currentSettings.headingFont === defaultSettings.headingFont ? '' : currentSettings.headingFont;
            countdownFontInput.value = currentSettings.countdownFont === defaultSettings.countdownFont ? '' : currentSettings.countdownFont;
            toggleHoursInput.checked = currentSettings.showHours;
            toggleMinutesInput.checked = currentSettings.showMinutes;
            toggleSecondsInput.checked = currentSettings.showSeconds;

            settingsModalEl.classList.remove('hidden');
            setTimeout(() => {
                settingsModalContentEl.classList.remove('opacity-0', 'scale-95');
                settingsModalContentEl.classList.add('opacity-100', 'scale-100');
            }, 10);
        };

        window.hideSettingsModal = () => {
            settingsModalContentEl.classList.remove('opacity-100', 'scale-100');
            settingsModalContentEl.classList.add('opacity-0', 'scale-95');
            setTimeout(() => {
                settingsModalEl.classList.add('hidden');
            }, 300);
        };

        // Export Data Logic
        window.exportData = () => {
            const data = {
                settings: currentSettings,
                countdowns: activeCountdowns
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "deadline_dashboard_backup.json");
            document.body.appendChild(downloadAnchorNode); // required for firefox
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        };

        // Import Data Logic
        window.importData = (input) => {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    if (data.settings) {
                        currentSettings = { ...defaultSettings, ...data.settings };
                        localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(currentSettings));
                    }
                    
                    if (data.countdowns && Array.isArray(data.countdowns)) {
                        activeCountdowns = data.countdowns;
                        localStorage.setItem(COUNTDOWN_STORAGE_KEY, JSON.stringify(activeCountdowns));
                    }
                    
                    // Refresh UI
                    applySettings();
                    renderCountdowns();
                    
                    // Show success feedback
                    const statusEl = document.getElementById('import-status');
                    statusEl.textContent = "Backup restored successfully!";
                    statusEl.className = "text-[10px] text-center mt-2 h-4 text-emerald-400 font-medium transition-opacity";
                    statusEl.classList.remove('opacity-0');
                    setTimeout(() => statusEl.classList.add('opacity-0'), 3000);
                    
                    // Reset input
                    input.value = '';
                    
                    // Update form inputs to reflect imported settings if modal is open
                    if (!settingsModalEl.classList.contains('hidden')) {
                         siteTitleFontInput.value = currentSettings.siteTitleFont === defaultSettings.siteTitleFont ? '' : currentSettings.siteTitleFont;
                         headingFontInput.value = currentSettings.headingFont === defaultSettings.headingFont ? '' : currentSettings.headingFont;
                         countdownFontInput.value = currentSettings.countdownFont === defaultSettings.countdownFont ? '' : currentSettings.countdownFont;
                         toggleHoursInput.checked = currentSettings.showHours;
                         toggleMinutesInput.checked = currentSettings.showMinutes;
                         toggleSecondsInput.checked = currentSettings.showSeconds;
                    }

                } catch (err) {
                    console.error("Import failed:", err);
                    const statusEl = document.getElementById('import-status');
                    statusEl.className = "text-[10px] text-center mt-2 h-4 text-red-400 font-medium transition-opacity";
                    statusEl.textContent = "Invalid file format.";
                    statusEl.classList.remove('opacity-0');
                    setTimeout(() => statusEl.classList.add('opacity-0'), 3000);
                }
            };
            reader.readAsText(file);
        };

        countdownForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = docIdInput.value;
            const headline = headlineInput.value;
            const targetDate = targetDateInput.value;
            if (headline && targetDate) {
                saveCountdown(id, headline, targetDate);
            }
        });

        const initializeApp = () => {
            loadCountdowns();
            loadSettings();
            applySettings();
            renderCountdowns();
            loadingSpinnerEl.style.display = 'none';
        };

        initializeApp();
    </script>
</body>
</html>
