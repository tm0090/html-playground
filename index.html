<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deadline Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#818cf8', 
                        'secondary': '#a5b4fc', 
                        'accent': '#c084fc', 
                        'dark-bg': '#050505', 
                        'card-bg': 'rgba(255, 255, 255, 0.03)', 
                        'text-light': '#f3f4f6', 
                    },
                    fontFamily: {
                        display: ['var(--site-title-font)', 'Inter', 'sans-serif'],
                        sans: ['var(--heading-font)', 'Inter', 'sans-serif'], 
                        mono: ['var(--countdown-font)', 'ui-monospace', 'SFMono-Regular', 'monospace'],
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'bounce-subtle': 'bounceSubtle 3s infinite ease-in-out',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px) scale(0.98)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
                        },
                        bounceSubtle: {
                             '0%, 100%': { transform: 'translateY(-5%)' },
                             '50%': { transform: 'translateY(5%)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200..900&display=swap');
        
        :root {
            --site-title-font: 'Inter';
            --heading-font: 'Inter';
            --countdown-font: 'Inter'; 
        }

        /* Ambient Background Effect */
        body {
            background-color: #050505;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(76, 29, 149, 0.08), transparent 35%), 
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.08), transparent 35%);
            background-attachment: fixed;
            -webkit-tap-highlight-color: transparent; /* Remove blue highlight on tap */
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #374151;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-track {
            background-color: transparent;
        }

        /* SMOOTH CARD STYLES */
        .glass-card {
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08); /* Subtle default border */
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Spring-like transition */
            position: relative;
            overflow: hidden;
            outline: none; /* Remove default focus outline */
        }
        
        /* HOVER & FOCUS GLOW LOGIC */
        /* Added :focus-within and :focus to support touch "selection" */
        .glass-card:hover,
        .glass-card:focus, 
        .glass-card:focus-within {
            border-color: var(--glow-color);
            box-shadow: 
                0 0 25px var(--glow-color-soft),
                inset 0 0 10px var(--glow-color-soft);
            transform: translateY(-4px) scale(1.01);
        }

        /* Constant styling for expired cards */
        .glass-card.is-expired {
            border-color: var(--glow-color);
            box-shadow: 0 0 15px var(--glow-color-soft);
        }
        
        /* Mobile Touch Optimizations */
        @media (max-width: 768px) {
            .glass-card:active {
                transform: scale(0.98);
            }
            /* Make inputs larger for touch */
            input, button {
                min-height: 44px; 
            }
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f3f4f6;
            color-scheme: dark;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-input:focus {
            border-color: #818cf8;
            outline: none;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
        }
        
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.6;
            cursor: pointer;
            padding: 5px; /* Larger touch target */
        }

        /* Color Picker Reset */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            padding: 0;
            background: none;
            cursor: pointer;
            vertical-align: middle;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .countdown-number {
            font-size: clamp(1.75rem, 3.5vw, 2.75rem);
            line-height: 1;
            letter-spacing: -0.05em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* FAB */
        #add-button-fab {
            position: fixed;
            bottom: 32px;
            right: 32px;
            z-index: 50;
            box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.6);
        }
    </style>
    <div id="font-imports"></div>
</head>
<body class="font-sans text-text-light min-h-screen p-4 sm:p-6 selection:bg-indigo-500 selection:text-white">

    <!-- Ambient Light Blob -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[800px] h-[300px] bg-indigo-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <header class="mb-10 text-center relative max-w-7xl mx-auto pt-4 md:pt-8 flex flex-col items-center z-10">
        <button id="settings-button" onclick="showSettingsModal()" class="absolute top-4 right-0 p-3 text-gray-400 hover:text-white hover:bg-white/5 transition duration-200 rounded-full active:scale-95">
            <i data-lucide="settings-2" class="w-6 h-6"></i>
        </button>
        
        <div class="inline-block relative mb-2">
           <h1 class="text-4xl md:text-5xl font-display font-black text-transparent bg-clip-text bg-gradient-to-br from-indigo-200 via-white to-purple-200 tracking-tighter drop-shadow-2xl">
                Deadline<br class="md:hidden">Dashboard
            </h1>
        </div>
        
        <p class="text-secondary/60 text-sm md:text-base max-w-lg mx-auto font-light tracking-wide mt-2">
            Prioritize | Execute | Finish
        </p>
    </header>

    <main id="countdown-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-7xl mx-auto pb-24 px-2">
        <div id="loading-spinner" class="col-span-full flex flex-col justify-center items-center py-20">
            <div class="w-12 h-12 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin mb-4"></div>
            <span class="text-sm text-secondary/60 font-medium tracking-wider uppercase animate-pulse">Loading Trackers...</span>
        </div>
    </main>
    
    <button id="add-button-fab" onclick="showModal()" 
            class="group p-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full transition-all duration-300 ease-out transform hover:scale-110 active:scale-95">
        <i data-lucide="plus" class="w-7 h-7 transition-transform duration-300 group-hover:rotate-90"></i>
    </button>

    <!-- Create/Edit Modal -->
    <div id="countdown-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-md transition-opacity duration-300" onclick="hideModal()"></div>
        
        <div class="glass-card p-8 rounded-3xl w-full max-w-md transform transition-all duration-300 scale-95 opacity-0 relative z-10 bg-[#0a0a0a]" id="modal-content">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-bold text-white tracking-tight" id="modal-title">New Timer</h2>
                <button onclick="hideModal()" class="text-gray-500 hover:text-white transition p-2 hover:bg-white/10 rounded-full"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            
            <form id="countdown-form">
                <input type="hidden" id="doc-id">
                
                <div class="mb-6">
                    <label for="headline" class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Event Title</label>
                    <input type="text" id="headline" required placeholder="e.g. Physics exam"
                        class="glass-input w-full p-4 rounded-xl focus:ring-2 focus:ring-indigo-500/50 transition-all placeholder-gray-600 text-base font-medium">
                </div>

                <div class="mb-8">
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Deadline</label>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="relative">
                            <input type="date" id="target-date-part" required
                                class="glass-input w-full p-4 rounded-xl focus:ring-2 focus:ring-indigo-500/50 transition-all text-gray-300 text-sm cursor-pointer">
                        </div>
                        <div class="relative">
                            <input type="time" id="target-time-part" required
                                class="glass-input w-full p-4 rounded-xl focus:ring-2 focus:ring-indigo-500/50 transition-all text-gray-300 text-sm cursor-pointer">
                        </div>
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="hideModal()"
                        class="px-5 py-3 text-xs text-gray-400 hover:text-white transition duration-200 font-bold uppercase tracking-wide rounded-xl hover:bg-white/5">
                        Cancel
                    </button>
                    <button type="submit" id="save-button"
                        class="px-8 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl shadow-lg shadow-indigo-900/30 transition-all duration-200 font-bold text-sm transform hover:-translate-y-0.5 active:translate-y-0">
                        Create
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Settings Modal -->
    <div id="settings-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-md transition-opacity duration-300" onclick="hideSettingsModal()"></div>
        
        <div class="glass-card p-6 rounded-3xl w-full max-w-md max-h-[85vh] overflow-y-auto modal-scroll transform transition-all duration-300 scale-95 opacity-0 relative z-10 bg-[#0a0a0a]" id="settings-modal-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-white tracking-tight">Settings</h2>
                <button onclick="hideSettingsModal()" class="text-gray-500 hover:text-white transition p-2 hover:bg-white/10 rounded-full"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            
            <form id="settings-form">
                <div class="space-y-8">
                    <!-- Typography Section -->
                    <div>
                        <h2 class="text-xs font-black text-indigo-400 uppercase tracking-[0.2em] mb-4">Typography</h2>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-[11px] uppercase font-bold text-gray-500 mb-2">Site Title Font</label>
                                <input type="text" id="site-title-font" placeholder="Google Font Name (e.g. Oswald)"
                                    class="glass-input w-full p-3 rounded-xl text-sm">
                            </div>
                            <div class="grid grid-cols-1 gap-4">
                                <div>
                                    <label class="block text-[11px] uppercase font-bold text-gray-500 mb-2">Card Headings Font</label>
                                    <input type="text" id="heading-font" placeholder="Google Font Name"
                                        class="glass-input w-full p-3 rounded-xl text-sm">
                                </div>
                                <div>
                                    <label class="block text-[11px] uppercase font-bold text-gray-500 mb-2">Numbers Font</label>
                                    <input type="text" id="countdown-font" placeholder="Google Font Name"
                                        class="glass-input w-full p-3 rounded-xl text-sm">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Visible Units Section -->
                    <div>
                        <h3 class="text-xs font-black text-indigo-400 uppercase tracking-[0.2em] mb-4">Visible Units</h3>
                        <div class="space-y-3">
                            <!-- Toggle Item: Hours -->
                            <div class="flex items-center justify-between p-4 bg-white/5 rounded-xl border border-white/5 hover:border-white/10 transition">
                                <span class="text-gray-300 text-sm font-medium">Hours</span>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" id="toggle-hours" class="sr-only peer">
                                    <div class="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                                </label>
                            </div>
                            <!-- Toggle Item: Minutes -->
                            <div class="flex items-center justify-between p-4 bg-white/5 rounded-xl border border-white/5 hover:border-white/10 transition">
                                <span class="text-gray-300 text-sm font-medium">Minutes</span>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" id="toggle-minutes" class="sr-only peer">
                                    <div class="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                                </label>
                            </div>
                            <!-- Toggle Item: Seconds -->
                            <div class="flex items-center justify-between p-4 bg-white/5 rounded-xl border border-white/5 hover:border-white/10 transition">
                                <span class="text-gray-300 text-sm font-medium">Seconds</span>
                                <label class="relative inline-flex items-center cursor-pointer">
                                    <input type="checkbox" id="toggle-seconds" class="sr-only peer">
                                    <div class="w-11 h-6 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Status & Colors Section -->
                    <div>
                        <h3 class="text-xs font-black text-indigo-400 uppercase tracking-[0.2em] mb-4">Status & Colors</h3>
                        <div class="space-y-3">
                            <!-- Urgent Row -->
                            <div class="flex items-center gap-3 p-3 bg-white/5 rounded-xl border border-white/5">
                                <div class="flex-1 min-w-0">
                                    <label class="block text-[10px] uppercase font-bold text-gray-500 mb-1 truncate">Urgent (Days &lt;)</label>
                                    <input type="number" id="urgent-days" min="1" max="30"
                                        class="glass-input w-full p-2.5 rounded-lg text-sm font-bold text-center">
                                </div>
                                <div class="flex flex-col items-center flex-shrink-0">
                                    <label class="block text-[10px] uppercase font-bold text-gray-500 mb-1">Color</label>
                                    <div class="flex justify-center bg-white/5 p-1 rounded-full">
                                        <input type="color" id="urgent-color">
                                    </div>
                                </div>
                            </div>

                            <!-- Soon Row -->
                            <div class="flex items-center gap-3 p-3 bg-white/5 rounded-xl border border-white/5">
                                <div class="flex-1 min-w-0">
                                    <label class="block text-[10px] uppercase font-bold text-gray-500 mb-1 truncate">Soon (Days &lt;)</label>
                                    <input type="number" id="soon-days" min="1" max="90"
                                        class="glass-input w-full p-2.5 rounded-lg text-sm font-bold text-center">
                                </div>
                                <div class="flex flex-col items-center flex-shrink-0">
                                    <label class="block text-[10px] uppercase font-bold text-gray-500 mb-1">Color</label>
                                    <div class="flex justify-center bg-white/5 p-1 rounded-full">
                                        <input type="color" id="soon-color">
                                    </div>
                                </div>
                            </div>

                            <!-- On Track Row -->
                            <div class="flex items-center gap-3 p-3 bg-white/5 rounded-xl border border-white/5">
                                <div class="flex-1 pl-2">
                                    <span class="text-gray-300 text-sm font-bold">On Track</span>
                                </div>
                                <div class="flex flex-col items-center flex-shrink-0">
                                    <label class="block text-[10px] uppercase font-bold text-gray-500 mb-1">Color</label>
                                    <div class="flex justify-center bg-white/5 p-1 rounded-full">
                                        <input type="color" id="ontrack-color">
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Expired Row -->
                            <div class="flex items-center gap-3 p-3 bg-white/5 rounded-xl border border-white/5">
                                <div class="flex-1 pl-2">
                                    <span class="text-gray-300 text-sm font-bold">Expired</span>
                                </div>
                                <div class="flex flex-col items-center flex-shrink-0">
                                    <label class="block text-[10px] uppercase font-bold text-gray-500 mb-1">Color</label>
                                    <div class="flex justify-center bg-white/5 p-1 rounded-full">
                                        <input type="color" id="expired-color">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Data Backup Section -->
                    <div>
                        <h3 class="text-xs font-black text-indigo-400 uppercase tracking-[0.2em] mb-4">Data Backup</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <button type="button" onclick="exportData()" 
                                class="flex items-center justify-center gap-2 p-3.5 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 hover:border-indigo-500/50 transition-all group active:scale-95">
                                <i data-lucide="upload" class="w-4 h-4 text-gray-400 group-hover:text-indigo-400 transition-colors"></i>
                                <span class="text-sm text-gray-300 font-bold">Export</span>
                            </button>
                            <button type="button" onclick="document.getElementById('import-file').click()" 
                                class="flex items-center justify-center gap-2 p-3.5 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 hover:border-indigo-500/50 transition-all group active:scale-95">
                                <i data-lucide="download" class="w-4 h-4 text-gray-400 group-hover:text-indigo-400 transition-colors"></i>
                                <span class="text-sm text-gray-300 font-bold">Import</span>
                            </button>
                            <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(this)">
                        </div>
                        <p id="import-status" class="text-[10px] text-center mt-2 h-4 text-emerald-400 font-bold opacity-0 transition-opacity"></p>
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-8 pt-6 border-t border-white/10">
                    <button type="button" onclick="saveSettings()"
                        class="px-8 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl shadow-lg shadow-indigo-900/20 transition duration-200 font-bold text-sm transform hover:-translate-y-0.5 active:translate-y-0">
                        Apply Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer class="mt-20 text-center pb-8">
        <p class="text-[10px] text-gray-600 font-bold uppercase tracking-widest opacity-50 mb-1">Data is saved in the browser's local storage</p>
        <p class="text-xs text-indigo-400/80 font-medium">Made with ♥️ by Tamim</p>
    </footer>

    <script type="module">
        const COUNTDOWN_STORAGE_KEY = 'COUNTDOWN_TRACKER_DATA';
        const SETTINGS_STORAGE_KEY = 'COUNTDOWN_TRACKER_SETTINGS_V2';
        
        const defaultSettings = {
            siteTitleFont: 'Inter',
            headingFont: 'Inter',
            countdownFont: 'Inter',
            showHours: true,
            showMinutes: true,
            showSeconds: true,
            urgentDays: 4,
            soonDays: 15,
            urgentColor: '#f87171', 
            soonColor: '#facc15',   
            onTrackColor: '#34d399',
            expiredColor: '#ef4444' 
        };

        let activeCountdowns = []; 
        let currentSettings = { ...defaultSettings };
        let countdownInterval;

        const countdownListEl = document.getElementById('countdown-list');
        const loadingSpinnerEl = document.getElementById('loading-spinner');
        const countdownModalEl = document.getElementById('countdown-modal');
        const countdownModalContentEl = document.getElementById('modal-content');
        const countdownForm = document.getElementById('countdown-form');
        const headlineInput = document.getElementById('headline');
        const targetDatePartInput = document.getElementById('target-date-part');
        const targetTimePartInput = document.getElementById('target-time-part');
        const docIdInput = document.getElementById('doc-id');
        const settingsModalEl = document.getElementById('settings-modal');
        const settingsModalContentEl = document.getElementById('settings-modal-content');
        
        // Settings Inputs
        const siteTitleFontInput = document.getElementById('site-title-font');
        const headingFontInput = document.getElementById('heading-font');
        const countdownFontInput = document.getElementById('countdown-font');
        const toggleHoursInput = document.getElementById('toggle-hours');
        const toggleMinutesInput = document.getElementById('toggle-minutes');
        const toggleSecondsInput = document.getElementById('toggle-seconds');
        
        const urgentDaysInput = document.getElementById('urgent-days');
        const soonDaysInput = document.getElementById('soon-days');
        const urgentColorInput = document.getElementById('urgent-color');
        const soonColorInput = document.getElementById('soon-color');
        const onTrackColorInput = document.getElementById('ontrack-color');
        const expiredColorInput = document.getElementById('expired-color');

        const fontImportsContainer = document.getElementById('font-imports');
        const cleanFontName = (name) => name.trim().replace(/\s+/g, '+');

        const hexToRgba = (hex, alpha) => {
            let r = 0, g = 0, b = 0;
            if (!hex) return `rgba(0,0,0,${alpha})`;
            if (hex.length === 4) {
                r = parseInt(hex[1] + hex[1], 16);
                g = parseInt(hex[2] + hex[2], 16);
                b = parseInt(hex[3] + hex[3], 16);
            } else if (hex.length === 7) {
                r = parseInt(hex.substring(1, 3), 16);
                g = parseInt(hex.substring(3, 5), 16);
                b = parseInt(hex.substring(5, 7), 16);
            }
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        };

        const loadFontAndApplyCss = (fontName, cssVar) => {
            const cleanName = cleanFontName(fontName);
            const root = document.documentElement.style;
            root.setProperty(cssVar, `'${fontName}'`);

            if (cleanName && cleanName !== 'Inter') {
                const existingLink = fontImportsContainer.querySelector(`[data-font="${cleanName}"]`);
                if (existingLink) return;

                const link = document.createElement('link');
                link.href = `https://fonts.googleapis.com/css2?family=${cleanName}:wght@400;700;900&display=swap`;
                link.rel = 'stylesheet';
                link.setAttribute('data-font', cleanName);
                fontImportsContainer.appendChild(link);
            }
        };

        const confirmAction = (message) => window.confirm(message);

        const loadSettings = () => {
            const storedSettings = localStorage.getItem(SETTINGS_STORAGE_KEY);
            try {
                if (storedSettings) {
                    const parsed = JSON.parse(storedSettings);
                    currentSettings = { ...defaultSettings, ...parsed };
                } else {
                    currentSettings = defaultSettings;
                }
            } catch (e) {
                console.error("Error loading settings:", e);
                currentSettings = defaultSettings;
            }
        };

        window.saveSettings = () => {
            currentSettings.siteTitleFont = siteTitleFontInput.value.trim() || defaultSettings.siteTitleFont;
            currentSettings.headingFont = headingFontInput.value.trim() || defaultSettings.headingFont;
            currentSettings.countdownFont = countdownFontInput.value.trim() || defaultSettings.countdownFont;
            currentSettings.showHours = toggleHoursInput.checked;
            currentSettings.showMinutes = toggleMinutesInput.checked;
            currentSettings.showSeconds = toggleSecondsInput.checked;
            currentSettings.urgentDays = urgentDaysInput.value;
            currentSettings.soonDays = soonDaysInput.value;
            currentSettings.urgentColor = urgentColorInput.value;
            currentSettings.soonColor = soonColorInput.value;
            currentSettings.onTrackColor = onTrackColorInput.value;
            currentSettings.expiredColor = expiredColorInput.value;

            try {
                localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(currentSettings));
                applySettings();
                renderCountdowns();
                hideSettingsModal();
            } catch (e) {
                console.error("Error saving settings:", e);
            }
        };

        const applySettings = () => {
            loadFontAndApplyCss(currentSettings.siteTitleFont, '--site-title-font');
            loadFontAndApplyCss(currentSettings.headingFont, '--heading-font');
            loadFontAndApplyCss(currentSettings.countdownFont, '--countdown-font');
            toggleHoursInput.checked = currentSettings.showHours;
            toggleMinutesInput.checked = currentSettings.showMinutes;
            toggleSecondsInput.checked = currentSettings.showSeconds;
        };

        const loadCountdowns = () => {
            const storedData = localStorage.getItem(COUNTDOWN_STORAGE_KEY);
            try {
                activeCountdowns = storedData ? JSON.parse(storedData) : [];
            } catch (e) {
                console.error("Error parsing countdown data:", e);
                activeCountdowns = [];
            }
        };

        const saveCountdowns = () => {
            try {
                localStorage.setItem(COUNTDOWN_STORAGE_KEY, JSON.stringify(activeCountdowns));
            } catch (e) {
                console.error("Error saving countdown data:", e);
            }
        };
        
        const generateId = () => crypto.randomUUID();

        const saveCountdown = (docId, headline, targetDate) => {
            const trimmedHeadline = headline.trim();
            const now = new Date().toISOString();
            
            if (docId) {
                const index = activeCountdowns.findIndex(c => c.id === docId);
                if (index !== -1) {
                    activeCountdowns[index] = {
                        ...activeCountdowns[index],
                        headline: trimmedHeadline,
                        targetDate: targetDate,
                        updatedAt: now
                    };
                }
            } else {
                const newCountdown = {
                    id: generateId(),
                    headline: trimmedHeadline,
                    targetDate: targetDate,
                    createdAt: now
                };
                activeCountdowns.push(newCountdown);
            }

            saveCountdowns();
            renderCountdowns();
            hideModal();
        };
        
        const deleteCountdown = (docId) => {
            if (!docId) return;
            if (confirmAction("Remove this deadline tracker?")) {
                const el = document.getElementById(`countdown-${docId}`);
                if(el) {
                    el.style.transform = 'scale(0.9) translateY(10px)';
                    el.style.opacity = '0';
                    setTimeout(() => {
                        activeCountdowns = activeCountdowns.filter(c => c.id !== docId);
                        saveCountdowns();
                        renderCountdowns();
                    }, 300);
                } else {
                     activeCountdowns = activeCountdowns.filter(c => c.id !== docId);
                     saveCountdowns();
                     renderCountdowns();
                }
            }
        };
        window.deleteCountdown = deleteCountdown;

        const calculateRemainingTime = (targetDateStr) => {
            const now = new Date().getTime();
            const target = new Date(targetDateStr).getTime();
            const distance = target - now;

            if (distance < 0) {
                return { isPast: true, days: 0, hours: 0, minutes: 0, seconds: 0, totalDays: 0 };
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            return { isPast: false, days, hours, minutes, seconds, totalDays: distance / (1000 * 60 * 60 * 24) };
        };

        const getStatusStyles = (totalDays, isPast) => {
            const { urgentDays, soonDays, urgentColor, soonColor, onTrackColor, expiredColor } = currentSettings;

            if (isPast) {
                 return { colorHex: expiredColor || '#ef4444', label: 'EXPIRED' };
            }
            if (totalDays < parseFloat(urgentDays)) {
                 return { colorHex: urgentColor || '#f87171', label: 'URGENT' };
            } else if (totalDays < parseFloat(soonDays)) {
                 return { colorHex: soonColor || '#facc15', label: 'SOON' };
            } else {
                 return { colorHex: onTrackColor || '#34d399', label: 'ON TRACK' };
            }
        };

        const renderCountdowns = () => {
            countdownListEl.innerHTML = ''; 

            if (activeCountdowns.length === 0) {
                countdownListEl.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center min-h-[50vh] animate-fade-in-up">
                        <div class="relative group cursor-pointer transition-transform duration-500 hover:scale-105" onclick="showModal()">
                            <div class="absolute inset-0 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-full blur-[50px] opacity-20 group-hover:opacity-40 transition duration-500"></div>
                            <div class="relative w-24 h-24 bg-white/5 border border-white/10 rounded-3xl flex items-center justify-center shadow-2xl backdrop-blur-sm">
                                <i data-lucide="plus" class="w-10 h-10 text-indigo-400 group-hover:text-white transition duration-500"></i>
                            </div>
                        </div>

                        <h2 class="text-3xl font-display font-bold text-transparent bg-clip-text bg-gradient-to-br from-white to-white/50 mt-10 mb-3 text-center tracking-tight">
                            Ready to Start?
                        </h2>
                        <p class="text-gray-400 text-sm max-w-sm text-center leading-relaxed mb-10 font-light">
                            Your dashboard is currently empty. Add a target date to begin tracking your deadlines with precision.
                        </p>

                        <button onclick="showModal()" class="group relative px-8 py-4 bg-white text-black rounded-xl font-bold tracking-wide overflow-hidden shadow-[0_0_40px_rgba(255,255,255,0.1)] transition-all duration-300 hover:shadow-[0_0_60px_rgba(255,255,255,0.3)] hover:scale-105 active:scale-95">
                            <span class="relative z-10 flex items-center gap-2">
                                Create New Timer <i data-lucide="arrow-right" class="w-4 h-4 transition-transform group-hover:translate-x-1"></i>
                            </span>
                        </button>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            const units = [
                { key: 'days', label: 'DAYS', show: true },
                { key: 'hours', label: 'HRS', show: currentSettings.showHours },
                { key: 'minutes', label: 'MIN', show: currentSettings.showMinutes },
                { key: 'seconds', label: 'SEC', show: currentSettings.showSeconds }
            ];

            const sortedCountdowns = [...activeCountdowns].sort((a, b) => {
                 const timeA = new Date(a.targetDate).getTime();
                 const timeB = new Date(b.targetDate).getTime();
                 return timeA - timeB; 
            });

            sortedCountdowns.forEach((item, index) => {
                const { id, headline, targetDate } = item;
                const time = calculateRemainingTime(targetDate);
                const styles = getStatusStyles(time.totalDays, time.isPast);
                
                const mainColor = styles.colorHex;
                // REMOVED constant shadow. Only setting variables for CSS to use on hover.
                const glowColor = mainColor;
                const glowColorSoft = hexToRgba(mainColor, 0.4);
                
                const pillStyle = `background-color: ${hexToRgba(mainColor, 0.1)}; color: ${hexToRgba(mainColor, 0.9)}; border-color: ${hexToRgba(mainColor, 0.2)}`;
                const textStyle = `color: ${mainColor}`;
                
                const countdownDiv = document.createElement('div');
                countdownDiv.id = `countdown-${id}`;
                countdownDiv.style.animationDelay = `${index * 50}ms`;
                // IMPORTANT: Add tabindex="0" so the div can be focused on touch/click
                countdownDiv.setAttribute('tabindex', '0'); 
                
                // Pass dynamic colors as CSS variables
                countdownDiv.style.setProperty('--glow-color', glowColor);
                countdownDiv.style.setProperty('--glow-color-soft', glowColorSoft);
                
                // Add specific class for expired items if we want them to always glow a bit (optional, kept subtle)
                const expiredClass = time.isPast ? 'is-expired' : '';
                countdownDiv.className = `glass-card p-6 rounded-3xl animate-fade-in-up group ${expiredClass}`; 

                const displayDate = new Date(targetDate).toLocaleString('en-US', {
                    weekday: 'short', 
                    month: 'short', 
                    day: 'numeric', 
                    hour: 'numeric', 
                    minute: '2-digit'
                });

                const safeHeadline = headline.replace(/'/g, "&apos;");

                const gridItems = units
                    .filter(unit => unit.show)
                    .map(unit => `
                        <div class="p-3 bg-black/40 rounded-2xl border border-white/5 backdrop-blur-md">
                            <div class="countdown-number font-mono font-black tracking-tighter tabular-nums leading-none mb-1" 
                                 style="${textStyle}" 
                                 data-unit="${unit.key}">--</div>
                            <div class="text-[10px] font-bold text-gray-500 tracking-widest opacity-70">${unit.label}</div>
                        </div>
                    `)
                    .join('');

                const activeUnitCount = units.filter(unit => unit.show).length;
                let gridColsClass = activeUnitCount === 4 ? 'grid-cols-4' : 
                                    activeUnitCount === 3 ? 'grid-cols-3' : 
                                    activeUnitCount === 2 ? 'grid-cols-2' : 'grid-cols-1';

                countdownDiv.innerHTML = `
                    <div class="flex justify-between items-start mb-6">
                        <div class="pr-2 w-full overflow-hidden">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border tracking-wider" style="${pillStyle}">${styles.label}</span>
                            </div>
                            <h3 class="text-xl font-bold text-white/95 truncate leading-tight tracking-tight">${headline}</h3>
                            <p class="text-xs font-medium text-gray-400 mt-1.5 flex items-center gap-1.5">
                                <i data-lucide="calendar-clock" class="w-3.5 h-3.5 opacity-70"></i> ${displayDate}
                            </p>
                        </div>
                        
                        <!-- Actions: Hidden by default (opacity-0). Appear on Hover (Desktop) or Focus/Touch (Mobile) -->
                        <div class="flex flex-col space-y-1 opacity-0 group-hover:opacity-100 group-focus:opacity-100 group-focus-within:opacity-100 transition-opacity duration-200">
                            <button class="text-gray-400 hover:text-white p-2 rounded-xl hover:bg-white/10 transition active:scale-95" onclick="editCountdown('${id}', '${safeHeadline}', '${targetDate}')">
                                <i data-lucide="pencil" class="w-4 h-4"></i>
                            </button>
                            <button class="text-gray-400 hover:text-red-400 p-2 rounded-xl hover:bg-red-500/10 transition active:scale-95" onclick="deleteCountdown('${id}')">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="grid ${gridColsClass} gap-2 text-center relative z-10" id="timer-display-${id}">
                        ${gridItems}
                    </div>
                `;

                countdownListEl.appendChild(countdownDiv);
            });

            lucide.createIcons();
            updateAllCountdowns();
        };

        const updateAllCountdowns = () => {
            activeCountdowns.forEach(item => {
                const { id, targetDate } = item;
                const timerDisplayEl = document.getElementById(`timer-display-${id}`);
                const wrapperEl = document.getElementById(`countdown-${id}`);
                
                if (!timerDisplayEl || !wrapperEl) return;

                const time = calculateRemainingTime(targetDate);
                const styles = getStatusStyles(time.totalDays, time.isPast);
                
                const mainColor = styles.colorHex;
                const glowColor = mainColor;
                const glowColorSoft = hexToRgba(mainColor, 0.4);

                // Update CSS Variables dynamically in case color changed
                wrapperEl.style.setProperty('--glow-color', glowColor);
                wrapperEl.style.setProperty('--glow-color-soft', glowColorSoft);

                if (time.isPast && !timerDisplayEl.classList.contains('deadline-passed')) {
                    const expiredBg = hexToRgba(mainColor, 0.1);
                    const expiredBorder = hexToRgba(mainColor, 0.2);
                    
                    timerDisplayEl.innerHTML = `
                        <div class="col-span-full py-4 rounded-xl border animate-pulse" style="background-color: ${expiredBg}; border-color: ${expiredBorder}">
                            <p class="text-center text-base font-bold tracking-wide uppercase" style="color: ${mainColor}">Time's Up</p>
                        </div>`;
                    timerDisplayEl.classList.add('deadline-passed');
                    wrapperEl.classList.add('is-expired');
                
                } else if (!time.isPast) {
                    // Remove expired class if user updated date to future
                    wrapperEl.classList.remove('is-expired');
                    
                    // If returning from expired state, we'd need to re-render grid, but simplest is just update text
                    // NOTE: If structure changed (Time's Up -> Grid), renderCountdowns handles it on next full render/edit
                    // For pure time updates:
                    const unitElements = timerDisplayEl.querySelectorAll('[data-unit]');
                    if(unitElements.length > 0) {
                        unitElements.forEach(el => {
                            const unit = el.getAttribute('data-unit');
                            el.textContent = String(time[unit]).padStart(2, '0');
                            el.style.color = mainColor;
                        });
                        
                         if (time.days > 0 && !currentSettings.showHours && !currentSettings.showMinutes && !currentSettings.showSeconds) {
                             const daysEl = timerDisplayEl.querySelector('[data-unit="days"]');
                             if (daysEl) daysEl.textContent = Math.ceil(time.totalDays);
                        }
                    } else if (timerDisplayEl.classList.contains('deadline-passed')) {
                        // Was passed, now future (e.g. quick edit without full reload), force full re-render
                        renderCountdowns();
                    }
                }
            });
        };

        if (countdownInterval) clearInterval(countdownInterval);
        countdownInterval = setInterval(updateAllCountdowns, 1000);

        window.showModal = (id = null, headline = '', targetDate = '') => {
            docIdInput.value = id || '';
            headlineInput.value = headline;
            
            if (targetDate) {
                const dateObj = new Date(targetDate);
                const offset = dateObj.getTimezoneOffset() * 60000;
                const localISOTime = (new Date(dateObj - offset)).toISOString().slice(0, -1);
                targetDatePartInput.value = localISOTime.substring(0, 10);
                targetTimePartInput.value = localISOTime.substring(11, 16);
            } else {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                targetDatePartInput.value = `${year}-${month}-${day}`;
                targetTimePartInput.value = "12:00";
            }
            
            document.getElementById('modal-title').textContent = id ? 'Edit Timer' : 'New Timer';
            document.getElementById('save-button').textContent = id ? 'Update' : 'Start Timer';

            countdownModalEl.classList.remove('hidden');
            setTimeout(() => {
                countdownModalContentEl.classList.remove('opacity-0', 'scale-95');
                countdownModalContentEl.classList.add('opacity-100', 'scale-100');
            }, 10);
        };

        window.hideModal = () => {
            countdownModalContentEl.classList.remove('opacity-100', 'scale-100');
            countdownModalContentEl.classList.add('opacity-0', 'scale-95');
            setTimeout(() => {
                countdownModalEl.classList.add('hidden');
                countdownForm.reset();
            }, 300);
        };
        
        window.editCountdown = (id, headline, targetDate) => {
            showModal(id, headline.replace(/&apos;/g, "'"), targetDate);
        };

        window.showSettingsModal = () => {
            siteTitleFontInput.value = currentSettings.siteTitleFont === defaultSettings.siteTitleFont ? '' : currentSettings.siteTitleFont;
            headingFontInput.value = currentSettings.headingFont === defaultSettings.headingFont ? '' : currentSettings.headingFont;
            countdownFontInput.value = currentSettings.countdownFont === defaultSettings.countdownFont ? '' : currentSettings.countdownFont;
            toggleHoursInput.checked = currentSettings.showHours;
            toggleMinutesInput.checked = currentSettings.showMinutes;
            toggleSecondsInput.checked = currentSettings.showSeconds;
            
            urgentDaysInput.value = currentSettings.urgentDays;
            soonDaysInput.value = currentSettings.soonDays;
            urgentColorInput.value = currentSettings.urgentColor;
            soonColorInput.value = currentSettings.soonColor;
            onTrackColorInput.value = currentSettings.onTrackColor;
            expiredColorInput.value = currentSettings.expiredColor;

            settingsModalEl.classList.remove('hidden');
            setTimeout(() => {
                settingsModalContentEl.classList.remove('opacity-0', 'scale-95');
                settingsModalContentEl.classList.add('opacity-100', 'scale-100');
            }, 10);
        };

        window.hideSettingsModal = () => {
            settingsModalContentEl.classList.remove('opacity-100', 'scale-100');
            settingsModalContentEl.classList.add('opacity-0', 'scale-95');
            setTimeout(() => {
                settingsModalEl.classList.add('hidden');
            }, 300);
        };

        window.exportData = () => {
            const data = {
                settings: currentSettings,
                countdowns: activeCountdowns
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "deadline_dashboard_backup.json");
            document.body.appendChild(downloadAnchorNode); 
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        };

        window.importData = (input) => {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    if (data.settings) {
                        currentSettings = { ...defaultSettings, ...data.settings };
                        localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(currentSettings));
                    }
                    
                    if (data.countdowns && Array.isArray(data.countdowns)) {
                        activeCountdowns = data.countdowns;
                        localStorage.setItem(COUNTDOWN_STORAGE_KEY, JSON.stringify(activeCountdowns));
                    }
                    
                    applySettings();
                    renderCountdowns();
                    
                    const statusEl = document.getElementById('import-status');
                    statusEl.textContent = "Backup restored successfully!";
                    statusEl.className = "text-[10px] text-center mt-2 h-4 text-emerald-400 font-bold transition-opacity";
                    statusEl.classList.remove('opacity-0');
                    setTimeout(() => statusEl.classList.add('opacity-0'), 3000);
                    
                    input.value = '';
                    
                    if (!settingsModalEl.classList.contains('hidden')) {
                        showSettingsModal();
                    }

                } catch (err) {
                    console.error("Import failed:", err);
                    const statusEl = document.getElementById('import-status');
                    statusEl.className = "text-[10px] text-center mt-2 h-4 text-red-400 font-bold transition-opacity";
                    statusEl.textContent = "Invalid file format.";
                    statusEl.classList.remove('opacity-0');
                    setTimeout(() => statusEl.classList.add('opacity-0'), 3000);
                }
            };
            reader.readAsText(file);
        };

        countdownForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = docIdInput.value;
            const headline = headlineInput.value;
            const datePart = targetDatePartInput.value;
            const timePart = targetTimePartInput.value;
            
            if (headline && datePart && timePart) {
                const combinedDate = new Date(`${datePart}T${timePart}`);
                saveCountdown(id, headline, combinedDate.toISOString());
            }
        });

        const initializeApp = () => {
            loadCountdowns();
            loadSettings();
            applySettings();
            renderCountdowns();
            loadingSpinnerEl.style.display = 'none';
        };

        initializeApp();
    </script>
</body>
</html>
