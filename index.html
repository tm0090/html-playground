<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Video Finish Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #09090b; /* Deep zinc */
            --card-bg: rgba(24, 24, 27, 0.6);
            --card-border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(9, 9, 11, 0.7);
            --input-border: rgba(255, 255, 255, 0.05);
            --accent: #6366f1; /* Indigo */
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-base);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f4f4f5;
            font-variant-numeric: tabular-nums;
            overflow-x: hidden;
        }

        /* Ambient Background Mesh */
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.08) 0%, transparent 50%);
            filter: blur(60px);
        }

        /* Premium Glass Card */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid var(--card-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        /* Input Styling */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .input-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #a1a1aa; /* zinc-400 */
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        input {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: #ffffff;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        input::placeholder {
            color: #52525b; /* zinc-600 */
            font-weight: 400;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(24, 24, 27, 0.9);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15), inset 0 2px 4px rgba(0,0,0,0.2);
            transform: translateY(-2px);
        }

        /* Results Boxes */
        .result-box-primary {
            background: rgba(9, 9, 11, 0.4); /* Solid dark base to let the progress fill shine */
            border: 1px solid rgba(99, 102, 241, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .result-box-primary::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--accent);
            border-radius: 4px 0 0 4px;
            z-index: 2; /* Keep above the fill */
        }

        /* The New Dynamic Progress Fill */
        #progressFill {
            position: absolute;
            top: 0; 
            left: 0; 
            height: 100%;
            /* Minimal, eye-pleasing soft gradient */
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.05) 0%, rgba(99, 102, 241, 0.25) 100%);
            box-shadow: 2px 0 16px rgba(99, 102, 241, 0.2);
            z-index: 0;
            width: 0%;
            /* Transition is managed dynamically in JS for the best feel */
        }

        .result-box-secondary {
            background: rgba(9, 9, 11, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 4px 20px rgba(0,0,0,0.4);
        }

        /* Animations */
        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Button States (High Contrast Modern) */
        .btn-base {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-idle {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 4px 14px 0 rgba(255, 255, 255, 0.1);
        }
        .btn-idle:hover {
            background: #f4f4f5;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.15);
        }
        
        .btn-live {
            background: #10b981;
            color: #ffffff;
            box-shadow: 0 0 24px rgba(16, 185, 129, 0.3);
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .btn-live:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-paused {
            background: #f59e0b;
            color: #ffffff;
            box-shadow: 0 0 24px rgba(245, 158, 11, 0.3);
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .btn-paused:hover {
            background: #d97706;
            transform: translateY(-2px);
        }

        /* Pulse Animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .tracking-dot {
            animation: pulse-ring 2s infinite;
        }
    </style>
</head>
<body class="p-6">

    <div class="ambient-bg"></div>

    <div class="glass-card w-full max-w-2xl rounded-[2.5rem] p-10 md:p-14 relative z-10">
        <header class="mb-12 text-center">
            <h1 class="text-5xl font-bold tracking-tight text-white mb-4">Finish Timer</h1>
            <p class="text-zinc-400 text-xl font-light">Calculate exactly when you'll finish watching.</p>
        </header>

        <div class="space-y-10">
            <!-- Time Inputs -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <div class="input-group">
                    <label>Current Progress</label>
                    <div class="flex gap-4">
                        <input type="number" id="currH" placeholder="H" class="w-full py-5 rounded-2xl text-center font-semibold text-2xl" min="0" value="0">
                        <input type="number" id="currM" placeholder="M" class="w-full py-5 rounded-2xl text-center font-semibold text-2xl" min="0" max="59" value="0">
                        <input type="number" id="currS" placeholder="S" class="w-full py-5 rounded-2xl text-center font-semibold text-2xl" min="0" max="59" value="0">
                    </div>
                </div>

                <div class="input-group">
                    <label>Total Duration</label>
                    <div class="flex gap-4">
                        <input type="number" id="totalH" placeholder="H" class="w-full py-5 rounded-2xl text-center font-semibold text-2xl" min="0" value="0">
                        <input type="number" id="totalM" placeholder="M" class="w-full py-5 rounded-2xl text-center font-semibold text-2xl" min="0" max="59" value="0">
                        <input type="number" id="totalS" placeholder="S" class="w-full py-5 rounded-2xl text-center font-semibold text-2xl" min="0" max="59" value="0">
                    </div>
                </div>
            </div>

            <!-- Speed and Calculate -->
            <div class="flex flex-col md:flex-row gap-10 items-end">
                <div class="input-group flex-1 w-full">
                    <label>Playback Speed</label>
                    <div class="relative">
                        <input type="number" id="speed" step="0.05" value="1.00" class="w-full py-5 pl-8 pr-16 rounded-2xl font-semibold text-2xl" min="0.1">
                        <span class="absolute right-8 top-1/2 -translate-y-1/2 text-zinc-500 font-bold text-2xl select-none">x</span>
                    </div>
                </div>
                
                <button id="calcBtn" onclick="toggleLiveSystem()" class="btn-base btn-idle w-full md:w-auto font-bold py-6 px-12 rounded-2xl transform active:scale-95 text-xl uppercase tracking-widest">
                    Start Tracking
                </button>
            </div>

            <!-- Results Section -->
            <div id="results" class="hidden space-y-6 animate-fade-in pt-6">
                
                <div class="result-box-primary p-8 rounded-[2rem]">
                    <!-- Background Progress Fill -->
                    <div id="progressFill"></div>
                    
                    <!-- Content Wrapper (z-10 to stay above progress fill) -->
                    <div class="relative z-10">
                        <div class="flex justify-between items-center mb-3">
                            <p class="text-xs text-indigo-400 font-bold uppercase tracking-[0.2em]">Time Remaining</p>
                            <!-- Dynamic Live Badge -->
                            <div class="flex items-center gap-2 text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full hidden border" id="liveBadge">
                                <span class="w-2 h-2 rounded-full" id="liveDot"></span> 
                                <span id="liveText">Tracking</span>
                            </div>
                        </div>
                        <h2 id="remainingDisplay" class="text-4xl md:text-5xl font-bold text-white tracking-tight">0<span class="text-indigo-300 text-3xl font-medium">h</span> 0<span class="text-indigo-300 text-3xl font-medium">m</span> 0<span class="text-indigo-300 text-3xl font-medium">s</span></h2>
                        <p class="text-base text-zinc-400 mt-2 font-medium">Watching at <span id="speedLabel" class="text-white font-bold">1.0</span>x speed</p>
                    </div>
                </div>

                <div class="result-box-secondary p-8 rounded-[2rem]">
                    <p class="text-xs text-zinc-500 font-bold uppercase tracking-[0.2em] mb-3">Target Arrival Time</p>
                    <h2 id="finishClockDisplay" class="text-5xl md:text-6xl font-bold text-white tracking-tight">--:-- --</h2>
                    <div class="flex items-center gap-3 mt-3">
                        <div class="h-px w-6 bg-zinc-700"></div>
                        <p id="finishDateLabel" class="text-base text-zinc-400 italic font-medium">Today</p>
                    </div>
                </div>
                
            </div>
        </div>

        <footer class="mt-16 text-center text-xs text-zinc-600 uppercase tracking-[0.3em] font-bold">
             Made with ♥️ by Tamim
        </footer>
    </div>

    <script>
        let isSystemLive = false;
        let isPaused = false;
        let clockInterval;
        let exactCurrentSeconds = 0;
        let targetFinishTimestamp = 0;
        let lastTickTime = 0;

        // 1. Setup Input Event Listeners
        document.querySelectorAll('input[type="number"]').forEach(input => {
            input.addEventListener('input', () => {
                if (isSystemLive) performCalculations(false);
            });

            input.addEventListener('wheel', (e) => {
                e.preventDefault();
                
                const step = parseFloat(input.step) || 1;
                const direction = e.deltaY > 0 ? -1 : 1;
                let newValue = parseFloat(input.value || 0) + (direction * step);

                const min = input.hasAttribute('min') ? parseFloat(input.min) : -Infinity;
                const max = input.hasAttribute('max') ? parseFloat(input.max) : Infinity;
                
                if (newValue < min) newValue = min;
                if (newValue > max) newValue = max;

                if (step < 1) {
                    input.value = newValue.toFixed(2);
                } else {
                    input.value = Math.round(newValue);
                }

                if (isSystemLive) performCalculations(false);
            });

            // Auto select for quick typing
            input.addEventListener('focus', function() {
                this.select();
            });
        });

        function toggleLiveSystem() {
            const btn = document.getElementById('calcBtn');
            const badge = document.getElementById('liveBadge');
            const badgeDot = document.getElementById('liveDot');
            const badgeText = document.getElementById('liveText');
            const results = document.getElementById('results');

            const baseBtnClasses = "btn-base w-full md:w-auto font-bold py-6 px-12 rounded-2xl transform active:scale-95 text-xl uppercase tracking-widest ";

            if (!isSystemLive) {
                // START
                isSystemLive = true;
                isPaused = false;
                
                btn.innerText = "Pause";
                btn.className = baseBtnClasses + "btn-live";
                
                badge.className = "flex items-center gap-2 text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full border border-emerald-500/30 bg-emerald-500/10 text-emerald-400";
                badgeDot.className = "w-2 h-2 rounded-full bg-emerald-400 tracking-dot";
                badgeText.innerText = "Tracking";
                badge.classList.remove('hidden');
                
                results.classList.remove('hidden');

                performCalculations(false);

                if (clockInterval) clearInterval(clockInterval);
                clockInterval = setInterval(() => {
                    if (isSystemLive) performCalculations(true); 
                }, 1000);

            } else if (!isPaused) {
                // PAUSE
                isPaused = true;
                
                btn.innerText = "Resume";
                btn.className = baseBtnClasses + "btn-paused";
                
                badge.className = "flex items-center gap-2 text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full border border-amber-500/30 bg-amber-500/10 text-amber-400";
                badgeDot.className = "w-2 h-2 rounded-full bg-amber-400"; 
                badgeText.innerText = "Paused";
                
                lastTickTime = Date.now(); 

            } else {
                // RESUME
                isPaused = false;
                
                btn.innerText = "Pause";
                btn.className = baseBtnClasses + "btn-live";
                
                badge.className = "flex items-center gap-2 text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full border border-emerald-500/30 bg-emerald-500/10 text-emerald-400";
                badgeDot.className = "w-2 h-2 rounded-full bg-emerald-400 tracking-dot";
                badgeText.innerText = "Tracking";

                lastTickTime = Date.now(); 
            }
        }

        function performCalculations(isTickUpdate = false) {
            const totH = parseInt(document.getElementById('totalH').value) || 0;
            const totM = parseInt(document.getElementById('totalM').value) || 0;
            const totS = parseInt(document.getElementById('totalS').value) || 0;
            const durationTotalSeconds = (totH * 3600) + (totM * 60) + totS;

            const speed = parseFloat(document.getElementById('speed').value) || 1;

            if (!isTickUpdate) {
                const curH = parseInt(document.getElementById('currH').value) || 0;
                const curM = parseInt(document.getElementById('currM').value) || 0;
                const curS = parseInt(document.getElementById('currS').value) || 0;
                exactCurrentSeconds = (curH * 3600) + (curM * 60) + curS;
                
                lastTickTime = Date.now();
                
                const secondsLeft = Math.max(0, durationTotalSeconds - exactCurrentSeconds);
                const actualSecondsToWait = secondsLeft / speed;
                targetFinishTimestamp = Date.now() + (actualSecondsToWait * 1000);
            } else {
                const now = Date.now();
                const elapsedRealSeconds = (now - lastTickTime) / 1000;
                lastTickTime = now;
                
                if (!isPaused) {
                    exactCurrentSeconds += (elapsedRealSeconds * speed);
                    
                    if (exactCurrentSeconds >= durationTotalSeconds) {
                        exactCurrentSeconds = durationTotalSeconds;
                        clearInterval(clockInterval);
                        isSystemLive = false;
                        isPaused = false;
                        
                        const btn = document.getElementById('calcBtn');
                        btn.innerText = "Finished!";
                        btn.className = "btn-base w-full md:w-auto font-bold py-6 px-12 rounded-2xl text-xl uppercase tracking-widest bg-zinc-800 text-zinc-400 cursor-default";
                        document.getElementById('liveBadge').classList.add('hidden');
                    }

                    document.getElementById('currH').value = Math.floor(exactCurrentSeconds / 3600);
                    document.getElementById('currM').value = Math.floor((exactCurrentSeconds % 3600) / 60);
                    document.getElementById('currS').value = Math.floor(exactCurrentSeconds % 60);
                }

                const secondsLeft = Math.max(0, durationTotalSeconds - exactCurrentSeconds);
                const actualSecondsToWait = secondsLeft / speed;
                targetFinishTimestamp = Date.now() + (actualSecondsToWait * 1000);
            }

            if (durationTotalSeconds <= exactCurrentSeconds && !isTickUpdate) {
                if (durationTotalSeconds > 0) showError("Progress exceeds total duration");
                return;
            }

            // Update Background Progress Bar
            let progressPercent = 0;
            if (durationTotalSeconds > 0) {
                progressPercent = (exactCurrentSeconds / durationTotalSeconds) * 100;
                progressPercent = Math.min(100, Math.max(0, progressPercent)); // Clamp between 0-100
            }
            
            const progressFill = document.getElementById('progressFill');
            // Smooth transition during playback, snappy transition during manual input
            if (isTickUpdate && !isPaused) {
                progressFill.style.transition = 'width 1s linear';
            } else {
                progressFill.style.transition = 'width 0.3s ease-out';
            }
            progressFill.style.width = `${progressPercent}%`;

            const secondsLeft = Math.max(0, durationTotalSeconds - exactCurrentSeconds);
            const actualSecondsToWait = secondsLeft / speed;

            const remH = Math.floor(actualSecondsToWait / 3600);
            const remM = Math.floor((actualSecondsToWait % 3600) / 60);
            const remS = Math.floor(actualSecondsToWait % 60);

            document.getElementById('remainingDisplay').innerHTML = 
                `${remH}<span class="text-indigo-300 text-2xl md:text-3xl font-medium ml-1 mr-3">h</span> ` +
                `${remM}<span class="text-indigo-300 text-2xl md:text-3xl font-medium ml-1 mr-3">m</span> ` +
                `${remS}<span class="text-indigo-300 text-2xl md:text-3xl font-medium ml-1">s</span>`;
                
            document.getElementById('speedLabel').innerText = speed.toFixed(2);

            const finishDate = new Date(targetFinishTimestamp);
            const options = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            document.getElementById('finishClockDisplay').innerText = finishDate.toLocaleTimeString([], options);
            
            const isTomorrow = finishDate.getDate() !== new Date().getDate();
            document.getElementById('finishDateLabel').innerText = isTomorrow ? "Finishing tomorrow" : "Finishing today";
            document.getElementById('finishDateLabel').className = `text-base italic font-medium ${isTomorrow ? 'text-amber-400' : 'text-zinc-400'}`;
        }

        function showError(msg) {
            document.getElementById('remainingDisplay').innerHTML = '<span class="text-3xl text-red-400">Invalid Range</span>';
            document.getElementById('finishClockDisplay').innerText = "--:-- --";
            document.getElementById('finishDateLabel').innerText = msg;
            document.getElementById('finishDateLabel').className = "text-base italic font-medium text-red-400";
            document.getElementById('progressFill').style.width = '0%';
        }
    </script>
</body>
</html>
