<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCU Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-dim: #8a6e2f;
    --gold-bright: #e8c76a;
    --bg: #0a0908;
    --bg2: #111009;
    --bg3: #161410;
    --card: #1a1714;
    --card2: #201d19;
    --border: #2e2a24;
    --border2: #3d3830;
    --text: #e8e0d0;
    --text2: #9a9080;
    --text3: #5a5448;
    --green: #4a8c5c;
    --green-bg: #162218;
    --red: #8c4a4a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.4;
  }
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,9,8,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex; align-items: center; justify-content: space-between;
    height: 64px;
  }
  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem; font-weight: 600;
    color: var(--gold);
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .logo span { color: var(--text2); font-weight: 400; font-style: italic; font-size: 1rem; }
  .header-right { display: flex; align-items: center; gap: 0.75rem; }
  .hdr-btn {
    display: flex; align-items: center; gap: 7px;
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--text2);
    padding: 7px 14px;
    border-radius: 4px;
    font-family: 'Outfit', sans-serif;
    font-size: 0.78rem; font-weight: 400;
    cursor: pointer; transition: all 0.2s;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .hdr-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
  .hdr-btn.danger:hover { border-color: var(--red); color: #c98080; }
  .hdr-btn svg { width:13px; height:13px; flex-shrink:0; }

  .stats-bar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex; align-items: center; gap: 2rem;
    height: 52px; overflow-x: auto;
  }
  .stat { display: flex; align-items: center; gap: 10px; white-space: nowrap; flex-shrink: 0; }
  .stat-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem; font-weight: 600;
    color: var(--gold); line-height: 1;
  }
  .stat-label { font-size: 0.7rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; line-height: 1.3; }
  .stat-sep { width: 1px; height: 28px; background: var(--border); }
  .total-bar-wrap { flex: 1; min-width: 120px; max-width: 280px; }
  .total-bar-track { height: 3px; background: var(--border2); border-radius: 2px; overflow: hidden; margin-top: 4px; }
  .total-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold-bright));
    border-radius: 2px;
    transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
  }

  main { max-width: 1100px; margin: 0 auto; padding: 2rem; }

  .saga { margin-bottom: 3rem; }
  .saga-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.75rem; font-weight: 400;
    color: var(--text3); text-transform: uppercase; letter-spacing: 0.2em;
    margin-bottom: 0.5rem; padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }
  .phase { margin-bottom: 2rem; }
  .phase-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
  .phase-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem; font-weight: 600; color: var(--text); white-space: nowrap;
  }
  .phase-count { font-size: 0.75rem; color: var(--text3); letter-spacing: 0.05em; white-space: nowrap; }
  .phase-bar-wrap { flex: 1; height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; }
  .phase-bar-fill { height: 100%; background: var(--gold-dim); border-radius: 1px; transition: width 0.5s ease; }
  .phase-bar-fill.full { background: var(--gold); }

  .movie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
  }
  .movie-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative; overflow: hidden;
    user-select: none;
  }
  .movie-card::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(201,168,76,0.04) 0%, transparent 60%);
    opacity: 0; transition: opacity 0.2s;
  }
  .movie-card:hover { border-color: var(--border2); background: var(--card2); transform: translateY(-1px); }
  .movie-card:hover::before { opacity: 1; }
  .movie-card.watched { background: var(--green-bg); border-color: rgba(74,140,92,0.3); }
  .movie-card.watched:hover { border-color: rgba(74,140,92,0.5); }
  .movie-card.upcoming { opacity: 0.6; cursor: default; }
  .movie-card.upcoming:hover { transform: none; }

  .movie-check {
    width: 16px; height: 16px;
    border: 1px solid var(--border2);
    border-radius: 3px;
    margin-bottom: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.2s;
  }
  .movie-card.watched .movie-check { background: var(--green); border-color: var(--green); }
  .movie-check svg { width:10px; height:10px; display:none; }
  .movie-card.watched .movie-check svg { display:block; }
  .movie-title { font-size: 0.85rem; font-weight: 500; color: var(--text); line-height: 1.35; margin-bottom: 6px; }
  .movie-card.watched .movie-title { color: #7dba93; }
  .movie-year { font-size: 0.7rem; color: var(--text3); letter-spacing: 0.04em; }
  .movie-watch-date { font-size: 0.68rem; color: #4a8c5c; margin-top: 4px; letter-spacing: 0.02em; }
  .movie-upcoming-badge { font-size: 0.65rem; color: var(--gold-dim); margin-top: 4px; letter-spacing: 0.04em; text-transform: uppercase; }

  .toast {
    position: fixed; bottom: 2rem; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--card2); border: 1px solid var(--border2);
    color: var(--text); padding: 12px 24px; border-radius: 6px;
    font-size: 0.85rem;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 500; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Reset modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); z-index: 900;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--border2);
    border-radius: 8px; padding: 2rem; max-width: 360px; width: 90%;
    text-align: center;
  }
  .modal h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; color: var(--text); margin-bottom: 0.75rem; }
  .modal p { font-size: 0.85rem; color: var(--text2); line-height: 1.6; margin-bottom: 1.5rem; }
  .modal-btns { display: flex; gap: 0.75rem; justify-content: center; }
  .modal-btn {
    padding: 9px 22px; border-radius: 4px;
    font-family: 'Outfit', sans-serif; font-size: 0.85rem; font-weight: 500;
    cursor: pointer; transition: all 0.2s; border: 1px solid var(--border2); 
  }
  .modal-btn.cancel { background: transparent; color: var(--text2); }
  .modal-btn.cancel:hover { border-color: var(--gold-dim); color: var(--gold); }
  .modal-btn.confirm { background: var(--red); color: #f0d8d8; border-color: var(--red); }
  .modal-btn.confirm:hover { background: #a05858; }
</style>
</head>
<body>

<header>
  <div class="logo">MCU <span>Tracker</span></div>
  <div class="header-right">
    <button class="hdr-btn" onclick="exportMd()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v8M5 7l3 3 3-3M3 12h10"/></svg>
      Export .md
    </button>
    <button class="hdr-btn danger" onclick="document.getElementById('resetModal').classList.add('open')">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3l10 10M13 3L3 13"/></svg>
      Reset
    </button>
  </div>
</header>

<div class="stats-bar">
  <div class="stat">
    <div class="stat-num" id="statWatched">0</div>
    <div class="stat-label">Watched</div>
  </div>
  <div class="stat-sep"></div>
  <div class="stat">
    <div class="stat-num" id="statTotal">0</div>
    <div class="stat-label">Total Films</div>
  </div>
  <div class="stat-sep"></div>
  <div class="stat">
    <div class="stat-num" id="statRemain">0</div>
    <div class="stat-label">Remaining</div>
  </div>
  <div class="stat-sep"></div>
  <div class="total-bar-wrap">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div class="stat-label">Progress</div>
      <div class="stat-label" id="statPct">0%</div>
    </div>
    <div class="total-bar-track">
      <div class="total-bar-fill" id="totalBarFill" style="width:0%"></div>
    </div>
  </div>
</div>

<main>
  <div id="content"></div>
</main>

<div class="toast" id="toast"></div>

<!-- Reset modal -->
<div class="modal-overlay" id="resetModal">
  <div class="modal">
    <h3>Reset all progress?</h3>
    <p>This will clear every watched date and mark all films as unwatched. This cannot be undone.</p>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="document.getElementById('resetModal').classList.remove('open')">Cancel</button>
      <button class="modal-btn confirm" onclick="resetAll()">Reset</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// MCU DATA — edit titles/years here if needed
// ─────────────────────────────────────────────
const MCU = [
  {
    saga: 'The Infinity Saga',
    phases: [
      {
        name: 'Phase One',
        movies: [
          { title: 'Iron Man', year: '2008' },
          { title: 'The Incredible Hulk', year: '2008' },
          { title: 'Iron Man 2', year: '2010' },
          { title: 'Thor', year: '2011' },
          { title: 'Captain America: The First Avenger', year: '2011' },
          { title: 'The Avengers', year: '2012' },
        ]
      },
      {
        name: 'Phase Two',
        movies: [
          { title: 'Iron Man 3', year: '2013' },
          { title: 'Thor: The Dark World', year: '2013' },
          { title: 'Captain America: The Winter Soldier', year: '2014' },
          { title: 'Guardians of the Galaxy', year: '2014' },
          { title: 'Avengers: Age of Ultron', year: '2015' },
          { title: 'Ant-Man', year: '2015' },
        ]
      },
      {
        name: 'Phase Three',
        movies: [
          { title: 'Captain America: Civil War', year: '2016' },
          { title: 'Doctor Strange', year: '2016' },
          { title: 'Guardians of the Galaxy Vol. 2', year: '2017' },
          { title: 'Spider-Man: Homecoming', year: '2017' },
          { title: 'Thor: Ragnarok', year: '2017' },
          { title: 'Black Panther', year: '2018' },
          { title: 'Avengers: Infinity War', year: '2018' },
          { title: 'Ant-Man and the Wasp', year: '2018' },
          { title: 'Captain Marvel', year: '2019' },
          { title: 'Avengers: Endgame', year: '2019' },
          { title: 'Spider-Man: Far From Home', year: '2019' },
        ]
      }
    ]
  },
  {
    saga: 'The Multiverse Saga',
    phases: [
      {
        name: 'Phase Four',
        movies: [
          { title: 'Black Widow', year: '2021' },
          { title: 'Shang-Chi and the Legend of the Ten Rings', year: '2021' },
          { title: 'Eternals', year: '2021' },
          { title: 'Spider-Man: No Way Home', year: '2021' },
          { title: 'Doctor Strange in the Multiverse of Madness', year: '2022' },
          { title: 'Thor: Love and Thunder', year: '2022' },
          { title: 'Black Panther: Wakanda Forever', year: '2022' },
        ]
      },
      {
        name: 'Phase Five',
        movies: [
          { title: 'Ant-Man and the Wasp: Quantumania', year: '2023' },
          { title: 'Guardians of the Galaxy Vol. 3', year: '2023' },
          { title: 'The Marvels', year: '2023' },
          { title: 'Deadpool & Wolverine', year: '2024' },
          { title: 'Captain America: Brave New World', year: '2025' },
          { title: 'Thunderbolts*', year: '2025' },
        ]
      },
      {
        name: 'Phase Six',
        movies: [
          { title: 'The Fantastic Four: First Steps', year: 'July 2025' },
          { title: 'Avengers: Doomsday', year: 'May 2026' },
          { title: 'Avengers: Secret Wars', year: 'May 2027' },
        ]
      }
    ]
  }
];

// ─────────────────────────────────────────────
// Storage: { "Iron Man": { watched: true, date: "April 27, 2026" } }
// ─────────────────────────────────────────────
const LS_KEY = 'mcu-watch-states';
const today = new Date();

function loadStates() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }
  catch { return {}; }
}
function saveStates(states) {
  localStorage.setItem(LS_KEY, JSON.stringify(states));
}

function fmtDate(d) {
  return d.toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
}

function isUpcoming(year) {
  const m = year.match(/(\d{4})/);
  if (!m) return false;
  const y = parseInt(m[1]);
  if (y > today.getFullYear()) return true;
  if (y === today.getFullYear()) {
    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const mM = year.match(/(January|February|March|April|May|June|July|August|September|October|November|December)/i);
    if (mM) {
      const idx = monthNames.findIndex(mn => mn.toLowerCase() === mM[1].toLowerCase());
      return idx > today.getMonth();
    }
  }
  return false;
}

// ─────────────────────────────────────────────
// Toggle
// ─────────────────────────────────────────────
function toggleWatch(title) {
  const states = loadStates();
  const cur = states[title];
  if (cur && cur.watched) {
    delete states[title];
    showToast('Removed from watched');
  } else {
    states[title] = { watched: true, date: fmtDate(today) };
    showToast('Marked as watched · ' + fmtDate(today));
  }
  saveStates(states);
  render();
}

function resetAll() {
  saveStates({});
  document.getElementById('resetModal').classList.remove('open');
  showToast('All progress cleared');
  render();
}

// ─────────────────────────────────────────────
// Export to .md
// ─────────────────────────────────────────────
function exportMd() {
  const states = loadStates();
  let md = '# MCU Watchlist\n\n';
  for (const saga of MCU) {
    md += `### ${saga.saga}\n\n`;
    for (const phase of saga.phases) {
      md += `#### ${phase.name}\n\n`;
      for (const movie of phase.movies) {
        const s = states[movie.title];
        const checked = s && s.watched ? 'x' : ' ';
        const datePart = s && s.watched ? ` — ✅ ${s.date}` : '';
        md += `- [${checked}] ${movie.title} (${movie.year})${datePart}\n`;
      }
      md += '\n';
    }
  }
  const blob = new Blob([md], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mcu-watchlist.md';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('Downloaded mcu-watchlist.md');
}

// ─────────────────────────────────────────────
// Render
// ─────────────────────────────────────────────
function render() {
  const states = loadStates();
  let totalWatched = 0, totalMovies = 0;
  let html = '';

  for (const saga of MCU) {
    html += `<div class="saga"><div class="saga-title">${saga.saga}</div>`;

    for (const phase of saga.phases) {
      const pw = phase.movies.filter(m => states[m.title] && states[m.title].watched).length;
      const pt = phase.movies.length;
      const pct = Math.round(pw / pt * 100);
      totalWatched += pw; totalMovies += pt;
      const fullClass = pw === pt ? ' full' : '';

      html += `<div class="phase">
        <div class="phase-header">
          <div class="phase-name">${phase.name}</div>
          <div class="phase-bar-wrap"><div class="phase-bar-fill${fullClass}" style="width:${pct}%"></div></div>
          <div class="phase-count">${pw}/${pt}</div>
        </div>
        <div class="movie-grid">`;

      for (const movie of phase.movies) {
        const s = states[movie.title];
        const watched = !!(s && s.watched);
        const upcoming = !watched && isUpcoming(movie.year);
        const cls = watched ? ' watched' : upcoming ? ' upcoming' : '';
        const checkmark = watched ? `<svg viewBox="0 0 10 8" fill="none" stroke="white" stroke-width="1.8"><polyline points="1,4 4,7 9,1"/></svg>` : '';
        const dateEl = watched && s.date ? `<div class="movie-watch-date">Watched ${s.date}</div>` : '';
        const upcomingEl = upcoming ? `<div class="movie-upcoming-badge">Upcoming</div>` : '';
        const clickAttr = upcoming ? '' : `onclick="toggleWatch(${JSON.stringify(movie.title)})"`;

        html += `<div class="movie-card${cls}" ${clickAttr}>
          <div class="movie-check">${checkmark}</div>
          <div class="movie-title">${movie.title}</div>
          <div class="movie-year">${movie.year}</div>
          ${dateEl}${upcomingEl}
        </div>`;
      }

      html += `</div></div>`;
    }
    html += `</div>`;
  }

  document.getElementById('content').innerHTML = html;

  document.getElementById('statWatched').textContent = totalWatched;
  document.getElementById('statTotal').textContent = totalMovies;
  document.getElementById('statRemain').textContent = totalMovies - totalWatched;
  const pct = totalMovies ? Math.round(totalWatched / totalMovies * 100) : 0;
  document.getElementById('statPct').textContent = pct + '%';
  document.getElementById('totalBarFill').style.width = pct + '%';
}

// ─────────────────────────────────────────────
// Toast
// ─────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// Close modal on overlay click
document.getElementById('resetModal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('open');
});

// Boot
render();
</script>
</body>
</html>
