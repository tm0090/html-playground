<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tab-title">Workspace</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SortableJS for Drag & Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        surface: '#09090b', 
                        surfaceHover: '#121214', 
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'slide-down': 'slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'stagger-up': 'staggerUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-slow': 'pulseSlow 4s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideDown: {
                            '0%': { transform: 'translateY(-20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        staggerUp: {
                            '0%': { transform: 'translateY(30px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        pulseSlow: {
                            '0%, 100%': { opacity: '0.4' },
                            '50%': { opacity: '0.8' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #000000;
            color: #ededed;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            letter-spacing: -0.015em;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
        ::selection { background: rgba(255,255,255,0.15); color: #fff; }

        /* Premium Card Architecture - Scaled Up */
        .premium-card {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px; /* Larger radius */
            padding: 1px; /* Border width */
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .premium-card:hover {
            transform: translateY(-4px) scale(1.01);
            z-index: 10;
        }

        /* Isolated Border Glow - Only triggers on hover */
        .premium-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(
                600px circle at var(--mouse-x) var(--mouse-y), 
                rgba(255, 255, 255, 0.4), 
                transparent 40%
            );
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
        }

        .premium-card:hover::before {
            opacity: 1; /* Only illuminate the hovered card */
        }

        /* Inner Surface */
        .premium-card-inner {
            background: #09090b; 
            border-radius: 23px;
            position: relative;
            height: 100%;
            z-index: 1;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.04);
            transition: background 0.4s ease;
        }

        .premium-card:hover .premium-card-inner {
            background: #111113; 
        }

        /* Inner Spot Light */
        .premium-card-inner::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(
                400px circle at var(--mouse-x) var(--mouse-y), 
                rgba(255, 255, 255, 0.04), 
                transparent 40%
            );
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 2;
        }
        .premium-card:hover .premium-card-inner::before { opacity: 1; }

        /* Sortable States */
        .sortable-ghost { opacity: 0.05; transform: scale(0.95); }
        .sortable-drag { cursor: grabbing !important; box-shadow: 0 40px 80px rgba(0,0,0,0.9); }

        /* Seamless Nav */
        .glass-nav {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(32px) saturate(200%);
            -webkit-backdrop-filter: blur(32px) saturate(200%);
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        /* Cmd Input */
        .cmd-input {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            transition: all 0.3s ease;
        }
        .cmd-input:focus-within {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.1);
            box-shadow: 0 0 20px rgba(255,255,255,0.03);
        }

        [contenteditable] { outline: none; transition: opacity 0.2s; }
        [contenteditable]:focus { opacity: 0.7; }

        /* Soft global light */
        .ambient-glow {
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 60vh;
            background: radial-gradient(ellipse at top, rgba(255,255,255,0.04), transparent 70%);
            pointer-events: none;
            z-index: -1;
            filter: blur(120px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative selection:bg-white/20">

    <div class="ambient-glow animate-pulse-slow"></div>

    <!-- Sticky Command Bar -->
    <nav class="glass-nav sticky top-0 z-40 w-full animate-slide-down">
        <div class="max-w-7xl mx-auto px-6 lg:px-12 h-20 flex items-center justify-between gap-4">
            
            <div class="flex items-center gap-6 min-w-0">
                <div class="hidden sm:block">
                    <!-- Updated to AM/PM -->
                    <div id="live-time" class="text-xs font-mono text-zinc-500 tracking-wider">00:00 AM</div>
                </div>
                <div class="h-6 w-px bg-white/[0.06] hidden sm:block"></div>
                <h1 id="main-title" 
                    contenteditable="true" 
                    spellcheck="false"
                    class="text-lg font-medium text-zinc-100 truncate cursor-text"
                    onblur="saveHeaderData()"
                    onkeydown="handleTextKeydown(event)"
                    onclick="selectAllOnFocus(this)">
                    Workspace
                </h1>
            </div>

            <div class="flex items-center gap-4 w-full sm:w-auto justify-end">
                
                <div class="relative w-full max-w-[260px] group cmd-input rounded-2xl flex items-center px-4 py-2.5 cursor-text" onclick="document.getElementById('search-input').focus()">
                    <i class="ph ph-magnifying-glass text-zinc-500 group-focus-within:text-zinc-300"></i>
                    <input type="text" id="search-input" oninput="filterLinks()" placeholder="Search..." class="bg-transparent border-none outline-none text-sm text-white placeholder-zinc-600 w-full ml-3">
                    <div class="hidden sm:flex items-center justify-center bg-white/5 rounded px-2 py-0.5 text-[10px] font-mono text-zinc-500 border border-white/5">/</div>
                </div>

                <div class="h-6 w-px bg-white/[0.06] mx-1 hidden sm:block"></div>

                <button onclick="triggerImport()" class="p-2.5 rounded-xl text-zinc-500 hover:text-white hover:bg-white/5 transition-all" title="Import Data">
                    <i class="ph ph-download-simple text-xl"></i>
                </button>
                <input type="file" id="importFile" accept=".json" class="hidden" onchange="importLinks(event)">

                <button onclick="exportLinks()" class="p-2.5 rounded-xl text-zinc-500 hover:text-white hover:bg-white/5 transition-all" title="Export Data">
                    <i class="ph ph-upload-simple text-xl"></i>
                </button>

                <!-- Thicker, bolder add button -->
                <button onclick="openModal()" class="ml-2 px-5 py-2.5 bg-white text-black text-sm font-semibold rounded-2xl hover:bg-zinc-200 hover:scale-105 active:scale-95 transition-all flex items-center gap-2 shadow-[0_0_20px_rgba(255,255,255,0.15)]">
                    <i class="ph ph-plus text-lg"></i>
                    <span class="hidden sm:inline">Add Link</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Grid Area -->
    <main class="flex-1 w-full max-w-7xl mx-auto px-6 lg:px-12 py-12 z-10 flex flex-col">
        
        <p id="sub-title" 
            contenteditable="true" 
            spellcheck="false"
            class="text-zinc-500 text-base mb-10 max-w-2xl cursor-text animate-fade-in"
            onblur="saveHeaderData()"
            onkeydown="handleTextKeydown(event)"
            onclick="selectAllOnFocus(this)">
            Curate your essential tools, repositories, and daily drivers.
        </p>

        <!-- Adjusted to fewer columns for larger cards -->
        <div id="cards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8 pb-20 w-full flex-1">
            <!-- Cards Injected Here -->
        </div>
    </main>

    <!-- Modal -->
    <div id="modal-backdrop" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden opacity-0 transition-opacity duration-400" onclick="closeModal()"></div>
    
    <div id="modal-content" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-md bg-[#09090b] border border-white/5 rounded-[28px] shadow-[0_40px_100px_rgba(0,0,0,1)] z-50 hidden opacity-0 scale-95 transition-all duration-400 p-8 overflow-hidden">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-32 bg-white/[0.02] blur-3xl rounded-full pointer-events-none"></div>

        <div class="relative z-10">
            <h2 id="modal-title" class="text-2xl font-medium text-white mb-8 tracking-tight">New Link</h2>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-medium text-zinc-500 mb-2">Title</label>
                    <div class="cmd-input rounded-2xl p-1">
                        <input type="text" id="input-name" class="w-full bg-transparent px-4 py-3 text-white placeholder-zinc-700 outline-none text-base" placeholder="e.g. GitHub">
                    </div>
                </div>
                
                <div>
                    <label class="block text-xs font-medium text-zinc-500 mb-2">URL</label>
                    <div class="cmd-input rounded-2xl p-1">
                        <input type="url" id="input-url" class="w-full bg-transparent px-4 py-3 text-white placeholder-zinc-700 outline-none text-base" placeholder="https://...">
                    </div>
                </div>
            </div>

            <div class="flex gap-3 mt-10">
                <button onclick="closeModal()" class="flex-1 px-5 py-3.5 rounded-2xl text-zinc-400 hover:text-white hover:bg-white/5 transition-colors text-sm font-medium">Cancel</button>
                <button onclick="saveLink()" class="flex-1 px-5 py-3.5 rounded-2xl bg-white text-black font-semibold hover:bg-zinc-200 transition-colors text-sm shadow-[0_0_20px_rgba(255,255,255,0.1)]">Save Link</button>
            </div>
        </div>
    </div>

    <!-- Refined Empty State -->
    <template id="empty-state">
        <div class="col-span-full flex flex-col items-center justify-center py-20 lg:py-40 text-center opacity-0 animate-fade-in h-full">
            <div class="relative w-24 h-24 mb-8">
                <!-- Glowing rings -->
                <div class="absolute inset-0 border border-white/[0.03] rounded-full animate-[ping_3s_cubic-bezier(0,0,0.2,1)_infinite]"></div>
                <div class="absolute inset-2 border border-white/[0.05] rounded-full animate-[ping_3s_cubic-bezier(0,0,0.2,1)_infinite] animation-delay-200"></div>
                <!-- Core icon -->
                <div class="absolute inset-4 rounded-full bg-white/[0.02] border border-white/[0.08] flex items-center justify-center shadow-[inset_0_2px_4px_rgba(255,255,255,0.02)] backdrop-blur-xl z-10">
                    <i class="ph ph-infinity text-3xl text-zinc-400"></i>
                </div>
            </div>
            <h3 class="text-2xl font-medium text-zinc-100 mb-2 tracking-tight">Your space is empty</h3>
            <p class="text-zinc-500 text-base max-w-sm mb-8 leading-relaxed">Begin by curating your essential resources. Hit <kbd class="px-2 py-1 bg-white/[0.03] border border-white/[0.05] rounded-md text-xs font-mono ml-1 shadow-sm">Add Link</kbd> to build your environment.</p>
            <button onclick="openModal()" class="px-6 py-3 bg-white/[0.03] border border-white/[0.08] text-white text-sm font-medium rounded-2xl hover:bg-white/[0.08] transition-all flex items-center gap-2">
                <i class="ph ph-plus"></i> Add First Link
            </button>
        </div>
    </template>

    <script>
        // --- State Management ---
        // Changed to start completely empty (0 pre-saved links)
        let links = JSON.parse(localStorage.getItem('premiumLinks')) || [];
        
        let workspaceTitle = localStorage.getItem('p_workspaceTitle') || 'Workspace';
        let workspaceSubtitle = localStorage.getItem('p_workspaceSubtitle') || 'Curate your essential tools, repositories, and daily drivers.';
        let editingId = null; 

        const grid = document.getElementById('cards-grid');
        const searchInput = document.getElementById('search-input');

        // --- AM/PM Live Clock ---
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            const dateStr = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            document.getElementById('live-time').innerText = `${timeStr} — ${dateStr}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function getDomain(url) {
            try { return new URL(url).hostname.replace('www.', ''); } 
            catch { return url; }
        }

        function getFavicon(url) {
            try {
                const domain = new URL(url).hostname;
                return `https://icon.horse/icon/${domain}`; 
            } catch {
                return 'https://www.google.com/s2/favicons?domain=google.com&sz=128';
            }
        }

        // --- Mouse Tracking (Only updates vars, CSS :hover controls visibility) ---
        grid.addEventListener('mousemove', e => {
            const cards = document.querySelectorAll('.premium-card');
            for(const card of cards) {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            }
        });

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== searchInput && !document.activeElement.isContentEditable && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                searchInput.focus();
            }
        });

        // --- Header Editing ---
        function initHeader() {
            document.getElementById('main-title').innerText = workspaceTitle;
            document.getElementById('sub-title').innerText = workspaceSubtitle;
            document.getElementById('tab-title').innerText = workspaceTitle;
        }

        function saveHeaderData() {
            workspaceTitle = document.getElementById('main-title').innerText.trim() || 'Workspace';
            workspaceSubtitle = document.getElementById('sub-title').innerText.trim() || 'Curate your essential tools.';
            
            document.getElementById('main-title').innerText = workspaceTitle;
            document.getElementById('sub-title').innerText = workspaceSubtitle;
            document.getElementById('tab-title').innerText = workspaceTitle;

            localStorage.setItem('p_workspaceTitle', workspaceTitle);
            localStorage.setItem('p_workspaceSubtitle', workspaceSubtitle);
        }

        function handleTextKeydown(e) {
            if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
        }

        function selectAllOnFocus(element) {
            setTimeout(() => {
                const range = document.createRange();
                range.selectNodeContents(element);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
            }, 10);
        }

        // --- Rendering Engine ---
        function render(filteredLinks = links) {
            grid.innerHTML = '';

            if (filteredLinks.length === 0) {
                grid.appendChild(document.getElementById('empty-state').content.cloneNode(true));
                grid.classList.remove('grid', 'grid-cols-1', 'md:grid-cols-2', 'lg:grid-cols-3');
                grid.classList.add('flex', 'items-center', 'justify-center');
                return;
            } else {
                grid.classList.add('grid', 'grid-cols-1', 'md:grid-cols-2', 'lg:grid-cols-3');
                grid.classList.remove('flex', 'items-center', 'justify-center');
            }

            filteredLinks.forEach((link, index) => {
                const realIndex = links.findIndex(l => l.id === link.id);
                
                const card = document.createElement('div');
                card.className = `premium-card opacity-0 animate-stagger-up group cursor-pointer`;
                card.style.animationDelay = `${index * 50}ms`;
                card.setAttribute('data-id', link.id);
                
                // Larger cards: p-6 instead of p-5, bigger icons, bigger text
                card.innerHTML = `
                    <div class="premium-card-inner p-6 flex flex-col relative min-h-[160px]">
                        
                        <!-- Top actions -->
                        <div class="absolute top-5 right-5 flex items-center gap-1.5 opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-20">
                            <button onclick="openModal(event, ${realIndex})" class="p-2 text-zinc-500 hover:text-white rounded-xl hover:bg-white/10 transition-all backdrop-blur-md" title="Edit">
                                <i class="ph ph-pencil-simple text-base"></i>
                            </button>
                            <button onclick="deleteLink(event, ${realIndex})" class="p-2 text-zinc-500 hover:text-rose-400 rounded-xl hover:bg-rose-400/10 transition-all backdrop-blur-md" title="Delete">
                                <i class="ph ph-trash text-base"></i>
                            </button>
                        </div>

                        <!-- Big Icon -->
                        <div class="w-14 h-14 rounded-2xl bg-white/[0.03] border border-white/[0.06] shadow-[inset_0_2px_4px_rgba(255,255,255,0.02)] flex items-center justify-center overflow-hidden shrink-0 group-hover:scale-[1.05] group-hover:bg-white/[0.05] transition-all duration-400 relative z-10">
                            <img src="${getFavicon(link.url)}" class="w-7 h-7 object-contain drop-shadow-md" onerror="this.src='https://www.google.com/s2/favicons?domain=google.com&sz=128'">
                        </div>
                        
                        <!-- Text -->
                        <div class="mt-6 min-w-0 relative z-10 pointer-events-none pr-8">
                            <h3 class="text-lg font-semibold text-zinc-100 truncate tracking-tight">${link.name}</h3>
                            <p class="text-sm font-medium text-zinc-500 truncate mt-1 group-hover:text-zinc-400 transition-colors">${getDomain(link.url)}</p>
                        </div>
                        
                        <!-- Arrow -->
                        <div class="absolute bottom-6 right-6 text-zinc-600 opacity-0 -translate-x-3 translate-y-3 group-hover:opacity-100 group-hover:translate-x-0 group-hover:translate-y-0 transition-all duration-400 pointer-events-none z-10">
                            <i class="ph ph-arrow-up-right text-xl"></i>
                        </div>
                    </div>
                `;

                card.addEventListener('click', (e) => {
                    if (!e.target.closest('button')) window.open(link.url, '_blank');
                });

                grid.appendChild(card);
            });

            localStorage.setItem('premiumLinks', JSON.stringify(links));
        }

        // --- Search ---
        function filterLinks() {
            const query = searchInput.value.toLowerCase();
            render(links.filter(l => l.name.toLowerCase().includes(query) || l.url.toLowerCase().includes(query)));
        }

        // --- Modal Control ---
        const modalBackdrop = document.getElementById('modal-backdrop');
        const modalContent = document.getElementById('modal-content');
        const nameInput = document.getElementById('input-name');
        const urlInput = document.getElementById('input-url');

        function openModal(e = null, index = null) {
            if (e) e.stopPropagation();
            
            modalBackdrop.classList.remove('hidden');
            modalContent.classList.remove('hidden');
            void modalContent.offsetWidth; 
            
            modalBackdrop.classList.remove('opacity-0');
            modalContent.classList.remove('opacity-0', 'scale-95');

            if (index !== null) {
                editingId = index;
                document.getElementById('modal-title').innerText = "Edit Link";
                nameInput.value = links[index].name;
                urlInput.value = links[index].url;
            } else {
                editingId = null;
                document.getElementById('modal-title').innerText = "New Link";
                nameInput.value = '';
                urlInput.value = '';
            }
            setTimeout(() => nameInput.focus(), 100);
        }

        function closeModal() {
            modalBackdrop.classList.add('opacity-0');
            modalContent.classList.add('opacity-0', 'scale-95');
            setTimeout(() => {
                modalBackdrop.classList.add('hidden');
                modalContent.classList.add('hidden');
            }, 400);
        }

        function saveLink() {
            const name = nameInput.value.trim();
            let url = urlInput.value.trim();
            if (!name || !url) return;
            if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

            if (editingId !== null) {
                links[editingId] = { ...links[editingId], name, url };
            } else {
                links.push({ id: Date.now().toString(), name, url });
            }
            searchInput.value = ''; 
            render();
            closeModal();
        }

        document.getElementById('modal-content').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') saveLink();
            if (e.key === 'Escape') closeModal();
        });

        function deleteLink(event, index) {
            event.stopPropagation();
            links.splice(index, 1);
            filterLinks(); 
        }

        // --- Data Import/Export ---
        function exportLinks() {
            const exportData = { title: workspaceTitle, subtitle: workspaceSubtitle, links: links };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = `workspace_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        function triggerImport() { document.getElementById('importFile').click(); }

        function importLinks(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.links) {
                        links = imported.links.map((l, i) => ({...l, id: l.id || Date.now().toString() + i}));
                        if (imported.title) workspaceTitle = imported.title;
                        if (imported.subtitle) workspaceSubtitle = imported.subtitle;
                        initHeader();
                        saveHeaderData();
                    } else if (Array.isArray(imported)) {
                        links = imported.map((l, i) => ({...l, id: l.id || Date.now().toString() + i}));
                    }
                    searchInput.value = '';
                    render();
                } catch { alert("Invalid JSON file."); }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        // --- Init ---
        Sortable.create(grid, {
            animation: 400,
            easing: "cubic-bezier(0.16, 1, 0.3, 1)",
            ghostClass: 'sortable-ghost',
            dragClass: 'sortable-drag',
            delay: 150,
            delayOnTouchOnly: true,
            onEnd: function() {
                if(searchInput.value.trim() !== '') return; 
                
                const newOrder = [];
                grid.querySelectorAll('.premium-card').forEach(card => {
                    const id = card.getAttribute('data-id');
                    const link = links.find(l => l.id == id);
                    if(link) newOrder.push(link);
                });
                links = newOrder;
                localStorage.setItem('premiumLinks', JSON.stringify(links));
            }
        });

        initHeader();
        render();

    </script>
</body>
</html>
