<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f12;
    --surface: #13161b;
    --surface2: #1a1e25;
    --border: #252a34;
    --accent: #c8a96e;
    --accent2: #7eb8a4;
    --text: #e8e2d5;
    --text-muted: #5a6070;
    --text-dim: #8a8f9a;
    --red: #e07070;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    opacity: 0.6;
  }

  header {
    padding: 1.1rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 1.2rem;
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: -0.02em;
  }

  header span {
    font-size: 0.65rem;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  /* RESIZABLE LAYOUT */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .panel-left {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
    width: 46%;
    min-width: 280px;
    max-width: 75%;
  }

  .panel-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--surface);
    min-width: 240px;
  }

  .resizer {
    width: 5px;
    background: var(--border);
    cursor: col-resize;
    flex-shrink: 0;
    transition: background 0.15s;
    z-index: 10;
  }

  .resizer:hover, .resizer.dragging { background: var(--accent2); }

  /* PANEL HEADER */
  .panel-header {
    padding: 0.8rem 1.2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    background: var(--surface);
    flex-shrink: 0;
  }

  .panel-title {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .tab-row { display: flex; gap: 0.2rem; }

  .tab-btn {
    background: none;
    border: 1px solid transparent;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    padding: 0.28rem 0.65rem;
    cursor: pointer;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-radius: 3px;
    transition: all 0.2s;
  }

  .tab-btn.active { background: var(--surface2); border-color: var(--border); color: var(--accent); }
  .tab-btn:hover:not(.active) { color: var(--text-dim); border-color: var(--border); }

  /* VIEWS */
  .view { display: none; flex-direction: column; flex: 1; overflow: hidden; }
  .view.active { display: flex; }

  /* SESSIONS LIST */
  .sessions-list {
    flex: 1;
    overflow-y: auto;
    padding: 0.8rem 0.9rem;
  }

  .sessions-list::-webkit-scrollbar { width: 3px; }
  .sessions-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ── SESSION CARD (new design) ── */
  .session-card {
    display: flex;
    align-items: center;
    gap: 0;
    margin-bottom: 0.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.18s, box-shadow 0.18s;
    animation: slideIn 0.16s ease;
    position: relative;
  }

  .session-card:hover { border-color: #303848; box-shadow: 0 2px 12px rgba(0,0,0,0.25); }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Date section */
  .sc-date-wrap {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0 1rem;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    position: relative;
    height: 100%;
  }

  .sc-date-icon {
    color: var(--text-muted);
    font-size: 0.8rem;
    flex-shrink: 0;
    pointer-events: none;
  }

  .sc-date {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.88rem;
    outline: none;
    cursor: pointer;
    width: 116px;
    padding: 1rem 0;
    letter-spacing: 0.02em;
  }

  /* Hide the native calendar picker icon */
  .sc-date::-webkit-calendar-picker-indicator {
    opacity: 0;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }

  .sc-date::-webkit-inner-spin-button,
  .sc-date::-webkit-clear-button { display: none; }

  .sc-date:focus { color: var(--text); }

  /* Subject section */
  .sc-subject {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.96rem;
    padding: 1rem 1.2rem;
    outline: none;
    min-width: 0;
  }

  .sc-subject::placeholder { color: var(--text-muted); opacity: 0.5; }

  .sc-subject:focus {
    background: rgba(200,169,110,0.03);
  }

  /* Time section (hr + min dual spinners) */
  .sc-time-wrap {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    padding: 0 1rem 0 0.75rem;
    border-left: 1px solid var(--border);
    flex-shrink: 0;
  }

  .sc-spinner-group {
    display: flex;
    align-items: center;
    gap: 0.2rem;
    position: relative;
  }

  .sc-spinner-group::after {
    content: '';
    position: absolute;
    inset: 4px 0;
    border-radius: 3px;
    background: transparent;
    transition: background 0.15s;
    pointer-events: none;
  }

  .sc-spinner-group:hover::after {
    background: rgba(200,169,110,0.07);
  }

  .sc-time-sep {
    font-size: 0.85rem;
    color: var(--text-muted);
    padding: 0 0.1rem;
    user-select: none;
  }

  .sc-hr-input, .sc-min-input {
    background: transparent;
    border: none;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.08rem;
    font-weight: 500;
    text-align: right;
    outline: none;
    padding: 1rem 0;
    cursor: ns-resize;
    user-select: none;
  }

  .sc-hr-input  { width: 38px; }
  .sc-min-input { width: 28px; }

  /* Remove native spinners */
  .sc-hr-input::-webkit-inner-spin-button,
  .sc-hr-input::-webkit-outer-spin-button,
  .sc-min-input::-webkit-inner-spin-button,
  .sc-min-input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .sc-hr-input, .sc-min-input { -moz-appearance: textfield; }

  .sc-hr-input:focus, .sc-min-input:focus { color: var(--accent); }

  .sc-time-unit {
    font-size: 0.68rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    line-height: 1;
  }

  /* Scroll hint flash on the card */
  .session-card.scroll-flash { border-color: rgba(200,169,110,0.35); }

  /* Delete button */
  .del-btn {
    background: none;
    border: none;
    border-left: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    padding: 0 0.85rem;
    align-self: stretch;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    opacity: 0;
    flex-shrink: 0;
  }

  .session-card:hover .del-btn { opacity: 1; }
  .del-btn:hover { color: var(--red); background: rgba(224,112,112,0.06); border-left-color: rgba(224,112,112,0.2); }

  .add-session-btn {
    margin: 0.2rem 0.7rem 0.7rem;
    background: none;
    border: 1px dashed var(--border);
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    padding: 0.5rem;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: all 0.2s;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
  }

  .add-session-btn:hover { border-color: var(--accent2); color: var(--accent2); background: rgba(126,184,164,0.04); }

  /* JSON VIEW */
  #json-view { flex: 1; overflow: hidden; display: none; flex-direction: column; }
  #json-view.active { display: flex; }

  #json-editor {
    flex: 1;
    background: var(--surface);
    border: none;
    color: #a8d0c0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.74rem;
    line-height: 1.75;
    padding: 1.1rem 1.3rem;
    resize: none;
    outline: none;
    overflow-y: auto;
  }

  .json-actions {
    padding: 0.65rem 0.9rem;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 0.4rem;
    background: var(--surface);
    flex-shrink: 0;
  }

  .error-msg {
    margin: 0.4rem 0.8rem;
    padding: 0.45rem 0.7rem;
    background: rgba(224,112,112,0.08);
    border: 1px solid rgba(224,112,112,0.25);
    border-radius: 4px;
    font-size: 0.65rem;
    color: var(--red);
    display: none;
    flex-shrink: 0;
  }

  /* IMPORT VIEW */
  #import-view {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: stretch;
    padding: 1.2rem;
    gap: 0.85rem;
    overflow-y: auto;
    justify-content: center;
  }

  #import-view.active { display: flex; }

  .import-zone {
    border: 1px dashed var(--accent);
    border-radius: 10px;
    padding: 2.2rem 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: rgba(200,169,110,0.03);
    flex-shrink: 0;
  }

  .import-zone:hover, .import-zone.drag-over {
    border-color: var(--accent2);
    background: rgba(126,184,164,0.06);
  }

  .import-zone .iz-icon { font-size: 2rem; margin-bottom: 0.7rem; }

  .import-zone .iz-primary {
    font-size: 0.8rem;
    color: var(--text);
    margin-bottom: 0.3rem;
    font-weight: 500;
  }

  .import-zone .iz-sub {
    font-size: 0.62rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  .import-divider {
    text-align: center;
    font-size: 0.58rem;
    color: var(--text-muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    position: relative;
    flex-shrink: 0;
  }

  .import-divider::before, .import-divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: calc(50% - 28px);
    height: 1px;
    background: var(--border);
  }

  .import-divider::before { left: 0; }
  .import-divider::after  { right: 0; }

  .paste-zone {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .paste-zone textarea {
    background: transparent;
    border: none;
    color: #a8d0c0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    line-height: 1.7;
    padding: 0.9rem 1rem;
    resize: none;
    outline: none;
    height: 100px;
  }

  .paste-zone textarea::placeholder { color: var(--text-muted); opacity: 0.6; }

  .paste-footer {
    padding: 0.5rem 0.8rem;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
  }

  #file-input { display: none; }

  /* BUTTONS */
  .btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    padding: 0.38rem 0.85rem;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }

  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .btn.primary:hover { background: rgba(200,169,110,0.08); }
  .btn.green { border-color: var(--accent2); color: var(--accent2); }
  .btn.green:hover { background: rgba(126,184,164,0.08); }

  /* Reactive copy */
  #copy-btn { transition: all 0.2s; }
  #copy-btn.copied {
    border-color: var(--accent2) !important;
    color: var(--accent2) !important;
    background: rgba(126,184,164,0.1) !important;
    pointer-events: none;
  }

  /* OUTPUT PANEL */
  .output-header {
    padding: 0.8rem 1.2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .output-meta { display: flex; gap: 1.1rem; align-items: center; }
  .stat { font-size: 0.62rem; color: var(--text-muted); letter-spacing: 0.08em; }
  .stat span { color: var(--accent); font-weight: 500; }

  .output-area {
    flex: 1;
    overflow-y: auto;
    padding: 1.3rem;
  }

  .output-area::-webkit-scrollbar { width: 3px; }
  .output-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .output-block { margin-bottom: 1.8rem; }

  .out-month {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 0.9rem;
    padding-bottom: 0.45rem;
    border-bottom: 1px solid var(--border);
  }

  .out-date {
    font-size: 0.9rem;
    color: var(--text-dim);
    margin-bottom: 0.3rem;
    margin-top: 0.9rem;
    font-weight: 500;
  }

  .out-session { font-size: 0.88rem; padding: 0.15rem 0 0.15rem 0.5rem; }
  .out-session .subj { color: var(--accent2); }
  .out-session .arr  { color: var(--text-muted); margin: 0 0.3rem; }

  .raw-output {
    flex: 1;
    background: var(--bg);
    border: none;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.95rem;
    line-height: 2;
    padding: 1.3rem;
    resize: none;
    outline: none;
    display: none;
  }

  /* EMPTY STATE */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 0.5rem;
    color: var(--text-muted);
    text-align: center;
    padding: 2rem;
  }

  .empty-state .icon { font-size: 2rem; opacity: 0.35; }
  .empty-state .label { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; }
  .empty-state .sub   { font-size: 0.6rem; opacity: 0.55; letter-spacing: 0.04em; }

  .out-tabs { display: flex; gap: 0.2rem; }
</style>
</head>
<body>

<header>
  <h1>Study Journal</h1>
  <span>obsidian export tool</span>
</header>

<div class="layout">

  <!-- LEFT PANEL -->
  <div class="panel-left" id="panel-left">
    <div class="panel-header">
      <span class="panel-title">Input</span>
      <div class="tab-row">
        <button class="tab-btn" onclick="switchLeft('sessions',this)">Sessions</button>
        <button class="tab-btn" onclick="switchLeft('json',this)">JSON</button>
        <button class="tab-btn active" onclick="switchLeft('import',this)">Import</button>
      </div>
    </div>

    <!-- Sessions -->
    <div id="sessions-view" class="view">
      <div class="sessions-list" id="sessions-list"></div>
      <button class="add-session-btn" onclick="addSession()">+ add session</button>
    </div>

    <!-- JSON editor -->
    <div id="json-view">
      <textarea id="json-editor" spellcheck="false" oninput="onJsonEdit()"></textarea>
      <div id="json-error" class="error-msg"></div>
      <div class="json-actions">
        <button class="btn primary" onclick="applyJson()">Apply JSON</button>
        <button class="btn" onclick="syncJsonFromSessions()">Sync from sessions</button>
      </div>
    </div>

    <!-- Import -->
    <div id="import-view" class="view active">
      <div class="import-zone" id="drop-zone"
           onclick="document.getElementById('file-input').click()"
           ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
        <div class="iz-icon">📂</div>
        <div class="iz-primary">Drop your tracker .json here</div>
        <div class="iz-sub">or click to browse files</div>
      </div>

      <div class="import-divider">or paste json</div>

      <div class="paste-zone">
        <textarea id="paste-input" placeholder='{ "sessions": [...], "goal": 120 }' spellcheck="false"></textarea>
        <div class="paste-footer">
          <button class="btn primary" onclick="applyPaste()">Load JSON</button>
        </div>
      </div>

      <input type="file" id="file-input" accept=".json" onchange="loadFile(event)">
    </div>
  </div>

  <!-- RESIZER -->
  <div class="resizer" id="resizer"></div>

  <!-- RIGHT PANEL -->
  <div class="panel-right">
    <div class="output-header">
      <span class="panel-title">Markdown Output</span>
      <div style="display:flex;align-items:center;gap:0.9rem;">
        <div class="output-meta">
          <div class="stat">Sessions <span id="stat-sessions">0</span></div>
          <div class="stat">Total <span id="stat-total">—</span></div>
        </div>
        <div class="out-tabs">
          <button class="tab-btn active" id="out-tab-pretty" onclick="switchOutput('pretty')">Preview</button>
          <button class="tab-btn" id="out-tab-raw" onclick="switchOutput('raw')">Raw</button>
        </div>
        <button class="btn green" id="copy-btn" onclick="copyOutput()">
          <svg id="copy-icon" width="12" height="12" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="5" width="9" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-7A1.5 1.5 0 0 0 1 3.5v7A1.5 1.5 0 0 0 2.5 12H4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span id="copy-label">Copy</span>
        </button>
      </div>
    </div>

    <div class="output-area" id="output-pretty"></div>
    <textarea class="raw-output" id="output-raw" readonly spellcheck="false"></textarea>
  </div>
</div>

<script>
  let state = { sessions: [], goal: 120 };
  let outputMode = 'pretty';
  let leftMode = 'import';

  // ── TABS ─────────────────────────────────────────────────
  function switchLeft(tab, btn) {
    leftMode = tab;
    document.querySelectorAll('.panel-left .tab-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');

    document.getElementById('sessions-view').classList.remove('active');
    const jv = document.getElementById('json-view');
    jv.style.display = 'none';
    jv.classList.remove('active');
    document.getElementById('import-view').classList.remove('active');

    if (tab === 'sessions') {
      document.getElementById('sessions-view').classList.add('active');
    } else if (tab === 'json') {
      jv.style.display = 'flex';
      jv.classList.add('active');
      syncJsonFromSessions();
    } else {
      document.getElementById('import-view').classList.add('active');
    }
  }

  function switchOutput(mode) {
    outputMode = mode;
    document.getElementById('out-tab-pretty').classList.toggle('active', mode === 'pretty');
    document.getElementById('out-tab-raw').classList.toggle('active', mode === 'raw');
    document.getElementById('output-pretty').style.display = mode === 'pretty' ? 'block' : 'none';
    document.getElementById('output-raw').style.display    = mode === 'raw'    ? 'block' : 'none';
  }

  // ── TIME FORMAT ──────────────────────────────────────────
  function fmtMins(mins) {
    if (mins < 60) return `${mins} m`;
    const h = Math.floor(mins / 60), m = mins % 60;
    return m === 0 ? `${h} h` : `${h} h ${m} m`;
  }

  // ── RENDER SESSIONS ──────────────────────────────────────
  function renderSessions() {
    const list = document.getElementById('sessions-list');
    if (!state.sessions.length) {
      list.innerHTML = `<div class="empty-state">
        <div class="icon">📂</div>
        <div class="label">No sessions yet</div>
        <div class="sub">Switch to Import tab to load your tracker JSON</div>
      </div>`;
      return;
    }
    list.innerHTML = state.sessions
      .sort((a,b) => new Date(b.date) - new Date(a.date))
      .map(s => `
        <div class="session-card">
          <div class="sc-date-wrap">
            <svg class="sc-date-icon" width="11" height="11" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="1.5" y="3" width="13" height="11.5" rx="2" stroke="currentColor" stroke-width="1.4"/>
              <path d="M5 1.5V4M11 1.5V4M1.5 7H14.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <input type="date" class="sc-date" value="${s.date}" onchange="updateSession(${s.id},'date',this.value)">
          </div>
          <input type="text" class="sc-subject" value="${esc(s.subject)}" placeholder="Subject" onchange="updateSession(${s.id},'subject',this.value)">
          <div class="sc-time-wrap">
            <div class="sc-spinner-group">
              <input type="number" class="sc-hr-input" id="hr-${s.id}" value="${Math.floor(s.mins/60)}" min="0" max="99"
                onchange="commitTime(${s.id})"
                onwheel="scrollTime(event,${s.id},'hr')"
                onfocus="this.select()">
              <span class="sc-time-unit">hr</span>
            </div>
            <span class="sc-time-sep">:</span>
            <div class="sc-spinner-group">
              <input type="number" class="sc-min-input" id="min-${s.id}" value="${String(s.mins%60).padStart(2,'0')}" min="0" max="59"
                onchange="commitTime(${s.id})"
                onwheel="scrollTime(event,${s.id},'min')"
                onfocus="this.select()">
              <span class="sc-time-unit">min</span>
            </div>
          </div>
          <button class="del-btn" onclick="deleteSession(${s.id})" title="Delete">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9 3h6M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M10 11v5M14 11v5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </div>`).join('');
    renderOutput();
    updateStats();
  }

  function esc(t) {
    return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── TIME SPINNER HELPERS ────────────────────────────────
  function scrollTime(e, id, field) {
    e.preventDefault();
    const hrEl  = document.getElementById('hr-'  + id);
    const minEl = document.getElementById('min-' + id);
    if (!hrEl || !minEl) return;

    const delta = e.deltaY < 0 ? 1 : -1;   // scroll up = increase

    if (field === 'hr') {
      let v = Math.max(0, Math.min(99, (+hrEl.value || 0) + delta));
      hrEl.value = v;
    } else {
      let v = (+minEl.value || 0) + delta;
      if (v > 59) {
        v = 0;
        hrEl.value = Math.min(99, (+hrEl.value || 0) + 1);
      } else if (v < 0) {
        v = 59;
        hrEl.value = Math.max(0, (+hrEl.value || 0) - 1);
      }
      minEl.value = String(v).padStart(2, '0');
    }
    commitTime(id);

    // brief flash on card
    const card = hrEl.closest('.session-card');
    if (card) {
      card.classList.add('scroll-flash');
      clearTimeout(card._flashTimer);
      card._flashTimer = setTimeout(() => card.classList.remove('scroll-flash'), 300);
    }
  }

  function commitTime(id) {
    const hrEl  = document.getElementById('hr-'  + id);
    const minEl = document.getElementById('min-' + id);
    if (!hrEl || !minEl) return;
    const totalMins = Math.max(1, (+hrEl.value || 0) * 60 + (+minEl.value || 0));
    updateSession(id, 'mins', totalMins);
    // keep display in sync (pad minutes)
    minEl.value = String(totalMins % 60).padStart(2, '0');
    hrEl.value  = Math.floor(totalMins / 60);
  }

  
  function addSession() {
    const today = new Date().toISOString().split('T')[0];
    state.sessions.push({ id: Date.now(), date: today, subject: 'Subject', mins: 60, note: '' });
    renderSessions();
  }

  function updateSession(id, field, value) {
    const s = state.sessions.find(s => s.id === id);
    if (s) s[field] = value;
    renderOutput();
    updateStats();
    if (leftMode === 'json') syncJsonFromSessions();
  }

  function deleteSession(id) {
    state.sessions = state.sessions.filter(s => s.id !== id);
    renderSessions();
  }

  // ── GENERATE MARKDOWN ────────────────────────────────────
  function generateMarkdown() {
    if (!state.sessions.length) return '';
    const byMonth = {};
    for (const s of state.sessions) {
      const d  = new Date(s.date + 'T00:00:00');
      const mk = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      if (!byMonth[mk]) byMonth[mk] = {};
      if (!byMonth[mk][s.date]) byMonth[mk][s.date] = {};
      byMonth[mk][s.date][s.subject] = (byMonth[mk][s.date][s.subject] || 0) + s.mins;
    }
    const lines = [];
    for (const mk of Object.keys(byMonth).sort((a,b) => b.localeCompare(a))) {
      const [yr, mo] = mk.split('-');
      const name = new Date(+yr,+mo-1,1).toLocaleString('en-US',{month:'long'});
      lines.push(`## ${name} ${yr}`, '');
      for (const date of Object.keys(byMonth[mk]).sort()) {
        const [y,m,dd] = date.split('-');
        lines.push(`${dd}/${m}/${y}`);
        for (const [subj, mins] of Object.entries(byMonth[mk][date]))
          lines.push(`- ${subj} ⟶ ${fmtMins(mins)}`);
        lines.push('');
      }
    }
    return lines.join('\n').trim();
  }

  // ── RENDER OUTPUT ────────────────────────────────────────
  function renderOutput() {
    const md = generateMarkdown();
    document.getElementById('output-raw').value = md;
    const pretty = document.getElementById('output-pretty');

    if (!md) {
      pretty.innerHTML = `<div class="empty-state">
        <div class="icon">✦</div>
        <div class="label">Import your tracker .json</div>
        <div class="sub">Your Obsidian markdown will appear here</div>
      </div>`;
      return;
    }

    const byMonth = {};
    for (const s of state.sessions) {
      const d  = new Date(s.date + 'T00:00:00');
      const mk = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      if (!byMonth[mk]) byMonth[mk] = {};
      if (!byMonth[mk][s.date]) byMonth[mk][s.date] = {};
      byMonth[mk][s.date][s.subject] = (byMonth[mk][s.date][s.subject] || 0) + s.mins;
    }

    let html = '';
    for (const mk of Object.keys(byMonth).sort((a,b) => b.localeCompare(a))) {
      const [yr, mo] = mk.split('-');
      const name = new Date(+yr,+mo-1,1).toLocaleString('en-US',{month:'long'});
      html += `<div class="output-block"><div class="out-month">## ${name} ${yr}</div>`;
      for (const date of Object.keys(byMonth[mk]).sort()) {
        const [y,m,dd] = date.split('-');
        html += `<div class="out-date">${dd}/${m}/${y}</div>`;
        for (const [subj,mins] of Object.entries(byMonth[mk][date]))
          html += `<div class="out-session"><span class="subj">${esc(subj)}</span><span class="arr"> ⟶ </span><span class="dur">${fmtMins(mins)}</span></div>`;
      }
      html += '</div>';
    }
    pretty.innerHTML = html;
  }

  // ── STATS ────────────────────────────────────────────────
  function updateStats() {
    const total = state.sessions.reduce((a,s) => a + s.mins, 0);
    document.getElementById('stat-sessions').textContent = state.sessions.length;
    document.getElementById('stat-total').textContent = state.sessions.length ? fmtMins(total) : '—';
  }

  // ── COPY (reactive) ──────────────────────────────────────
  let copyTimer = null;

  function copyOutput() {
    const md = generateMarkdown();
    if (!md) return;
    navigator.clipboard.writeText(md).then(() => {
      const btn   = document.getElementById('copy-btn');
      const label = document.getElementById('copy-label');
      const icon  = document.getElementById('copy-icon');

      btn.classList.add('copied');
      label.textContent = 'Copied!';
      icon.innerHTML = `<polyline points="2,9 6,13 14,3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;

      clearTimeout(copyTimer);
      copyTimer = setTimeout(() => {
        btn.classList.remove('copied');
        label.textContent = 'Copy';
        icon.innerHTML = `<rect x="5" y="5" width="9" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-7A1.5 1.5 0 0 0 1 3.5v7A1.5 1.5 0 0 0 2.5 12H4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>`;
      }, 2200);
    });
  }

  // ── JSON EDITOR ──────────────────────────────────────────
  function syncJsonFromSessions() {
    document.getElementById('json-editor').value =
      JSON.stringify({ sessions: state.sessions, goal: state.goal }, null, 2);
    document.getElementById('json-error').style.display = 'none';
  }

  function onJsonEdit() {
    try { JSON.parse(document.getElementById('json-editor').value);
          document.getElementById('json-error').style.display = 'none'; } catch(e) {}
  }

  function applyJson() {
    const err = document.getElementById('json-error');
    try { loadData(JSON.parse(document.getElementById('json-editor').value)); err.style.display='none'; }
    catch(e) { err.textContent = 'Invalid JSON: ' + e.message; err.style.display='block'; }
  }

  function applyPaste() {
    const raw = document.getElementById('paste-input').value.trim();
    if (!raw) return;
    try { loadData(JSON.parse(raw)); document.getElementById('paste-input').value = ''; }
    catch(e) { alert('Invalid JSON: ' + e.message); }
  }

  // ── LOAD DATA ────────────────────────────────────────────
  function loadData(data) {
    if (data.sessions && Array.isArray(data.sessions)) {
      state.sessions = data.sessions.map(s => ({
        ...s,
        id:      s.id || Date.now() + Math.random(),
        mins:    +s.mins || 0,
        subject: s.subject || 'Unknown',
        date:    s.date || new Date().toISOString().split('T')[0],
        note:    s.note || ''
      }));
    }
    if (data.goal) state.goal = data.goal;
    renderSessions();
    switchLeft('sessions', document.querySelector('.panel-left .tab-btn'));
  }

  // ── FILE IMPORT ──────────────────────────────────────────
  function loadFile(e) {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = ev => { try { loadData(JSON.parse(ev.target.result)); }
                       catch(err) { alert('Could not parse JSON: ' + err.message); } };
    r.readAsText(file);
    e.target.value = '';
  }

  function onDragOver(e) { e.preventDefault(); document.getElementById('drop-zone').classList.add('drag-over'); }
  function onDragLeave()  { document.getElementById('drop-zone').classList.remove('drag-over'); }

  function onDrop(e) {
    e.preventDefault();
    document.getElementById('drop-zone').classList.remove('drag-over');
    const file = e.dataTransfer.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = ev => { try { loadData(JSON.parse(ev.target.result)); }
                       catch(err) { alert('Invalid JSON: ' + err.message); } };
    r.readAsText(file);
  }

  // ── RESIZABLE PANELS ─────────────────────────────────────
  (function() {
    const resizer = document.getElementById('resizer');
    const panelL  = document.getElementById('panel-left');
    const layout  = document.querySelector('.layout');
    let dragging  = false, startX, startW;

    resizer.addEventListener('mousedown', e => {
      dragging = true; startX = e.clientX;
      startW   = panelL.getBoundingClientRect().width;
      resizer.classList.add('dragging');
      document.body.style.cursor     = 'col-resize';
      document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      const total = layout.getBoundingClientRect().width;
      const newW  = Math.min(Math.max(startW + e.clientX - startX, 280), total - 245);
      panelL.style.width = newW + 'px';
    });

    document.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      resizer.classList.remove('dragging');
      document.body.style.cursor = document.body.style.userSelect = '';
    });
  })();

  // ── INIT ─────────────────────────────────────────────────
  renderOutput();
  updateStats();
  document.getElementById('output-pretty').style.display = 'block';
  document.getElementById('output-raw').style.display    = 'none';
</script>
</body>
</html>
