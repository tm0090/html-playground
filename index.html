<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Tracker - Live</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body {
    font-family: 'Outfit', sans-serif;
    background-color: #020617; /* slate-950 */
    color: #cbd5e1; /* slate-300 */
    overflow-x: hidden;
  }
  
  /* Subtle film grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
  }

  .glass-header {
    background: rgba(2, 6, 23, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #475569; }

  /* Toast Animation */
  .toast-enter { transform: translate(-50%, 100px); opacity: 0; }
  .toast-active { transform: translate(-50%, 0); opacity: 1; }
</style>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          slate: { 850: '#151f32', 950: '#020617' }
        }
      }
    }
  }
</script>
</head>
<body class="min-h-screen selection:bg-amber-500/30 pb-24">

<!-- Header -->
<header class="glass-header sticky top-0 z-50 border-b border-slate-800 transition-all duration-300">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
    <div class="flex items-center gap-2 text-amber-500 font-bold text-xl tracking-wider">
      <i data-lucide="clapperboard" class="w-6 h-6"></i>
      <span>MOVIE<span class="text-slate-100 font-light ml-1">TRACKER BY TAMIM</span></span>
    </div>
    
    <div class="flex items-center gap-3">
      <button onclick="toggleView()" id="viewToggleBtn" class="hidden sm:flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-md border border-slate-700 bg-slate-800/50 text-slate-300 hover:text-white hover:border-slate-500 transition-colors">
        <i data-lucide="code" class="w-4 h-4"></i> Raw Editor
      </button>

      <div class="h-6 w-px bg-slate-800 mx-1"></div>

      <input type="file" id="fileInput" accept=".md,.txt" class="hidden" onchange="handleFileSelect(event)">
      <button onclick="document.getElementById('fileInput').click()" class="flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-md border border-slate-700 hover:border-amber-500/50 hover:bg-amber-500/10 text-slate-300 transition-colors">
        <i data-lucide="folder-open" class="w-4 h-4 text-amber-500"></i> <span class="hidden sm:inline">Import</span>
      </button>
      
      <button onclick="exportMarkdown()" id="exportBtn" style="display:none" class="flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-md bg-amber-500 text-slate-950 hover:bg-amber-400 transition-colors shadow-[0_0_15px_rgba(245,158,11,0.2)]">
        <i data-lucide="download" class="w-4 h-4"></i> <span class="hidden sm:inline">Export</span>
      </button>
    </div>
  </div>
</header>

<!-- Stats Bar -->
<div id="statsBar" style="display:none" class="bg-slate-900/50 border-b border-slate-800 p-4">
  <div class="max-w-6xl mx-auto flex flex-wrap items-center gap-6 sm:gap-12">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-emerald-500/10 rounded-lg text-emerald-400 border border-emerald-500/20">
        <i data-lucide="award" class="w-6 h-6"></i>
      </div>
      <div>
        <div id="statWatched" class="text-2xl font-bold text-emerald-400 leading-none">0</div>
        <div class="text-[10px] text-slate-500 uppercase tracking-wider font-bold mt-1">Watched</div>
      </div>
    </div>
    
    <div class="hidden sm:block w-px h-10 bg-slate-800"></div>
    
    <div class="flex items-center gap-3">
      <div class="p-2 bg-slate-800 rounded-lg text-slate-400 border border-slate-700">
        <i data-lucide="film" class="w-6 h-6"></i>
      </div>
      <div>
        <div id="statTotal" class="text-2xl font-bold text-slate-200 leading-none">0</div>
        <div class="text-[10px] text-slate-500 uppercase tracking-wider font-bold mt-1">Total Films</div>
      </div>
    </div>

    <div class="flex-1 min-w-[200px]">
      <div class="flex justify-between items-end mb-2">
        <div class="text-[10px] text-slate-500 uppercase tracking-wider font-bold">Completion</div>
        <div id="statPct" class="text-sm font-bold text-emerald-400">0%</div>
      </div>
      <div class="h-2 w-full bg-slate-800 rounded-full overflow-hidden">
        <div id="progressBar" class="h-full bg-gradient-to-r from-emerald-600 to-emerald-400 transition-all duration-700 ease-out" style="width: 0%"></div>
      </div>
    </div>
  </div>
</div>

<!-- Empty State -->
<main id="emptyState" class="max-w-3xl mx-auto px-4 py-24 flex flex-col items-center text-center">
  <div class="w-20 h-20 bg-slate-800/50 rounded-full flex items-center justify-center border border-slate-700 mb-6 text-slate-400">
    <i data-lucide="file-text" class="w-10 h-10"></i>
  </div>
  <h1 class="text-3xl font-bold text-white mb-4">Load your Watchlist</h1>
  <p class="text-slate-400 mb-8 max-w-md">Import your MCU markdown file once. It will be saved securely in your browser so you can track and edit it anytime without needing to reload the file.</p>
  <button onclick="document.getElementById('fileInput').click()" class="px-6 py-3 bg-amber-500 text-slate-950 font-semibold rounded-lg hover:bg-amber-400 transition-colors shadow-lg shadow-amber-500/20 flex items-center gap-2">
    <i data-lucide="folder-open" class="w-5 h-5"></i>
    Select .md File
  </button>
</main>

<!-- Main Visual Content -->
<main id="visualView" style="display:none" class="max-w-6xl mx-auto px-4 py-8"></main>

<!-- Raw Editor Content -->
<main id="editorView" style="display:none" class="max-w-6xl mx-auto px-4 py-8">
  <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex flex-col h-[70vh]">
    <div class="bg-slate-800/50 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
      <div class="flex items-center gap-2 text-sm font-medium text-slate-300">
        <i data-lucide="terminal" class="w-4 h-4"></i> Markdown Source
      </div>
      <span class="text-xs text-slate-500">Auto-saves as you type</span>
    </div>
    <textarea id="rawEditor" oninput="handleEditorInput()" class="flex-1 w-full bg-transparent p-6 text-slate-300 font-mono text-sm leading-relaxed focus:outline-none resize-none" spellcheck="false"></textarea>
  </div>
</main>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 left-1/2 toast-enter bg-slate-800 text-slate-200 px-6 py-3 rounded-full shadow-2xl border border-slate-700 font-medium transition-all duration-300 flex items-center gap-2 z-50 pointer-events-none">
  <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400" id="toastIcon"></i>
  <span id="toastMsg">Saved</span>
</div>

<script>
// --- Core Logic ---
const STORAGE_KEY = 'mcu_tracker_live_data';
let currentMarkdown = localStorage.getItem(STORAGE_KEY) || '';
let isEditorView = false;
const today = new Date();

// Initialize icons
lucide.createIcons();

// Boot sequence
if (currentMarkdown.trim().length > 0) {
  renderApp();
}

// --- Date Helpers ---
function fmtDate(d) { return d.toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' }); }
function todayStr() { return fmtDate(today); }

// --- File Handling ---
function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    currentMarkdown = e.target.result;
    saveAndRender();
    showToast("File Imported Successfully!", "check-circle", "text-emerald-400");
  };
  reader.readAsText(file);
}

function exportMarkdown() {
  if (!currentMarkdown) return;
  const blob = new Blob([currentMarkdown], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mcu-tracker.md';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("File Downloaded!", "download", "text-amber-500");
}

function saveAndRender() {
  localStorage.setItem(STORAGE_KEY, currentMarkdown);
  renderApp();
}

// --- Parsing ---
function extractYear(line) { const m = line.match(/\(([^)]+)\)/); return m ? m[1] : ''; }
function extractWatchDate(line) { const m = line.match(/✅\s*(.+)$/); return m ? m[1].trim() : null; }
function extractTitle(line) {
  const m = line.match(/^\s*-\s*\[[ xX]\]\s*(.+)/);
  if (!m) return null;
  let t = m[1].replace(/\s*—\s*✅.*$/, '').replace(/\s*\([^)]*\)\s*$/, '').trim();
  return t;
}

function isUpcoming(yearStr) {
  const m = yearStr.match(/(\d{4})/);
  if (!m) return false;
  const y = parseInt(m[1]);
  if (y > today.getFullYear()) return true;
  if (y === today.getFullYear()) {
    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const monthM = yearStr.match(/(January|February|March|April|May|June|July|August|September|October|November|December)/i);
    if (monthM) {
      const month = monthNames.findIndex(mn => mn.toLowerCase() === monthM[1].toLowerCase());
      return month > today.getMonth();
    }
  }
  return false;
}

// --- Interaction ---
function toggleWatch(title, watchedStr) {
  const isWatched = watchedStr === 'true';
  const lines = currentMarkdown.split('\n');
  const normalizedTitle = title.toLowerCase().replace(/[^a-z0-9]/g,'');

  for (let i = 0; i < lines.length; i++) {
    const titleInLine = extractTitle(lines[i]);
    if (!titleInLine || titleInLine.toLowerCase().replace(/[^a-z0-9]/g,'') !== normalizedTitle) continue;

    if (!isWatched) {
      // Mark Watched
      lines[i] = lines[i].replace(/^(\s*-\s*)\[ \]/, '$1[x]').replace(/\s*—\s*✅.*$/, '');
      if (!lines[i].includes('✅')) {
        lines[i] = lines[i].replace(/(\([^)]+\))\s*$/, `$1 — ✅ ${todayStr()}`);
        if (!lines[i].includes('✅')) lines[i] = lines[i].trimEnd() + ` — ✅ ${todayStr()}`;
      }
      showToast('Marked as watched', 'check-circle', 'text-emerald-400');
    } else {
      // Unwatch
      lines[i] = lines[i].replace(/^(\s*-\s*)\[x\]/i, '$1[ ]').replace(/\s*—\s*✅.*$/, '');
      showToast('Removed from watched', 'x-circle', 'text-slate-400');
    }
    break;
  }

  currentMarkdown = lines.join('\n');
  saveAndRender();
}

function handleEditorInput() {
  currentMarkdown = document.getElementById('rawEditor').value;
  localStorage.setItem(STORAGE_KEY, currentMarkdown);
}

// --- Views ---
function toggleView() {
  isEditorView = !isEditorView;
  const btn = document.getElementById('viewToggleBtn');
  if (isEditorView) {
    document.getElementById('visualView').style.display = 'none';
    document.getElementById('editorView').style.display = 'block';
    document.getElementById('rawEditor').value = currentMarkdown;
    btn.innerHTML = `<i data-lucide="layout-grid" class="w-4 h-4"></i> Visual View`;
    btn.classList.add('bg-amber-500/10', 'text-amber-500', 'border-amber-500/30');
    btn.classList.remove('bg-slate-800/50', 'text-slate-300', 'border-slate-700');
  } else {
    // Switching back to visual - re-parse what they typed!
    renderApp();
    document.getElementById('editorView').style.display = 'none';
    document.getElementById('visualView').style.display = 'block';
    btn.innerHTML = `<i data-lucide="code" class="w-4 h-4"></i> Raw Editor`;
    btn.classList.remove('bg-amber-500/10', 'text-amber-500', 'border-amber-500/30');
    btn.classList.add('bg-slate-800/50', 'text-slate-300', 'border-slate-700');
  }
  lucide.createIcons();
}

// --- Rendering ---
function renderApp() {
  if (!currentMarkdown.trim()) {
    document.getElementById('emptyState').style.display = 'flex';
    document.getElementById('visualView').style.display = 'none';
    document.getElementById('statsBar').style.display = 'none';
    document.getElementById('exportBtn').style.display = 'none';
    return;
  }

  document.getElementById('emptyState').style.display = 'none';
  if(!isEditorView) document.getElementById('visualView').style.display = 'block';
  document.getElementById('statsBar').style.display = 'block';
  document.getElementById('exportBtn').style.display = 'flex';
  
  const lines = currentMarkdown.split('\n');
  const sagas = [];
  let curSaga = null, curPhase = null;

  for (const line of lines) {
    const sagaM = line.match(/^###\s+(.+)/);
    if (sagaM && !line.match(/^####/)) {
      curSaga = { title: sagaM[1].replace(/\*+/g,'').trim(), phases: [] };
      sagas.push(curSaga); curPhase = null; continue;
    }
    const phaseM = line.match(/^#{2,4}\s+(.+)/);
    if (phaseM) {
      if (!curSaga) { curSaga = { title: '', phases: [] }; sagas.push(curSaga); }
      curPhase = { title: phaseM[1].replace(/\*+/g,'').trim(), movies: [] };
      curSaga.phases.push(curPhase); continue;
    }
    const movieM = line.match(/^\s*[-*]\s*\[([xX ])\]\s*(.+)/);
    if (movieM) {
      if (!curPhase) {
        if (!curSaga) { curSaga = { title:'', phases:[] }; sagas.push(curSaga); }
        curPhase = { title: '', movies: [] }; curSaga.phases.push(curPhase);
      }
      const checked = movieM[1].toLowerCase() === 'x';
      const rest = movieM[2];
      const title = rest.replace(/\s*—\s*✅.*$/, '').replace(/\s*\([^)]*\)\s*$/, '').trim();
      const yearStr = extractYear(rest) || '';
      curPhase.movies.push({ 
        title, yearStr, watched: checked, 
        watchDate: extractWatchDate(rest), 
        upcoming: !checked && isUpcoming(yearStr) 
      });
    }
  }

  let totalWatched = 0, totalMovies = 0;
  let html = '';

  for (const saga of sagas) {
    if (!saga.phases.length) continue;
    const allMovies = saga.phases.flatMap(p => p.movies);
    if (!allMovies.length) continue;
    
    html += `<div class="mb-12">`;
    if (saga.title) html += `<h2 class="text-xs font-bold text-slate-500 uppercase tracking-[0.2em] mb-6 border-b border-slate-800 pb-2">${saga.title}</h2>`;

    for (const phase of saga.phases) {
      if (!phase.movies.length) continue;
      const pw = phase.movies.filter(m => m.watched).length;
      const pt = phase.movies.filter(m => !m.upcoming).length; // Only count released for stats
      const rawPt = phase.movies.length;
      const pct = pt ? Math.round(pw/pt*100) : 0;
      totalWatched += pw; totalMovies += pt;

      html += `<div class="mb-10">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-xl font-bold text-slate-100 flex items-center gap-3">${phase.title || 'Films'}</h3>
          <div class="flex items-center gap-3 text-sm">
            <span class="text-slate-400 font-mono">${pw} / ${pt}</span>
            <div class="w-24 h-1.5 bg-slate-800 rounded-full overflow-hidden hidden sm:block">
              <div class="h-full bg-amber-500 transition-all duration-500" style="width:${pct}%"></div>
            </div>
          </div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">`;

      for (const movie of phase.movies) {
        const safeTitle = movie.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        
        let cardClass = movie.upcoming 
          ? 'bg-slate-900/20 border-slate-800/50 opacity-60 cursor-not-allowed'
          : movie.watched
            ? 'bg-emerald-950/20 border-emerald-500/30 shadow-[0_0_15px_rgba(16,185,129,0.05)] cursor-pointer hover:border-emerald-500/60 hover:-translate-y-1'
            : 'bg-slate-900 border-slate-800 cursor-pointer hover:border-amber-500/50 hover:bg-slate-800/80 hover:-translate-y-1 shadow-lg';
            
        let checkClass = movie.upcoming ? 'bg-slate-800/50 border border-slate-700/50' 
          : movie.watched ? 'bg-emerald-500 text-slate-950' 
          : 'border border-slate-600 bg-slate-800/50 group-hover:border-amber-500/50';

        let titleClass = movie.watched ? 'text-emerald-400' : 'text-slate-200';
        let clickAttr = movie.upcoming ? '' : `onclick="toggleWatch('${safeTitle}', '${movie.watched}')"`;

        html += `
        <div class="relative group p-4 rounded-xl border transition-all duration-200 select-none flex flex-col justify-between min-h-[140px] ${cardClass}" ${clickAttr}>
          <div class="flex justify-between items-start mb-3">
            <div class="w-6 h-6 rounded flex items-center justify-center transition-colors ${checkClass}">
              ${movie.watched ? '<i data-lucide="check" class="w-4 h-4 stroke-[3]"></i>' : ''}
            </div>
            ${movie.upcoming ? '<span class="text-[10px] uppercase tracking-wider font-bold text-slate-500 bg-slate-900 px-2 py-0.5 rounded border border-slate-800">Upcoming</span>' : ''}
          </div>
          <div>
            <h4 class="font-semibold leading-tight mb-1.5 ${titleClass}">${movie.title}</h4>
            <div class="flex flex-col gap-1">
              <div class="flex items-center gap-1.5 text-xs text-slate-500 font-medium">
                <i data-lucide="calendar" class="w-3 h-3"></i> ${movie.yearStr}
              </div>
              ${movie.watchDate ? `<div class="text-[10px] text-emerald-500/80 font-medium mt-1">Watched ${movie.watchDate}</div>` : ''}
            </div>
          </div>
        </div>`;
      }
      html += `</div></div>`;
    }
    html += `</div>`;
  }

  document.getElementById('visualView').innerHTML = html;
  
  // Update Stats
  document.getElementById('statWatched').textContent = totalWatched;
  document.getElementById('statTotal').textContent = totalMovies;
  const totalPct = totalMovies ? Math.round(totalWatched/totalMovies*100) : 0;
  document.getElementById('statPct').textContent = totalPct + '%';
  document.getElementById('progressBar').style.width = totalPct + '%';

  lucide.createIcons();
}

// --- Toast ---
let toastTimer;
function showToast(msg, iconName, iconColorClass) {
  const el = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  
  const iconEl = document.getElementById('toastIcon');
  iconEl.setAttribute('data-lucide', iconName);
  iconEl.className = `w-4 h-4 ${iconColorClass}`;
  lucide.createIcons();

  el.classList.remove('toast-enter');
  el.classList.add('toast-active');
  
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove('toast-active');
    el.classList.add('toast-enter');
  }, 2500);
}

</script>
</body>
</html>
