<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="tab-title">Saved links</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { surface: '#09090b', surfaceHover: '#121214' },
                    animation: {
                        'fade-in': 'fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'slide-down': 'slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'stagger-up': 'staggerUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-slow': 'pulseSlow 4s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideDown: { '0%': { transform: 'translateY(-20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                        staggerUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                        pulseSlow: { '0%, 100%': { opacity: '0.4' }, '50%': { opacity: '0.8' } }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #000000;
            color: #ededed;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            letter-spacing: -0.015em;
            overscroll-behavior-y: none;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
        ::selection { background: rgba(255,255,255,0.15); color: #fff; }

        /* ── Premium Card ── */
        .premium-card {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 1px;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
        }
        @media (min-width: 640px) { .premium-card { border-radius: 24px; } }
        @media (hover: hover) {
            .premium-card:hover { transform: translateY(-4px) scale(1.01); z-index: 10; }
        }
        .premium-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(600px circle at var(--mouse-x) var(--mouse-y), rgba(255,255,255,0.4), transparent 40%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
        }
        .premium-card:hover::before { opacity: 1; }

        /* Folder card: amber shimmer on hover border */
        .folder-card::before {
            background: radial-gradient(600px circle at var(--mouse-x) var(--mouse-y), rgba(251,191,36,0.25), transparent 40%);
        }

        .premium-card-inner {
            background: #09090b;
            border-radius: 19px;
            position: relative;
            height: 100%;
            z-index: 1;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.04);
            transition: background 0.4s ease, transform 0.3s ease;
        }
        @media (min-width: 640px) { .premium-card-inner { border-radius: 23px; } }
        .premium-card:hover .premium-card-inner { background: #111113; }
        .premium-card-inner::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(400px circle at var(--mouse-x) var(--mouse-y), rgba(255,255,255,0.04), transparent 40%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 2;
        }
        .premium-card:hover .premium-card-inner::before { opacity: 1; }

        /* Folder inner: subtle amber tint glow */
        .folder-card .premium-card-inner::before {
            background: radial-gradient(400px circle at var(--mouse-x) var(--mouse-y), rgba(251,191,36,0.04), transparent 40%);
        }

        /* ── Folder Drop Target Glow ── */
        .folder-drop-active {
            transform: scale(1.03) translateY(-4px) !important;
            box-shadow: 0 0 0 2px rgba(251,191,36,0.55), 0 0 40px rgba(251,191,36,0.2), 0 20px 60px rgba(0,0,0,0.6) !important;
            z-index: 20 !important;
        }
        .folder-drop-active::before {
            opacity: 1 !important;
            background: radial-gradient(300px circle at 50% 50%, rgba(251,191,36,0.55), transparent 60%) !important;
        }
        .folder-drop-active .premium-card-inner {
            background: #111108 !important;
        }
        .folder-drop-active .premium-card-inner::before {
            opacity: 1 !important;
            background: radial-gradient(300px circle at 50% 50%, rgba(251,191,36,0.07), transparent 60%) !important;
        }

        /* ── Sortable ── */
        .sortable-ghost { opacity: 0.05; transform: scale(0.95); }
        .sortable-drag { cursor: grabbing !important; box-shadow: 0 40px 80px rgba(0,0,0,0.9); }

        /* ── Remove from folder zone ── */
        #folder-remove-zone {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 200;
            padding: 1.25rem 1.5rem calc(1.5rem + env(safe-area-inset-bottom));
            background: linear-gradient(to top, rgba(0,0,0,0.97) 70%, transparent);
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
            pointer-events: none;
        }
        #folder-remove-zone.visible {
            transform: translateY(0);
            pointer-events: auto;
        }
        #folder-remove-zone-inner {
            border: 1.5px dashed rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 1.1rem 1.5rem;
            text-align: center;
            color: rgba(255,255,255,0.35);
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
            background: rgba(0,0,0,0.4);
        }
        #folder-remove-zone.active #folder-remove-zone-inner {
            border-color: rgba(239,68,68,0.65);
            background: rgba(239,68,68,0.08);
            color: rgba(239,68,68,0.95);
            box-shadow: 0 0 20px rgba(239,68,68,0.1);
        }

        /* ── Nav ── */
        .glass-nav {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 1px solid rgba(255,255,255,0.03);
            transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @media (max-width: 639px) {
            .glass-nav.nav-hidden {
                transform: translateY(-100%);
            }
        }

        /* ── Inputs ── */
        .cmd-input {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            transition: all 0.3s ease;
        }
        .cmd-input:focus-within {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.1);
            box-shadow: 0 0 20px rgba(255,255,255,0.03);
        }
        [contenteditable] { outline: none; transition: opacity 0.2s; }
        [contenteditable]:focus { opacity: 0.7; }

        /* ── Ambient glow ── */
        .ambient-glow {
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 60vh;
            background: radial-gradient(ellipse at top, rgba(255,255,255,0.04), transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        /* ── Modals ── */
        #modal-content, #folder-modal-content {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }
        @media (max-width: 639px) {
            #modal-content, #folder-modal-content {
                bottom: 0; left: 0; right: 0;
                transform: translateY(100%);
            }
            #modal-content.is-open, #folder-modal-content.is-open { transform: translateY(0); }
        }
        @media (min-width: 640px) {
            #modal-content, #folder-modal-content {
                top: 50%; left: 50%;
                transform: translate(-50%, -50%) scale(0.95);
            }
            #modal-content.is-open, #folder-modal-content.is-open {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* ── Toasts ── */
        .toast-enter { animation: toastEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast-leave { animation: toastLeave 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes toastEnter { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes toastLeave { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(20px) scale(0.95); } }

        /* ── Folder selector chips ── */
        .folder-chip {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .folder-chip:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); }
        .folder-chip.selected {
            background: rgba(251,191,36,0.08);
            border-color: rgba(251,191,36,0.25);
            color: rgb(251,191,36);
        }
        .folder-chip.selected-none {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.14);
            color: #e4e4e7;
        }

        /* ── Icon preview box ── */
        .icon-preview-box {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .icon-preview-box.folder-preview {
            background: rgba(251,191,36,0.06);
            border-color: rgba(251,191,36,0.15);
        }
        .icon-preview-box .custom-icon-glyph {
            font-size: 1.75rem;
            line-height: 1;
            user-select: none;
        }

        /* ── Custom icon display in cards ── */
        .card-custom-icon {
            font-size: 1.5rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        @media (min-width: 640px) {
            .card-custom-icon { font-size: 1.75rem; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative selection:bg-white/20">

    <div class="ambient-glow animate-pulse-slow hidden sm:block blur-[120px]"></div>

    <!-- ══ Sticky Nav ══ -->
    <nav class="glass-nav sticky top-0 z-40 w-full animate-slide-down">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-12 py-3 sm:py-0 min-h-[4.5rem] sm:min-h-[5.5rem] flex flex-col sm:flex-row sm:items-center justify-center gap-3 sm:gap-6">

            <!-- Left: Title / Breadcrumb -->
            <div class="flex items-center justify-between w-full sm:w-auto sm:mr-auto">
                <div class="flex items-center gap-3 sm:gap-6 min-w-0">
                    <div id="live-time" class="text-[10px] sm:text-xs font-mono text-zinc-500 tracking-wider hidden sm:block"></div>
                    <div class="h-6 w-px bg-white/[0.06] hidden sm:block"></div>

                    <!-- Root title -->
                    <h1 id="main-title"
                        contenteditable="true"
                        spellcheck="false"
                        class="text-xl font-semibold text-zinc-100 truncate cursor-text tracking-tight"
                        onblur="saveHeaderData()"
                        onkeydown="handleTextKeydown(event)"
                        onclick="selectAllOnFocus(this)">Saved links</h1>

                    <!-- Folder breadcrumb (hidden by default) -->
                    <div id="folder-breadcrumb" class="hidden items-center gap-2 min-w-0">
                        <button onclick="history.back()" class="flex items-center p-1.5 text-zinc-400 hover:text-white rounded-lg hover:bg-white/5 transition-all group" title="Back">
                            <i class="ph ph-arrow-left text-base group-hover:-translate-x-0.5 transition-transform duration-200"></i>
                        </button>
                        <span class="text-zinc-600 text-sm hidden sm:block" aria-hidden="true">/</span>
                        <span id="root-crumb" class="text-zinc-500 text-sm hidden sm:block truncate max-w-[90px]"></span>
                        <span class="text-zinc-600 text-sm" aria-hidden="true">/</span>
                        <span id="folder-crumb-name" class="text-xl font-semibold text-zinc-100 truncate tracking-tight max-w-[160px] sm:max-w-[220px]"></span>
                    </div>
                </div>

                <!-- Mobile header actions -->
                <div class="flex items-center gap-1 sm:hidden text-zinc-400">
                    <button onclick="triggerImport()" class="p-2 rounded-xl hover:bg-white/10 active:scale-95 transition-all" title="Import">
                        <i class="ph ph-download-simple text-lg"></i>
                    </button>
                    <button onclick="exportLinks()" class="p-2 rounded-xl hover:bg-white/10 active:scale-95 transition-all" title="Export">
                        <i class="ph ph-upload-simple text-lg"></i>
                    </button>
                </div>
            </div>

            <!-- Search -->
            <div class="w-full sm:w-auto flex-1 sm:max-w-[260px] order-3 sm:order-2">
                <div class="relative group cmd-input rounded-xl sm:rounded-2xl flex items-center px-4 py-3 sm:py-2.5 cursor-text" onclick="document.getElementById('search-input').focus()">
                    <i class="ph ph-magnifying-glass text-lg sm:text-base text-zinc-500 group-focus-within:text-zinc-300 transition-colors"></i>
                    <input type="text" id="search-input" oninput="filterLinks()" placeholder="Search..." class="bg-transparent border-none outline-none text-[15px] sm:text-sm text-white placeholder-zinc-600 w-full ml-3">
                    <div class="hidden sm:flex items-center justify-center bg-white/5 rounded px-2 py-0.5 text-[10px] font-mono text-zinc-500 border border-white/5">/</div>
                </div>
            </div>

            <!-- Desktop Actions -->
            <div class="hidden sm:flex items-center gap-2 order-2 sm:order-3">
                <button onclick="triggerImport()" class="p-2.5 rounded-xl text-zinc-400 hover:text-white hover:bg-white/10 transition-all" title="Import Data">
                    <i class="ph ph-download-simple text-xl"></i>
                </button>
                <input type="file" id="importFile" accept=".json" class="hidden" onchange="importLinks(event)">
                <button onclick="exportLinks()" class="p-2.5 rounded-xl text-zinc-400 hover:text-white hover:bg-white/10 transition-all" title="Export Data">
                    <i class="ph ph-upload-simple text-xl"></i>
                </button>
                <div class="h-6 w-px bg-white/[0.06] mx-1"></div>

                <!-- New Folder -->
                <button id="new-folder-btn" onclick="openFolderModal()" class="px-4 py-2.5 text-zinc-400 hover:text-zinc-200 border border-white/[0.07] hover:border-white/[0.12] hover:bg-white/[0.03] rounded-2xl text-sm font-medium transition-all flex items-center gap-2">
                    <i class="ph ph-folder-plus text-lg text-amber-500/70"></i>
                    <span>New Folder</span>
                </button>

                <!-- Add Link -->
                <button onclick="openModal()" class="ml-1 px-5 py-2.5 bg-white text-black text-sm font-bold rounded-2xl hover:bg-zinc-200 hover:scale-105 active:scale-95 transition-all flex items-center gap-2 shadow-[0_0_20px_rgba(255,255,255,0.15)]">
                    <i class="ph ph-plus text-xl"></i>
                    <span>Add Link</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- ══ Main ══ -->
    <main class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-12 py-6 z-10 flex flex-col items-center">
        <div id="cards-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6 md:gap-8 w-full"></div>

        <div id="bottom-hints" class="flex flex-col items-center justify-center gap-1.5 mt-6 mb-1 w-full max-w-md mx-auto">
            <div class="text-zinc-500 text-[13px] font-medium">
                <span>Click to open • Long press to drag and rearrange</span>
            </div>
            <div class="text-[12px] sm:text-[13px] text-indigo-500/90 bg-indigo-500/5 border border-indigo-500/15 px-4 py-2 rounded-xl text-center w-fit mx-auto">
                <span>Data is saved in your browser. </span>
                <button onclick="exportLinks()" class="inline-flex items-center gap-0.5 group">
                    <span class="font-bold underline decoration-indigo-500/40 underline-offset-2 group-hover:text-indigo-400 transition-colors active:scale-95">Export</span>
                    <span class="ml-0.5">it to keep it safe</span>
                </button>
            </div>
        </div>

        <footer class="w-full py-1 text-center">
            <p class="text-zinc-500/80 text-[11px] font-semibold tracking-wide">
                Made with <span class="text-rose-500/90 animate-[pulse_4s_ease-in-out_infinite]">♥️</span> by Tam
            </p>
        </footer>
    </main>

    <!-- ══ Mobile FABs ══ -->
    <div class="sm:hidden fixed bottom-6 right-5 flex flex-col items-end gap-3 z-40">
        <button id="mobile-folder-fab" onclick="openFolderModal()" class="w-12 h-12 bg-[#111113] border border-white/10 text-amber-500/80 rounded-full flex items-center justify-center shadow-[0_8px_28px_rgba(0,0,0,0.6)] active:scale-90 transition-all">
            <i class="ph ph-folder-plus text-xl"></i>
        </button>
        <button onclick="openModal()" class="w-14 h-14 bg-white text-black rounded-full flex items-center justify-center shadow-[0_8px_32px_rgba(255,255,255,0.3)] active:scale-90 transition-transform">
            <i class="ph ph-plus text-2xl font-bold"></i>
        </button>
    </div>

    <!-- ══ Remove-from-Folder Drop Zone (shows inside folder view during drag) ══ -->
    <div id="folder-remove-zone">
        <div id="folder-remove-zone-inner">
            <i class="ph ph-folder-minus text-lg shrink-0"></i>
            <span>Drop here to remove from this folder</span>
        </div>
    </div>

    <!-- ══ Shared Backdrop ══ -->
    <div id="modal-backdrop" class="fixed inset-0 bg-black/60 sm:bg-black/80 backdrop-blur-sm sm:backdrop-blur-md z-50 hidden opacity-0 transition-opacity duration-300" onclick="handleBackdropClick()"></div>

    <!-- ══ Link Modal ══ -->
    <div id="modal-content" class="fixed z-50 hidden opacity-0 w-full sm:max-w-md bg-[#09090b] sm:border border-white/5 rounded-t-[32px] sm:rounded-[28px] shadow-[0_-20px_60px_rgba(0,0,0,0.5)] sm:shadow-[0_40px_100px_rgba(0,0,0,1)] p-6 pb-10 sm:p-8 overflow-hidden">
        <div class="w-12 h-1.5 bg-white/10 rounded-full mx-auto mb-6 sm:hidden"></div>
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-32 bg-white/[0.02] blur-3xl rounded-full pointer-events-none hidden sm:block"></div>
        <div class="relative z-10">
            <h2 id="modal-title" class="text-xl sm:text-2xl font-medium text-white mb-6 sm:mb-8 tracking-tight">New Link</h2>
            <div class="space-y-4 sm:space-y-5">
                <div>
                    <label class="block text-xs font-medium text-zinc-500 mb-2">URL</label>
                    <div class="cmd-input rounded-2xl p-1">
                        <input type="url" id="input-url" class="w-full bg-transparent px-4 py-3.5 sm:py-3 text-white placeholder-zinc-700 outline-none text-base" placeholder="https://...">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-zinc-500 mb-2 flex justify-between">
                        <span>Title</span>
                        <span id="fetch-indicator" class="text-zinc-600 hidden animate-pulse">Fetching details...</span>
                    </label>
                    <div class="cmd-input rounded-2xl p-1">
                        <input type="text" id="input-name" class="w-full bg-transparent px-4 py-3.5 sm:py-3 text-white placeholder-zinc-700 outline-none text-base" placeholder="e.g. GitHub">
                    </div>
                </div>
                <!-- Custom Icon -->
                <div>
                    <label class="block text-xs font-medium text-zinc-500 mb-2">
                        Icon <span class="text-zinc-700 font-normal">(optional — emoji or any character)</span>
                    </label>
                    <div class="flex items-center gap-3">
                        <div class="cmd-input rounded-2xl p-1 flex-1">
                            <input type="text" id="input-link-icon"
                                   class="w-full bg-transparent px-4 py-3.5 sm:py-3 text-white placeholder-zinc-700 outline-none text-base"
                                   placeholder="e.g. 🔗 ★ ✦"
                                   oninput="updateLinkIconPreview()">
                        </div>
                        <div id="link-icon-preview" class="icon-preview-box" title="Icon preview">
                            <i class="ph ph-smiley text-xl text-zinc-600"></i>
                        </div>
                    </div>
                    <p class="text-[11px] text-zinc-700 mt-1.5 pl-1">Leave blank to use the website's favicon</p>
                </div>
                <!-- Folder selector (hidden when no folders exist) -->
                <div id="folder-selector-wrap" class="hidden">
                    <label class="block text-xs font-medium text-zinc-500 mb-2">Folder</label>
                    <div id="folder-chips" class="flex flex-wrap gap-2"></div>
                </div>
            </div>
            <div class="flex gap-3 mt-8 sm:mt-10">
                <button onclick="closeModal()" class="flex-1 px-5 py-4 sm:py-3.5 rounded-2xl text-zinc-400 hover:text-white hover:bg-white/5 active:bg-white/10 transition-colors text-[15px] sm:text-sm font-medium">Cancel</button>
                <button onclick="saveLink()" class="flex-1 px-5 py-4 sm:py-3.5 rounded-2xl bg-white text-black font-semibold hover:bg-zinc-200 active:scale-95 transition-all text-[15px] sm:text-sm shadow-[0_0_20px_rgba(255,255,255,0.1)]">Save Link</button>
            </div>
        </div>
    </div>

    <!-- ══ Folder Modal ══ -->
    <div id="folder-modal-content" class="fixed z-50 hidden opacity-0 w-full sm:max-w-sm bg-[#09090b] sm:border border-white/5 rounded-t-[32px] sm:rounded-[28px] shadow-[0_-20px_60px_rgba(0,0,0,0.5)] sm:shadow-[0_40px_100px_rgba(0,0,0,1)] p-6 pb-10 sm:p-8 overflow-hidden">
        <div class="w-12 h-1.5 bg-white/10 rounded-full mx-auto mb-6 sm:hidden"></div>

    <div id="folder-action-sheet" class="fixed bottom-0 left-0 right-0 z-[60] bg-[#121214] sm:hidden rounded-t-[32px] p-6 pb-10 transform translate-y-full transition-transform duration-300 shadow-[0_-20px_60px_rgba(0,0,0,0.8)] border-t border-white/5">
        <div class="w-12 h-1.5 bg-white/10 rounded-full mx-auto mb-6"></div>

    <!-- ══ Templates ══ -->

                <div class="absolute inset-0 bg-amber-400/[0.04] border border-amber-400/[0.12] rounded-full flex items-center justify-center z-10">

            <p class="text-zinc-500 text-[13px] sm:text-sm max-w-sm leading-relaxed px-4">Add a link and assign it to this folder, or move existing links here.</p>

    <template id="no-results-state">
        <div class="col-span-full flex flex-col items-center justify-center py-16 sm:py-20 lg:py-40 text-center opacity-0 animate-fade-in h-full flex-1">
            <div class="relative w-14 h-14 sm:w-20 sm:h-20 mb-5 sm:mb-6">
                <div class="absolute inset-0 bg-white/[0.02] border border-white/[0.08] rounded-full flex items-center justify-center z-10">
                    <i class="ph ph-magnifying-glass text-lg sm:text-2xl text-zinc-500"></i>
                </div>
            </div>
            <h3 class="text-base sm:text-xl font-medium text-zinc-100 mb-2 tracking-tight">No links found</h3>
            <p class="text-zinc-500 text-[13px] sm:text-sm max-w-sm mb-6 sm:mb-8 leading-relaxed px-4">Nothing matched "<span id="search-query-display" class="text-zinc-200 font-medium"></span>".</p>
            <button onclick="clearSearch()" class="px-5 py-2.5 bg-white/[0.03] border border-white/[0.08] text-white text-sm font-medium rounded-xl sm:rounded-2xl hover:bg-white/[0.08] active:scale-95 transition-all flex items-center gap-2 mx-auto">
                <i class="ph ph-x text-zinc-400"></i> Clear Search

    <!-- ══ Scripts ══ -->
    <script>
    // ─── State ────────────────────────────────────────────────────────────────
    let links   = JSON.parse(localStorage.getItem('premiumLinks'))   || [];
    let folders = JSON.parse(localStorage.getItem('premiumFolders')) || [];
    let workspaceTitle    = localStorage.getItem('p_workspaceTitle') || 'Saved links';
    let currentFolderId   = null;   // null = root view
    let editingId         = null;   // link index being edited
    let editingFolderId   = null;   // folder id being edited
    let currentActionLinkId      = null;  // ID (not index) of link in action sheet
    let currentFolderActionId    = null;  // ID (not index) of folder in action sheet
    let movingLinkId             = null;  // ID of link being moved via move sheet
    let selectedFolderForLink    = undefined; // undefined=unset, null=no folder, string=folder id

    // ─── Drag state ───────────────────────────────────────────────────────────
    let draggingLinkId   = null;
    let folderDropTarget = null;

    const grid           = document.getElementById('cards-grid');
    const searchInput    = document.getElementById('search-input');
    const nameInput      = document.getElementById('input-name');
    const urlInput       = document.getElementById('input-url');
    const fetchIndicator = document.getElementById('fetch-indicator');
    const bottomHints    = document.getElementById('bottom-hints');
    const removeZoneEl   = document.getElementById('folder-remove-zone');

    // ─── ID / Helpers ─────────────────────────────────────────────────────────
    const generateId = () =>
        typeof crypto !== 'undefined' && crypto.randomUUID
            ? crypto.randomUUID()
            : Math.random().toString(36).substr(2, 9) + Date.now().toString(36);

    function getDomain(url) {
        try { return new URL(url).hostname.replace('www.', ''); } catch { return url; }
    }

    function getFavicon(url) {
        try {
            const v = /^https?:\/\//i.test(url) ? url : `https://${url}`;
            return `https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=${encodeURIComponent(v)}&size=128`;
        } catch {
            return 'https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=https://google.com&size=128';
        }
    }

    function escHtml(s) {
        return String(s)
            .replace(/&/g,'&amp;')
            .replace(/</g,'&lt;')
            .replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;');
    }

    // ─── Persistence ──────────────────────────────────────────────────────────
    function save() {
        localStorage.setItem('premiumLinks',   JSON.stringify(links));
        localStorage.setItem('premiumFolders', JSON.stringify(folders));
    }

    // ─── Clock ────────────────────────────────────────────────────────────────
    function updateClock() {
        const now = new Date();
        const el  = document.getElementById('live-time');
        if (el) el.innerText =
            now.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', hour12:true })
            + ' — '
            + now.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ─── Navigation ───────────────────────────────────────────────────────────
    function navigateToFolder(folderId) {
        history.pushState({ layer: 'folder' }, '');
        currentFolderId = folderId;
        searchInput.value = '';
        updateNavChrome();
        render();
    }

    function navigateBack() {
        currentFolderId = null;
        searchInput.value = '';
        updateNavChrome();
        render();
    }

    function updateNavChrome() {
        const mainTitle      = document.getElementById('main-title');
        const breadcrumb     = document.getElementById('folder-breadcrumb');
        const folderCrumb    = document.getElementById('folder-crumb-name');
        const rootCrumb      = document.getElementById('root-crumb');
        const newFolderBtn   = document.getElementById('new-folder-btn');
        const mobileFolderFab = document.getElementById('mobile-folder-fab');

        if (currentFolderId !== null) {
            const folder = folders.find(f => f.id === currentFolderId);
            mainTitle.classList.add('hidden');
            breadcrumb.classList.remove('hidden');
            breadcrumb.classList.add('flex');
            folderCrumb.innerText = folder ? folder.name : 'Folder';
            rootCrumb.innerText   = workspaceTitle;
            newFolderBtn.classList.add('hidden');
            mobileFolderFab.classList.add('hidden');
        } else {
            mainTitle.classList.remove('hidden');
            breadcrumb.classList.add('hidden');
            breadcrumb.classList.remove('flex');
            newFolderBtn.classList.remove('hidden');
            mobileFolderFab.classList.remove('hidden');
        }
    }

    // ─── ID-based helpers (fix rearrangement bug) ─────────────────────────────
    function openModalByLinkId(e, id) {
        openModal(e, links.findIndex(l => l.id === id));
    }
    function deleteLinkById(e, id) {
        deleteLink(e, links.findIndex(l => l.id === id));
    }
    function openActionSheetByLinkId(e, id) {
        openActionSheet(e, id);
    }
    function openFolderModalById(e, id) {
        openFolderModal(e, folders.findIndex(f => f.id === id));
    }
    function deleteFolderById(e, id) {
        deleteFolder(e, folders.findIndex(f => f.id === id));
    }
    function openFolderActionSheetById(e, id) {
        openFolderActionSheet(e, id);
    }

    // ─── Render ───────────────────────────────────────────────────────────────
    function render(overrideLinks = null) {
        grid.innerHTML = '';

        const visibleFolders = (currentFolderId === null && overrideLinks === null) ? folders : [];
        const visibleLinks   = overrideLinks !== null
            ? overrideLinks
            : links.filter(l =>
                currentFolderId === null
                    ? !l.folderId
                    : l.folderId === currentFolderId
              );

        const isEmpty = visibleFolders.length === 0 && visibleLinks.length === 0;

        if (isEmpty) {
            if (bottomHints) bottomHints.style.display = 'none';
            let tpl;
            if (searchInput.value.trim()) {
                tpl = document.getElementById('no-results-state').content.cloneNode(true);
                tpl.querySelector('#search-query-display').innerText = searchInput.value;
            } else if (currentFolderId !== null) {
                tpl = document.getElementById('empty-folder-state').content.cloneNode(true);
            } else {
                tpl = document.getElementById('empty-state').content.cloneNode(true);
            }
            grid.appendChild(tpl);
            grid.classList.remove('grid','grid-cols-1','sm:grid-cols-2','lg:grid-cols-3');
            grid.classList.add('flex','flex-col','items-center','justify-center','flex-1');
            return;
        }

        if (bottomHints) {
            bottomHints.style.display = 'flex';
            setTimeout(() => bottomHints.classList.remove('opacity-0'), 100);
        }
        grid.classList.add('grid','grid-cols-1','sm:grid-cols-2','lg:grid-cols-3');
        grid.classList.remove('flex','flex-col','items-center','justify-center','flex-1');

        let cardIdx = 0;

        // ── Folder cards ──────────────────────────────────────────────────────
        visibleFolders.forEach(folder => {
            const linkCount = links.filter(l => l.folderId === folder.id).length;
            const card      = document.createElement('div');
            card.className  = `premium-card folder-card opacity-0 animate-stagger-up group cursor-pointer active:scale-[0.98] sm:active:scale-100 transition-transform duration-200`;
            card.style.animationDelay = `${cardIdx * 40}ms`;
            card.setAttribute('data-folder-id', folder.id);

            const folderIconHtml = folder.icon
                ? `<span class="card-custom-icon pointer-events-none">${escHtml(folder.icon)}</span>`
                : `<i class="ph-fill ph-folder text-2xl sm:text-[28px] text-amber-400/75 group-hover:text-amber-400 transition-colors duration-300 pointer-events-none"></i>`;

            card.innerHTML = `
                <div class="premium-card-inner p-4 sm:p-6 flex flex-row sm:flex-col items-center sm:items-start relative min-h-[76px] sm:min-h-[160px]">
                    <!-- Icon -->
                    <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-[14px] sm:rounded-2xl bg-amber-400/[0.06] border border-amber-400/[0.14] flex items-center justify-center shrink-0 group-hover:scale-[1.05] group-hover:bg-amber-400/[0.1] transition-all duration-400 relative z-10 mr-4 sm:mr-0 pointer-events-none">
                        ${folderIconHtml}
                    </div>
                    <!-- Text -->
                    <div class="flex-1 min-w-0 relative z-10 pointer-events-none mt-0 sm:mt-5 pr-10 sm:pr-8">
                        <h3 class="text-[15px] sm:text-lg font-semibold text-zinc-100 truncate tracking-tight">${escHtml(folder.name)}</h3>
                        <p class="text-[13px] sm:text-sm font-medium text-zinc-500 truncate mt-0.5 sm:mt-1 group-hover:text-zinc-400 transition-colors">${linkCount} ${linkCount === 1 ? 'link' : 'links'}</p>
                    </div>
                    <!-- Desktop actions -->
                    <div class="hidden sm:flex absolute right-5 top-5 items-center gap-1 opacity-0 translate-x-4 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300 z-20 pointer-events-auto">
                        <button onclick="openFolderModalById(event,'${folder.id}')" class="p-2 text-zinc-500 hover:text-white rounded-xl hover:bg-white/10 transition-all" title="Rename">
                            <i class="ph ph-pencil-simple text-lg"></i>
                        </button>
                        <button onclick="deleteFolderById(event,'${folder.id}')" class="p-2 text-zinc-500 hover:text-rose-400 rounded-xl hover:bg-rose-400/10 transition-all" title="Delete">
                            <i class="ph ph-trash text-lg"></i>
                        </button>
                    </div>
                    <!-- Mobile 3-dots -->
                    <div class="sm:hidden absolute right-2 top-1/2 -translate-y-1/2 z-20 pointer-events-auto">
                        <button onclick="openFolderActionSheetById(event,'${folder.id}')" class="p-3 text-zinc-400 active:text-white active:bg-white/10 rounded-xl transition-all">
                            <i class="ph ph-dots-three-vertical text-xl"></i>
                        </button>
                    </div>
                    <!-- Arrow -->
                    <div class="absolute bottom-5 right-6 text-zinc-600 opacity-0 -translate-x-3 translate-y-3 sm:group-hover:opacity-100 sm:group-hover:translate-x-0 sm:group-hover:translate-y-0 transition-all duration-400 pointer-events-none z-10 hidden sm:block">
                        <i class="ph ph-arrow-right text-xl"></i>
                    </div>
                </div>
            `;

            card.addEventListener('click', e => { if (e.target.closest('button')) return; navigateToFolder(folder.id); });

            // ── Native drag events for desktop folder drop targeting ──
            card.addEventListener('dragover', e => {
                if (draggingLinkId) {
                    e.preventDefault();
                    if (folderDropTarget !== card) {
                        clearFolderHighlights();
                        folderDropTarget = card;
                        card.classList.add('folder-drop-active');
                    }
                }
            });
            card.addEventListener('dragleave', e => {
                if (!card.contains(e.relatedTarget)) {
                    card.classList.remove('folder-drop-active');
                    if (folderDropTarget === card) folderDropTarget = null;
                }
            });
            card.addEventListener('drop', e => {
                if (draggingLinkId) { e.preventDefault(); e.stopPropagation(); }
            });

            grid.appendChild(card);
            cardIdx++;
        });

        // ── Link cards ────────────────────────────────────────────────────────
        visibleLinks.forEach(link => {
            const card        = document.createElement('div');
            card.className    = `premium-card opacity-0 animate-stagger-up group cursor-pointer active:scale-[0.98] sm:active:scale-100 transition-transform duration-200`;
            card.style.animationDelay = `${cardIdx * 40}ms`;
            card.setAttribute('data-id', link.id);

            const fbIcon = `https://icons.duckduckgo.com/ip3/${getDomain(link.url)}.ico`;
            const iconHtml = link.icon
                ? `<span class="card-custom-icon pointer-events-none">${escHtml(link.icon)}</span>`
                : `<img src="${getFavicon(link.url)}" class="w-6 h-6 sm:w-7 sm:h-7 object-contain drop-shadow-md pointer-events-none" onerror="this.onerror=null;this.src='${fbIcon}'">`;

            card.innerHTML = `
                <div class="premium-card-inner p-4 sm:p-6 flex flex-row sm:flex-col items-center sm:items-start relative min-h-[76px] sm:min-h-[160px] transition-all duration-300">
                    <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-[14px] sm:rounded-2xl bg-white/[0.03] border border-white/[0.06] shadow-[inset_0_2px_4px_rgba(255,255,255,0.02)] flex items-center justify-center overflow-hidden shrink-0 group-hover:scale-[1.05] group-hover:bg-white/[0.05] transition-all duration-400 relative z-10 mr-4 sm:mr-0">
                        ${iconHtml}
                    </div>
                    <div class="flex-1 min-w-0 relative z-10 pointer-events-none mt-0 sm:mt-6 pr-10 sm:pr-8">
                        <h3 class="text-[15px] sm:text-lg font-semibold text-zinc-100 truncate tracking-tight">${escHtml(link.name)}</h3>
                        <p class="text-[13px] sm:text-sm font-medium text-zinc-500 truncate mt-0.5 sm:mt-1 group-hover:text-zinc-400 transition-colors">${escHtml(getDomain(link.url))}</p>
                    </div>
                    <!-- Desktop actions -->
                    <div class="hidden sm:flex absolute right-5 top-5 items-center gap-1 opacity-0 translate-x-4 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300 z-20 pointer-events-auto">
                        <button onclick="openModalByLinkId(event,'${link.id}')" class="p-2 text-zinc-500 hover:text-white rounded-xl hover:bg-white/10 transition-all" title="Edit">
                            <i class="ph ph-pencil-simple text-lg"></i>
                        </button>
                        <button onclick="deleteLinkById(event,'${link.id}')" class="p-2 text-zinc-500 hover:text-rose-400 rounded-xl hover:bg-rose-400/10 transition-all" title="Delete">
                            <i class="ph ph-trash text-lg"></i>
                        </button>
                    </div>
                    <!-- Mobile 3-dots -->
                    <div class="sm:hidden absolute right-2 top-1/2 -translate-y-1/2 z-20 pointer-events-auto">
                        <button onclick="openActionSheetByLinkId(event,'${link.id}')" class="p-3 text-zinc-400 active:text-white active:bg-white/10 rounded-xl transition-all">
                            <i class="ph ph-dots-three-vertical text-xl"></i>
                        </button>
                    </div>
                    <!-- Arrow -->
                    <div class="absolute bottom-5 right-6 text-zinc-600 opacity-0 -translate-x-3 translate-y-3 sm:group-hover:opacity-100 sm:group-hover:translate-x-0 sm:group-hover:translate-y-0 transition-all duration-400 pointer-events-none z-10 hidden sm:block">
                        <i class="ph ph-arrow-up-right text-xl"></i>
                    </div>
                </div>
            `;

            card.addEventListener('click', e => { if (e.target.closest('button')) return; window.open(link.url, '_blank'); });
            grid.appendChild(card);
            cardIdx++;
        });

        save();
    }

    // ─── Filter ───────────────────────────────────────────────────────────────
    function filterLinks() {
        const q = searchInput.value.toLowerCase();
        if (!q) { render(); return; }
        const pool = currentFolderId === null
            ? links
            : links.filter(l => l.folderId === currentFolderId);
        render(pool.filter(l => l.name.toLowerCase().includes(q) || l.url.toLowerCase().includes(q)));
    }

    function clearSearch() {
        searchInput.value = '';
        filterLinks();
        searchInput.focus();
    }

    // ─── Folder-chip selector (inside link modal) ─────────────────────────────
    function buildFolderChips() {
        const wrap  = document.getElementById('folder-selector-wrap');
        const chips = document.getElementById('folder-chips');
        chips.innerHTML = '';

        if (folders.length === 0) { wrap.classList.add('hidden'); return; }
        wrap.classList.remove('hidden');

        // "None" chip
        const none = document.createElement('button');
        none.type  = 'button';
        none.className = `folder-chip px-3 py-1.5 rounded-xl text-sm font-medium text-zinc-400 ${selectedFolderForLink === null ? 'selected-none' : ''}`;
        none.innerText = 'None';
        none.onclick   = () => { selectedFolderForLink = null; buildFolderChips(); };
        chips.appendChild(none);

        folders.forEach(f => {
            const btn    = document.createElement('button');
            btn.type     = 'button';
            const sel    = selectedFolderForLink === f.id;
            btn.className = `folder-chip px-3 py-1.5 rounded-xl text-sm font-medium flex items-center gap-1.5 ${sel ? 'selected' : 'text-zinc-400'}`;
            btn.innerHTML = `<i class="ph-fill ph-folder text-sm ${sel ? 'text-amber-400' : 'text-zinc-600'}"></i>${escHtml(f.name)}`;
            btn.onclick   = () => { selectedFolderForLink = f.id; buildFolderChips(); };
            chips.appendChild(btn);
        });
    }

    // ─── Shared Backdrop ──────────────────────────────────────────────────────
    const modalBackdrop  = document.getElementById('modal-backdrop');
    const modalContent   = document.getElementById('modal-content');
    const folderModal    = document.getElementById('folder-modal-content');
    let   backdropTarget = null;

    function showBackdrop(closeFn) {
        backdropTarget = closeFn;
        modalBackdrop.classList.remove('hidden');
        void modalBackdrop.offsetWidth;
        modalBackdrop.classList.remove('opacity-0');
    }
    function hideBackdrop() {
        modalBackdrop.classList.add('opacity-0');
        setTimeout(() => modalBackdrop.classList.add('hidden'), 300);
    }
    function handleBackdropClick() { if (backdropTarget) backdropTarget(); }

    // ─── Link Modal ───────────────────────────────────────────────────────────
    function openModal(e = null, index = null) {
        if (e) e.stopPropagation();

        selectedFolderForLink = index !== null
            ? (links[index].folderId || null)
            : currentFolderId;

        showBackdrop(closeModal);
        if (_isMobile()) _pushOverlayHistory();
        modalContent.classList.remove('hidden');
        void modalContent.offsetWidth;
        modalContent.classList.remove('opacity-0');
        modalContent.classList.add('is-open');

        buildFolderChips();

        if (index !== null) {
            editingId = index;
            document.getElementById('modal-title').innerText = 'Edit Link';
            nameInput.value = links[index].name;
            urlInput.value  = links[index].url;
            document.getElementById('input-link-icon').value = links[index].icon || '';
        } else {
            editingId = null;
            document.getElementById('modal-title').innerText = 'New Link';
            nameInput.value = '';
            urlInput.value  = '';
            document.getElementById('input-link-icon').value = '';
        }
        updateLinkIconPreview();
        if (window.innerWidth > 640) setTimeout(() => urlInput.focus(), 150);

    function closeModal() {
        hideBackdrop();
        modalContent.classList.remove('is-open');
        modalContent.classList.add('opacity-0');
        setTimeout(() => modalContent.classList.add('hidden'), 300);
        if (_isMobile()) _popOverlayHistory();
    }

    function saveLink() {
        const name = nameInput.value.trim();
        let   url  = urlInput.value.trim();
        if (!name || !url) return showToast('Please enter both name and URL');
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

        const folderId = selectedFolderForLink || undefined;
        const icon     = document.getElementById('input-link-icon').value.trim() || undefined;

        if (editingId !== null) {
            links[editingId] = { ...links[editingId], name, url, folderId, icon };
        } else {
            links.unshift({ id: generateId(), name, url, folderId, icon });
        }
        searchInput.value = '';
        render();
        closeModal();
        showToast(editingId !== null ? 'Link updated' : 'Link added');
    }

    modalContent.addEventListener('keydown', e => {
        if (e.key === 'Enter')  saveLink();
        if (e.key === 'Escape') closeModal();
    });

    function deleteLink(event, index) {
        if (event) event.stopPropagation();
        if (index < 0 || index >= links.length) return;
        const deleted = links[index];
        links.splice(index, 1);
        filterLinks();
        showToast('Link removed', 'Undo', () => {
            links.splice(index, 0, deleted);
            filterLinks();
        });
    }

    // ─── Folder Modal ─────────────────────────────────────────────────────────
    const folderNameInput = document.getElementById('input-folder-name');
    const folderIconInput = document.getElementById('input-folder-icon');

    function openFolderModal(e = null, index = null) {
        if (e) e.stopPropagation();

        showBackdrop(closeFolderModal);
        if (_isMobile()) _pushOverlayHistory();
        folderModal.classList.remove('hidden');
        void folderModal.offsetWidth;
        folderModal.classList.remove('opacity-0');
        folderModal.classList.add('is-open');

        if (index !== null && index >= 0) {
            editingFolderId = index;
            document.getElementById('folder-modal-title').innerText = 'Edit Folder';
            folderNameInput.value = folders[index].name;
            folderIconInput.value = folders[index].icon || '';
        } else {
            editingFolderId = null;
            document.getElementById('folder-modal-title').innerText = 'New Folder';
            folderNameInput.value = '';
            folderIconInput.value = '';
        }
        updateFolderIconPreview();
        setTimeout(() => folderNameInput.focus(), 150);
    }

    function closeFolderModal() {
        hideBackdrop();
        folderModal.classList.remove('is-open');
        folderModal.classList.add('opacity-0');
        setTimeout(() => folderModal.classList.add('hidden'), 300);
        if (_isMobile()) _popOverlayHistory();
    }

    function saveFolder() {
        const name = folderNameInput.value.trim();
        if (!name) return showToast('Please enter a folder name');
        const icon = folderIconInput.value.trim() || undefined;

        if (editingFolderId !== null) {
            folders[editingFolderId] = { ...folders[editingFolderId], name, icon };
            if (currentFolderId === folders[editingFolderId].id) {
                document.getElementById('folder-crumb-name').innerText = name;
            }
        } else {
            folders.unshift({ id: generateId(), name, icon });
        }
        render();
        closeFolderModal();
        showToast(editingFolderId !== null ? 'Folder updated' : 'Folder created');
    }

    function deleteFolder(event, index) {
        if (event) event.stopPropagation();
        if (index < 0 || index >= folders.length) return;
        const deleted      = folders[index];
        const affectedIds  = links.filter(l => l.folderId === deleted.id).map(l => l.id);

        links   = links.map(l => l.folderId === deleted.id ? { ...l, folderId: undefined } : l);
        folders.splice(index, 1);

        if (currentFolderId === deleted.id) navigateBack();
        else render();

        showToast('Folder deleted', 'Undo', () => {
            folders.splice(index, 0, deleted);
            links = links.map(l => affectedIds.includes(l.id) ? { ...l, folderId: deleted.id } : l);
            render();
        });
    }

    folderModal.addEventListener('keydown', e => {
        if (e.key === 'Enter')  saveFolder();
        if (e.key === 'Escape') closeFolderModal();
    });

    // ─── Move-to-Folder Sheet (Mobile) ────────────────────────────────────────
    const moveSheetBackdrop = document.getElementById('move-sheet-backdrop');
    const moveSheet         = document.getElementById('move-sheet');

    function openMoveSheet(linkId) {
        movingLinkId = linkId;
        _pushOverlayHistory();
        const container = document.getElementById('move-sheet-options');
        container.innerHTML = '';
        const link = links.find(l => l.id === linkId);
        if (!link) return;

        const makeBtn = (label, icon, iconClass, selected, onClick) => {
            const btn = document.createElement('button');
            btn.className = `w-full flex items-center gap-4 px-4 py-4 rounded-2xl transition-colors text-left font-medium text-[15px] ${selected ? 'text-white bg-white/5' : 'text-zinc-300 hover:bg-white/5 active:bg-white/10'}`;
            btn.innerHTML = `<i class="${icon} text-xl ${iconClass}"></i><span>${escHtml(label)}</span>${selected ? '<i class="ph ph-check ml-auto text-zinc-400"></i>' : ''}`;
            btn.onclick = onClick;
            return btn;
        };

        const noneSelected = !link.folderId;
        container.appendChild(makeBtn('No Folder', 'ph ph-prohibit', 'text-zinc-500', noneSelected, () => {
            const li = links.findIndex(l => l.id === linkId);
            if (li !== -1) {
                const prevFolderId = links[li].folderId;
                links[li] = { ...links[li], folderId: undefined };
                save(); render(); closeMoveSheet();
                showToast('Moved to root', 'Undo', () => {
                    const ci = links.findIndex(l => l.id === linkId);
                    if (ci !== -1) { links[ci] = {...links[ci], folderId: prevFolderId}; save(); render(); }
                });
            }
        }));

        if (folders.length === 0) {
            container.innerHTML = `<p class="text-zinc-500 text-sm text-center py-4">No folders yet. Create one first.</p>`;
        } else {
            folders.forEach(f => {
                const sel = link.folderId === f.id;
                container.appendChild(makeBtn(f.name, 'ph-fill ph-folder', sel ? 'text-amber-400' : 'text-zinc-500', sel, () => {
                    const li = links.findIndex(l => l.id === linkId);
                    if (li !== -1) {
                        const prevFolderId = links[li].folderId;
                        links[li] = { ...links[li], folderId: f.id };
                        save(); render(); closeMoveSheet();
                        showToast(`Moved to "${f.name}"`, 'Undo', () => {
                            const ci = links.findIndex(l => l.id === linkId);
                            if (ci !== -1) { links[ci] = {...links[ci], folderId: prevFolderId}; save(); render(); }
                        });
                    }
                }));
            });
        }

        moveSheetBackdrop.classList.remove('hidden');
        moveSheet.classList.remove('hidden');
        void moveSheetBackdrop.offsetWidth;
        moveSheetBackdrop.classList.remove('opacity-0');
        moveSheet.classList.remove('translate-y-full');
    }

        moveSheet.classList.add('translate-y-full');

    function initHeader() {
        document.getElementById('main-title').innerText = workspaceTitle;
        document.getElementById('tab-title').innerText  = workspaceTitle;
    }
    function saveHeaderData() {
        workspaceTitle = document.getElementById('main-title').innerText.trim() || 'Saved links';
        document.getElementById('main-title').innerText = workspaceTitle;
        document.getElementById('tab-title').innerText  = workspaceTitle;
        localStorage.setItem('p_workspaceTitle', workspaceTitle);
    }
    function handleTextKeydown(e) { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } }
    function selectAllOnFocus(el) {
        setTimeout(() => {
            const r = document.createRange(); r.selectNodeContents(el);
            const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        }, 10);
    }

    // ─── Toast ────────────────────────────────────────────────────────────────
    function showToast(message, actionText = null, actionCallback = null) {
        const container = document.getElementById('toast-container');
        const toast     = document.createElement('div');
        toast.className = 'toast-enter bg-[#18181b] border border-white/10 text-white px-4 sm:px-5 py-3 sm:py-3.5 rounded-2xl shadow-2xl flex items-center justify-between gap-4 sm:gap-6 text-xs sm:text-sm font-medium pointer-events-auto w-max max-w-[90vw]';
        let html = `<span class="flex items-center gap-2 truncate"><i class="ph ph-info text-zinc-400 shrink-0 text-lg"></i><span class="truncate">${escHtml(message)}</span></span>`;
        if (actionText && actionCallback)
            html += `<button class="text-zinc-400 hover:text-white font-semibold transition-colors bg-white/5 hover:bg-white/10 px-3 py-1.5 rounded-lg text-xs tracking-wide shrink-0 active:scale-95">${escHtml(actionText)}</button>`;
        toast.innerHTML = html;
        if (actionCallback)
            toast.querySelector('button').addEventListener('click', () => { actionCallback(); removeToast(toast); });
        container.appendChild(toast);
        setTimeout(() => { if (toast.parentNode) removeToast(toast); }, 4000);
    }
    function removeToast(t) {
        t.classList.replace('toast-enter', 'toast-leave');
        setTimeout(() => t.remove(), 400);
    }

    // ─── Export / Import ──────────────────────────────────────────────────────
    function exportLinks() {
        const d = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ title: workspaceTitle, links, folders }, null, 2));
        const a = document.createElement('a');
        a.href = d; a.download = `links_${new Date().toISOString().split('T')[0]}.json`;
        a.click(); a.remove();
    }
    function triggerImport() { document.getElementById('importFile').click(); }
    function importLinks(event) {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            try {
                const imp = JSON.parse(e.target.result);
                if (imp.links)   links   = imp.links.map(l => ({...l, id: l.id || generateId()}));
                if (imp.folders) folders = imp.folders.map(f => ({...f, id: f.id || generateId()}));
                else if (Array.isArray(imp)) links = imp.map(l => ({...l, id: l.id || generateId()}));
                if (imp.title) workspaceTitle = imp.title;
                initHeader(); saveHeaderData(); render();
                showToast('Data imported successfully');
            } catch { showToast('Invalid file format'); }
            event.target.value = '';
        };
        reader.readAsText(file);
    }

    // ─── Keyboard Shortcuts ───────────────────────────────────────────────────
    document.addEventListener('keydown', e => {
        if (e.key === '/' && document.activeElement !== document.getElementById('search-input') && !document.activeElement.isContentEditable && document.activeElement.tagName !== 'INPUT') {
            e.preventDefault();
            document.getElementById('search-input').focus();
        }
        if (e.key === 'Escape' && currentFolderId !== null && !modalContent.classList.contains('is-open') && !folderModal.classList.contains('is-open'))
            navigateBack();
    });

    // ─── Mouse Hover Effect ───────────────────────────────────────────────────
    if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
        grid.addEventListener('mousemove', e => {
            document.querySelectorAll('.premium-card').forEach(card => {
                const r = card.getBoundingClientRect();
                card.style.setProperty('--mouse-x', `${e.clientX - r.left}px`);
                card.style.setProperty('--mouse-y', `${e.clientY - r.top}px`);
            });
        });
    }

    // ─── URL Autofill ─────────────────────────────────────────────────────────
    urlInput.addEventListener('blur', async () => {
        let url = urlInput.value.trim();
        if (!url || nameInput.value.trim()) return;
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        try {
            fetchIndicator.classList.remove('hidden');
            const res  = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`);
            const data = await res.json();
            if (data.status === 'success' && data.data.title && !nameInput.value.trim())
                nameInput.value = data.data.title;
            else fallbackTitle(url);
        } catch { fallbackTitle(url); } finally { fetchIndicator.classList.add('hidden'); }
    });
    function fallbackTitle(url) {
        if (!nameInput.value.trim()) {
            try {
                const brand = new URL(url).hostname.replace('www.', '').split('.')[0];
                nameInput.value = brand.charAt(0).toUpperCase() + brand.slice(1);
            } catch {}
        }
    }

    // ─── Drag & Drop helpers ──────────────────────────────────────────────────
    function clearFolderHighlights() {
        document.querySelectorAll('.folder-drop-active').forEach(el => {
            el.classList.remove('folder-drop-active');
        });
    }

    function showRemoveZone() {
        removeZoneEl.classList.add('visible');
    }

    function hideRemoveZone() {
        removeZoneEl.classList.remove('visible', 'active');
    }

    // Native drag events on the remove zone (desktop)
    removeZoneEl.addEventListener('dragover', e => {
        if (draggingLinkId && currentFolderId !== null) {
            e.preventDefault();
            removeZoneEl.classList.add('active');
        }
    });
    removeZoneEl.addEventListener('dragleave', e => {
        if (!removeZoneEl.contains(e.relatedTarget)) {
            removeZoneEl.classList.remove('active');
        }
    });
    removeZoneEl.addEventListener('drop', e => {
        if (draggingLinkId) { e.preventDefault(); e.stopPropagation(); }
    });

    // ─── Touch-move tracker for remove zone (mobile) ─────────────────────────
    function handleDragTouchMove(e) {
        if (!draggingLinkId || currentFolderId === null) return;
        const touch = e.touches[0];
        if (!touch) return;
        const rzRect = removeZoneEl.getBoundingClientRect();
        if (touch.clientY > rzRect.top + 8) {
            removeZoneEl.classList.add('active');
        } else {
            removeZoneEl.classList.remove('active');
        }
    }

    // ─── Drag & Drop (Sortable + folder drop + remove zone) ───────────────────
    Sortable.create(grid, {
        animation: 400,
        easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
        ghostClass: 'sortable-ghost',
        dragClass: 'sortable-drag',
        delay: 150,
        delayOnTouchOnly: true,
        fallbackTolerance: 3,

        onStart(evt) {
            const linkId = evt.item.getAttribute('data-id');
            if (linkId) {
                draggingLinkId = linkId;
                // Show remove zone when inside a folder
                if (currentFolderId !== null) {
                    showRemoveZone();
                    document.addEventListener('touchmove', handleDragTouchMove, { passive: true });
                }
            }
        },

        onMove(evt) {
            if (!draggingLinkId) return;

            const related = evt.related;

            // ── Folder glow detection ──
            if (related && related.hasAttribute('data-folder-id') && !related.hasAttribute('data-id')) {
                // Hovering over a folder card
                if (folderDropTarget !== related) {
                    clearFolderHighlights();
                    folderDropTarget = related;
                    related.classList.add('folder-drop-active');
                }
                return false; // Prevent sortable from inserting here
            } else {
                // Not over a folder card — clear glow
                clearFolderHighlights();
                if (folderDropTarget && folderDropTarget !== related) {
                    folderDropTarget = null;
                }
            }

            // ── Remove zone detection (mobile / pointer events) ──
            if (currentFolderId !== null) {
                const clientY =
                    evt.originalEvent?.clientY ??
                    evt.originalEvent?.touches?.[0]?.clientY ??
                    evt.originalEvent?.changedTouches?.[0]?.clientY;

                if (clientY !== undefined) {
                    const rzRect = removeZoneEl.getBoundingClientRect();
                    if (clientY > rzRect.top + 8) {
                        removeZoneEl.classList.add('active');
                    } else {
                        removeZoneEl.classList.remove('active');
                    }
                }
            }
        },

        onEnd(evt) {
            const savedDraggingLinkId   = draggingLinkId;
            const savedFolderDropTarget = folderDropTarget;
            const wasRemoveZoneActive   = removeZoneEl.classList.contains('active');

            // Reset drag state
            draggingLinkId   = null;
            folderDropTarget = null;
            clearFolderHighlights();
            hideRemoveZone();
            document.removeEventListener('touchmove', handleDragTouchMove);

            // ── Case 1: Dropped on a folder ───────────────────────────────
            if (savedDraggingLinkId && savedFolderDropTarget) {
                const targetFolderId = savedFolderDropTarget.getAttribute('data-folder-id');
                const li = links.findIndex(l => l.id === savedDraggingLinkId);
                if (li !== -1) {
                    const prevFolderId = links[li].folderId;
                    const linkName     = links[li].name;
                    const folder       = folders.find(f => f.id === targetFolderId);
                    // Don't move if already in this folder
                    if (prevFolderId === targetFolderId) { render(); return; }
                    links[li] = { ...links[li], folderId: targetFolderId };
                    save(); render();
                    showToast(`"${linkName}" → "${folder?.name}"`, 'Undo', () => {
                        const ci = links.findIndex(l => l.id === savedDraggingLinkId);
                        if (ci !== -1) { links[ci] = {...links[ci], folderId: prevFolderId}; save(); render(); }
                    });
                }
                return;
            }

            // ── Case 2: Dropped on remove zone (remove from folder) ───────
            if (savedDraggingLinkId && currentFolderId !== null && wasRemoveZoneActive) {
                const li = links.findIndex(l => l.id === savedDraggingLinkId);
                if (li !== -1) {
                    const prevFolderId = links[li].folderId;
                    const linkName     = links[li].name;
                    links[li] = { ...links[li], folderId: undefined };
                    save(); render();
                    showToast(`"${linkName}" removed from folder`, 'Undo', () => {
                        const ci = links.findIndex(l => l.id === savedDraggingLinkId);
                        if (ci !== -1) { links[ci] = {...links[ci], folderId: prevFolderId}; save(); render(); }
                    });
                }
                return;
            }

            // ── Case 3: Normal sort ───────────────────────────────────────
            if (searchInput.value.trim()) return;
            const newFolders = [], newLinks = [];
            grid.querySelectorAll('.premium-card').forEach(card => {
                const fid = card.getAttribute('data-folder-id');
                const lid = card.getAttribute('data-id');
                if (fid) { const f = folders.find(x => x.id === fid); if (f) newFolders.push(f); }
                else if (lid) { const l = links.find(x => x.id === lid); if (l) newLinks.push(l); }
            });
            if (newFolders.length) folders = newFolders;
            const others = links.filter(l => currentFolderId === null ? l.folderId : l.folderId !== currentFolderId);
            links = [...newLinks, ...others];
            save();
        }
    });

    // ─── History / Back-button support ───────────────────────────────────────
    // Seed a base state so the very first back press never exits the page
    history.replaceState({ layer: 'root' }, '');

    let _closingViaPopstate    = false;
    let _suppressPopstateCount = 0;

    function _isMobile() { return window.innerWidth <= 640; }

    function _pushOverlayHistory() {
        history.pushState({ layer: 'overlay' }, '');
    }

    // Pop the history entry we pushed, but only when the user (not popstate) triggers a close.
    // Using a counter instead of a boolean so rapid open/closes stay in sync.
    function _popOverlayHistory() {
        if (_closingViaPopstate) return; // already being handled by popstate, skip
        _suppressPopstateCount++;
        history.back();
        setTimeout(() => { if (_suppressPopstateCount > 0) _suppressPopstateCount--; }, 100);
    }

    window.addEventListener('popstate', () => {
        if (_suppressPopstateCount > 0) { _suppressPopstateCount--; return; }

        _closingViaPopstate = true;
        try {
            // Close layers in reverse order of priority
            if (!moveSheet.classList.contains('translate-y-full') && !moveSheet.classList.contains('hidden')) {
                closeMoveSheet();
            } else if (!actionSheet.classList.contains('translate-y-full') && !actionSheet.classList.contains('hidden')) {
                closeActionSheet();
            } else if (!folderActionSheet.classList.contains('translate-y-full') && !folderActionSheet.classList.contains('hidden')) {
                closeFolderActionSheet();
            } else if (!modalContent.classList.contains('hidden')) {
                closeModal();
            } else if (!folderModal.classList.contains('hidden')) {
                closeFolderModal();
            } else if (currentFolderId !== null) {
                navigateBack();
            }
        } finally {
            _closingViaPopstate = false;
        }
    });

    // ─── Hide nav on scroll (mobile only) ────────────────────────────────────
    (function () {
        const nav = document.querySelector('nav.glass-nav');

        // The entry animation uses `forwards` fill-mode, which permanently locks
        // transform:translateY(0) and silently overrides our scroll-hide transform.
        // Strip the class once the animation finishes so our CSS can take over.
        nav.addEventListener('animationend', () => {
            nav.classList.remove('animate-slide-down');
        }, { once: true });

        let lastY = window.scrollY;
        let ticking = false;

        window.addEventListener('scroll', () => {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(() => {
                // Desktop: always show nav
                if (window.innerWidth >= 640) {
                    nav.classList.remove('nav-hidden');
                    ticking = false;
                    return;
                }
                const y = window.scrollY;
                // Scrolling down past 60px → hide; scrolling up → show
                if (y > lastY && y > 60) {
                    nav.classList.add('nav-hidden');
                } else {
                    nav.classList.remove('nav-hidden');
                }
                lastY = y;
                ticking = false;
            });
        }, { passive: true });
    })();

    // ─── Init ─────────────────────────────────────────────────────────────────
    initHeader();
    render();

    // ─── Keyboard Navigation ──────────────────────────────────────────────────
    // Tracks which card index is currently "focused" (-1 = none)
    let kbFocusIndex = -1;

    // Add a CSS style for the keyboard focus ring
    const kbStyle = document.createElement('style');
    kbStyle.textContent = `
        .kb-focus {
            outline: 2px solid rgba(255,255,255,0.55) !important;
            outline-offset: 2px !important;
            transform: translateY(-4px) scale(1.01) !important;
            z-index: 10 !important;
        }
        .kb-focus.folder-card {
            outline-color: rgba(251,191,36,0.7) !important;
        }
        #kb-hint {
            position: fixed;
            bottom: 1.25rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 999px;
            padding: 0.35rem 1rem;
            font-size: 0.72rem;
            color: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            white-space: nowrap;
            z-index: 500;
            backdrop-filter: blur(8px);
            letter-spacing: 0.01em;
        }
        #kb-hint.visible { opacity: 1; }
        #kb-hint kbd {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 5px;
            padding: 1px 6px;
            font-size: 0.7rem;
            font-family: inherit;
            color: rgba(255,255,255,0.5);
        }
    `;
    document.head.appendChild(kbStyle);

    // Create a small hint bar that shows when keyboard nav is active
    const kbHint = document.createElement('div');
    kbHint.id = 'kb-hint';
    kbHint.innerHTML = `<kbd>↑↓←→</kbd> Navigate &nbsp;·&nbsp; <kbd>Enter</kbd> Open &nbsp;·&nbsp; <kbd>Esc</kbd> Back`;
    document.body.appendChild(kbHint);

    let kbHintTimeout = null;
    function showKbHint() {
        kbHint.classList.add('visible');
        clearTimeout(kbHintTimeout);
        kbHintTimeout = setTimeout(() => kbHint.classList.remove('visible'), 2500);
    }

    function getCards() {
        return Array.from(grid.querySelectorAll('.premium-card'));
    }

    function getColumns() {
        // Determine grid column count by comparing card positions
        const cards = getCards();
        if (cards.length < 2) return 1;
        const firstTop = cards[0].getBoundingClientRect().top;
        let cols = 1;
        for (let i = 1; i < cards.length; i++) {
            if (Math.abs(cards[i].getBoundingClientRect().top - firstTop) < 5) cols++;
            else break;
        }
        return cols;
    }

    function clearKbFocus() {
        getCards().forEach(c => c.classList.remove('kb-focus'));
    }

    function setKbFocus(index) {
        const cards = getCards();
        if (cards.length === 0) return;
        index = Math.max(0, Math.min(index, cards.length - 1));
        kbFocusIndex = index;
        clearKbFocus();
        cards[index].classList.add('kb-focus');
        cards[index].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function isAnyOverlayOpen() {
        const moveSheet   = document.getElementById('move-sheet');
        const actionSheet = document.getElementById('action-sheet');
        const folderAS    = document.getElementById('folder-action-sheet');
        const mc          = document.getElementById('modal-content');
        const fm          = document.getElementById('folder-modal-content');

        const isSheetOpen = el => el && !el.classList.contains('translate-y-full') && !el.classList.contains('hidden');
        return isSheetOpen(moveSheet) || isSheetOpen(actionSheet) || isSheetOpen(folderAS)
            || (mc && !mc.classList.contains('hidden'))
            || (fm && !fm.classList.contains('hidden'));
    }

    document.addEventListener('keydown', e => {
        // Don't hijack typing in inputs / contenteditable
        const tag = document.activeElement?.tagName;
        const isEditable = tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement?.isContentEditable;

        // Allow Escape to bubble even from inputs (closes modals)
        if (e.key === 'Escape') {
            clearKbFocus();
            kbFocusIndex = -1;
            return; // let the existing popstate/close handlers take over
        }

        if (isEditable) return;
        if (isAnyOverlayOpen()) return;

        const cards = getCards();
        if (cards.length === 0) return;

        const cols = getColumns();

        switch (e.key) {
            case 'ArrowRight':
            case 'l':
                e.preventDefault();
                setKbFocus(kbFocusIndex < 0 ? 0 : kbFocusIndex + 1);
                showKbHint();
                break;

            case 'ArrowLeft':
            case 'h':
                e.preventDefault();
                setKbFocus(kbFocusIndex <= 0 ? 0 : kbFocusIndex - 1);
                showKbHint();
                break;

            case 'ArrowDown':
            case 'j':
                e.preventDefault();
                if (kbFocusIndex < 0) { setKbFocus(0); }
                else { setKbFocus(Math.min(kbFocusIndex + cols, cards.length - 1)); }
                showKbHint();
                break;

            case 'ArrowUp':
            case 'k':
                e.preventDefault();
                if (kbFocusIndex < 0) { setKbFocus(0); }
                else { setKbFocus(Math.max(kbFocusIndex - cols, 0)); }
                showKbHint();
                break;

            case 'Enter': {
                e.preventDefault();
                if (kbFocusIndex < 0 || kbFocusIndex >= cards.length) break;
                const card = cards[kbFocusIndex];
                const folderId = card.getAttribute('data-folder-id');
                const linkId   = card.getAttribute('data-id');
                if (folderId) {
                    // Open folder
                    clearKbFocus();
                    kbFocusIndex = -1;
                    navigateToFolder(folderId);
                } else if (linkId) {
                    // Open link in new tab
                    const link = links.find(l => l.id === linkId);
                    if (link) window.open(link.url, '_blank');
                }
                break;
            }

            case '/':
                // Jump to search bar
                e.preventDefault();
                clearKbFocus();
                kbFocusIndex = -1;
                searchInput.focus();
                searchInput.select();
                break;
        }
    });

    // Reset focus index when the grid re-renders (navigation, search, etc.)
    const _origRender = render;
    // Patch render to reset kb state on re-render
    const _renderObserver = new MutationObserver(() => {
        const cards = getCards();
        // If the focused index is now out of range, reset it
        if (kbFocusIndex >= cards.length) {
            kbFocusIndex = -1;
        }
        // Re-apply focus highlight if still valid
        if (kbFocusIndex >= 0 && cards[kbFocusIndex]) {
            cards[kbFocusIndex].classList.add('kb-focus');
        }
    });
    _renderObserver.observe(grid, { childList: true });

    // Clicking a card with the mouse clears keyboard focus
    grid.addEventListener('click', () => {
        clearKbFocus();
        kbFocusIndex = -1;
    }, true);
    </script>
</body>
</html>
