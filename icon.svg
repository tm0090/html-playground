<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#09090b"/>
  <!-- Outer ring -->
  <circle cx="256" cy="272" r="148" fill="none" stroke="#6366f1" stroke-width="18" opacity="0.3"/>
  <!-- Clock face -->
  <circle cx="256" cy="272" r="120" fill="#18181b" stroke="#6366f1" stroke-width="14"/>
  <!-- Hour hand -->
  <line x1="256" y1="272" x2="256" y2="192" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="256" y1="272" x2="316" y2="316" stroke="#6366f1" stroke-width="10" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="256" cy="272" r="10" fill="#6366f1"/>
  <!-- Tick marks -->
  <line x1="256" y1="162" x2="256" y2="176" stroke="#6366f1" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <line x1="366" y1="272" x2="352" y2="272" stroke="#6366f1" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <line x1="256" y1="382" x2="256" y2="368" stroke="#6366f1" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <line x1="146" y1="272" x2="160" y2="272" stroke="#6366f1" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <!-- Top label area -->
  <rect x="196" y="96" width="120" height="44" rx="12" fill="#6366f1" opacity="0.15"/>
  <text x="256" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#6366f1" letter-spacing="1">FINISH</text>
</svg>
