<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- App background -->
  <rect width="192" height="192" rx="42" fill="#0f0f1a"/>
  <!-- Top cap -->
  <rect x="44" y="30" width="104" height="16" rx="8" fill="#818cf8"/>
  <!-- Bottom cap -->
  <rect x="44" y="146" width="104" height="16" rx="8" fill="#818cf8"/>
  <!-- Hourglass outline -->
  <path d="M52,46 L140,46 L101,96 L140,146 L52,146 L91,96 Z" fill="none" stroke="#818cf8" stroke-width="5" stroke-linejoin="round"/>
  <!-- Sand top (nearly empty) -->
  <clipPath id="t"><path d="M52,46 L140,46 L101,96 L91,96 Z"/></clipPath>
  <rect x="48" y="72" width="96" height="28" fill="rgba(129,140,248,0.45)" clip-path="url(#t)"/>
  <!-- Sand bottom (full) -->
  <clipPath id="b"><path d="M91,96 L101,96 L140,146 L52,146 Z"/></clipPath>
  <rect x="48" y="96" width="96" height="54" fill="#818cf8" clip-path="url(#b)"/>
  <!-- Trickle dot -->
  <circle cx="96" cy="97" r="5" fill="white"/>
</svg>
